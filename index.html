<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy Council</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+JP:wght@400;500;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAFBFC;--bg2:#FFFFFF;--bg3:#F2F5F8;--bg4:#E8EDF2;
  --border:#E4EAF0;--border2:#CDD6E0;
  --text:#0D1B2A;--text2:#4A5E72;--text3:#8EA0B2;
  --c1:#23956a;--c1l:#E8F5EF;--c1d:#1a7a56;
  --c2:#2195ca;--c2l:#E8F4FB;--c2d:#1778a8;
  --c3:#e89f44;--c3l:#FEF5E8;
  --c4:#e45549;--c4l:#FEF0EF;
  --c5:#8dcba7;--c6:#6fc6ea;--c7:#f5b6c8;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 12px 40px rgba(0,0,0,.10),0 4px 12px rgba(0,0,0,.05);
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans','Noto Sans JP',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg3)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
textarea::-webkit-scrollbar{width:3px}
textarea::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* HEADER */
header{
  border-bottom:1px solid var(--border);
  padding:0 32px;
  height:56px;
  display:flex;
  align-items:center;
  gap:14px;
  background:rgba(255,255,255,.92);
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.logo{
  width:32px;height:32px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(35,149,106,.3);
}
.htitle{font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--text)}
.hsub{font-size:10px;color:var(--text3);letter-spacing:.1em;font-weight:500}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{
  background:none;
  border:1px solid var(--border);
  color:var(--text2);
  padding:6px 14px;
  border-radius:var(--r-sm);
  cursor:pointer;
  font-size:12px;
  font-family:inherit;
  font-weight:500;
  transition:all .15s;
  letter-spacing:.01em;
}
.hbtn:hover{border-color:var(--c1);color:var(--c1);background:var(--c1l)}
.hbtn.icon-btn{padding:6px 10px;display:flex;align-items:center;justify-content:center}
.hbtn.icon-btn:hover{border-color:var(--c1);color:var(--c1);background:var(--c1l)}
.hbtn.danger:hover{border-color:var(--c4);color:var(--c4);background:var(--c4l)}

main{max-width:780px;margin:0 auto;padding:32px 20px}

/* BUTTONS */
.btn{
  width:100%;
  padding:13px 20px;
  border:none;
  border-radius:var(--r-md);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  letter-spacing:-.01em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
.btn-accent{
  background:linear-gradient(135deg,var(--c1),var(--c1d));
  color:#fff;
  box-shadow:0 2px 12px rgba(35,149,106,.3);
}
.btn-accent:hover:not(:disabled){
  box-shadow:0 4px 20px rgba(35,149,106,.4);
  transform:translateY(-1px);
}
.btn-ghost{
  background:var(--bg3);
  border:1px solid var(--border);
  color:var(--text2);
  margin-top:8px;
}
.btn-ghost:hover{border-color:var(--border2);color:var(--text);background:var(--bg2)}
.btn-export{
  background:var(--bg2);
  border:1.5px solid var(--c1);
  color:var(--c1);
  margin-top:6px;
  font-weight:600;
}
.btn-export:hover{background:var(--c1l);box-shadow:0 2px 10px rgba(35,149,106,.15)}

/* INPUTS */
textarea,input[type=text],input[type=password]{
  width:100%;
  background:var(--bg2);
  border:1.5px solid var(--border);
  border-radius:var(--r-md);
  color:var(--text);
  padding:12px 14px;
  font-size:14px;
  font-family:inherit;
  outline:none;
  transition:all .2s;
  box-shadow:var(--shadow-sm);
}
textarea{resize:vertical;line-height:1.7}
textarea:focus,input:focus{
  border-color:var(--c1);
  box-shadow:0 0 0 3px rgba(35,149,106,.12),var(--shadow-sm);
}
textarea::placeholder,input::placeholder{color:var(--text3)}
.lbl{
  font-size:11px;
  font-weight:700;
  color:var(--text3);
  letter-spacing:.08em;
  display:block;
  margin-bottom:6px;
  text-transform:uppercase;
}
.input-wrap{position:relative}
.input-wrap input{padding-right:44px}
.eye{
  position:absolute;right:12px;top:50%;
  transform:translateY(-50%);
  background:none;border:none;
  color:var(--text3);cursor:pointer;font-size:14px;
  transition:color .15s;
}
.eye:hover{color:var(--text2)}

/* DROP ZONE */
.drop{
  border:2px dashed var(--border2);
  border-radius:var(--r-md);
  padding:20px;
  text-align:center;
  cursor:pointer;
  margin:10px 0;
  transition:all .2s;
  background:var(--bg3);
}
.drop:hover,.drop.drag{
  border-color:var(--c1);
  background:var(--c1l);
}
.fi-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  margin-bottom:5px;
  background:var(--bg2);
  box-shadow:var(--shadow-sm);
}
.fi-name{font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi-badge{font-size:9px;padding:2px 7px;border-radius:100px;background:var(--c1l);color:var(--c1);font-weight:700;letter-spacing:.06em}
.fi-rm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:0 3px;transition:color .15s}
.fi-rm:hover{color:var(--c4)}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:10px;box-shadow:var(--shadow-sm)}

/* PROJECT LIST */
.proj-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.proj-header h2{font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--text)}
.proj-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:16px 20px;
  margin-bottom:8px;
  cursor:pointer;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:16px;
  box-shadow:var(--shadow-sm);
}
.proj-card:hover{
  border-color:var(--c1);
  background:var(--bg2);
  box-shadow:var(--shadow-md);
  transform:translateY(-2px);
}
.proj-icon{
  width:42px;height:42px;
  border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.proj-info{flex:1;min-width:0}
.proj-name{font-size:14px;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.proj-meta{font-size:11px;color:var(--text3);font-weight:400}
.proj-status{font-size:10px;padding:4px 10px;border-radius:100px;font-weight:700;letter-spacing:.05em;flex-shrink:0}
.status-running{background:var(--c2l);color:var(--c2);border:1px solid rgba(33,149,202,.2)}
.status-done{background:var(--c1l);color:var(--c1);border:1px solid rgba(35,149,106,.2)}
.proj-actions{display:flex;gap:6px;flex-shrink:0}
.proj-btn{
  padding:5px 12px;
  border-radius:var(--r-sm);
  font-size:11px;font-weight:600;
  font-family:inherit;cursor:pointer;
  border:1px solid var(--border);
  background:none;color:var(--text2);
  transition:all .15s;
}
.proj-btn:hover{color:var(--text);border-color:var(--border2);background:var(--bg3)}
.proj-btn.del:hover{color:var(--c4);border-color:var(--c4);background:var(--c4l)}
.new-proj-btn{
  width:100%;
  padding:14px;
  border:2px dashed var(--border2);
  border-radius:var(--r-lg);
  background:none;
  color:var(--text3);
  font-size:13px;font-family:inherit;
  cursor:pointer;
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:8px;font-weight:500;
}
.new-proj-btn:hover{border-color:var(--c1);color:var(--c1);background:var(--c1l)}

/* AGENT BADGES */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.abadge{
  font-size:11px;padding:5px 12px;
  border-radius:100px;
  background:var(--bg3);
  border:1px solid var(--border);
  color:var(--text2);font-weight:500;
  display:inline-flex;align-items:center;gap:5px;
}

/* PROGRESS */
.prog-wrap{margin-bottom:24px}
.prog-stages{display:flex;align-items:flex-start;gap:0;position:relative}
.prog-stage{flex:1;text-align:center;position:relative}
.prog-stage:not(:last-child)::after{
  content:'';position:absolute;
  top:10px;left:55%;width:90%;height:2px;
  background:var(--border);z-index:0;
  border-radius:1px;
}
.prog-stage.done:not(:last-child)::after{background:var(--c1)}
.prog-dot{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--border);
  background:var(--bg2);
  margin:0 auto 6px;
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:700;
  transition:all .3s;
  color:var(--text3);
  box-shadow:var(--shadow-sm);
}
.prog-stage.done .prog-dot{background:var(--c1);border-color:var(--c1);color:#fff;box-shadow:0 2px 8px rgba(35,149,106,.3)}
.prog-stage.active .prog-dot{border-color:var(--c1);color:var(--c1);animation:glow 1.5s infinite;background:var(--c1l)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(35,149,106,.3)}50%{box-shadow:0 0 0 6px rgba(35,149,106,0)}}
.prog-name{font-size:9px;color:var(--text3);letter-spacing:.02em;line-height:1.3;font-weight:500}
.prog-stage.done .prog-name,.prog-stage.active .prog-name{color:var(--c1);font-weight:600}

/* STATUS BAR */
.status-bar{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;
  background:#FFFFFF;
  border:1.5px solid var(--border);
  border-radius:var(--r-md);
  margin-bottom:20px;
  font-size:12px;color:var(--text);
  font-weight:500;
  box-shadow:var(--shadow-sm);
}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sdot.running{background:var(--c1);animation:glow 1.2s infinite}
.sdot.ok{background:var(--c1)}
.sdot.err{background:var(--c4)}

/* AGENT CARDS */
.agent-card{
  border:1.5px solid var(--border);
  border-radius:var(--r-md);
  padding:16px;
  margin-bottom:10px;
  background:var(--bg2);
  transition:all .2s;
  box-shadow:var(--shadow-sm);
}
.agent-card:hover{box-shadow:var(--shadow-md)}
.agent-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.agent-name{font-size:11px;font-weight:700;letter-spacing:.05em}
.agent-q{
  font-size:11px;color:var(--text3);
  background:var(--bg3);
  padding:8px 12px;
  border-radius:var(--r-sm);
  margin-bottom:10px;
  line-height:1.6;
  border-left:2px solid var(--border2);
}
.agent-ans{font-size:13px;color:var(--text2);line-height:1.85;font-weight:400}
.dots{display:flex;gap:5px;padding:6px 0}
.dot{width:5px;height:5px;border-radius:50%}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.b1{animation:blink 1.2s infinite}
.b2{animation:blink 1.2s infinite .2s}
.b3{animation:blink 1.2s infinite .4s}

/* HISTORY / ACCORDION */
.hist-block{opacity:.35;margin-bottom:16px}
.hist-div{font-size:10px;color:var(--text3);letter-spacing:.12em;margin-bottom:8px;font-weight:700}
.accordion{border:1.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.accordion-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;cursor:pointer;
  background:var(--bg2);
  transition:background .15s;user-select:none;
}
.accordion-header:hover{background:var(--c1l)}
.accordion-phase{font-size:9px;font-weight:800;color:var(--c1);letter-spacing:.12em;min-width:64px;text-transform:uppercase}
.accordion-title{font-size:13px;font-weight:600;color:var(--text);flex:1;letter-spacing:-.01em}
.accordion-summary{font-size:11px;color:var(--text3);flex:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accordion-chevron{color:var(--text3);transition:transform .25s;flex-shrink:0}
.accordion-chevron.open{transform:rotate(180deg)}
.accordion-body{border-top:1px solid var(--border);padding:16px;background:#FAFCFE;display:none}
.accordion-body.open{display:block;animation:fadeUp .2s ease}
.accordion-agent{padding:10px 0;border-bottom:1px solid var(--border)}
.accordion-agent:last-child{border-bottom:none}
.accordion-agent-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.accordion-agent-name{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.accordion-agent-ans{font-size:12px;color:var(--text2);line-height:1.8}

/* PHASE */
.phase-lbl{font-size:10px;color:var(--c1);letter-spacing:.15em;font-weight:800;margin-bottom:4px;text-transform:uppercase}
.phase-ttl{font-size:17px;font-weight:700;margin-bottom:12px;letter-spacing:-.02em}
.ctx-box{
  font-size:12px;color:var(--c1d);
  padding:10px 14px 10px 16px;
  border-left:3px solid var(--c1);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin-bottom:16px;
  background:var(--c1l);
  font-weight:500;
}

/* MANAGER */
.mgr-panel{border:1.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-top:16px;box-shadow:var(--shadow-md)}
.mgr-hdr{
  display:flex;align-items:center;gap:10px;
  padding:14px 20px;
  background:linear-gradient(135deg,var(--c1l),var(--c2l));
  border-bottom:1px solid var(--border);
}
.mgr-body{padding:20px}
.env-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;padding:4px 12px;border-radius:100px;
  background:var(--c2l);color:var(--c2);
  border:1px solid rgba(33,149,202,.2);
  margin-bottom:16px;font-weight:600;
}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.score-item{
  background:var(--bg3);
  border-radius:var(--r-sm);
  padding:10px 12px;
  border:1px solid var(--border);
}
.score-name{font-size:10px;color:var(--text3);margin-bottom:6px;font-weight:700;letter-spacing:.04em}
.sbar-wrap{height:4px;background:var(--border);border-radius:2px;margin-bottom:5px;overflow:hidden}
.sbar{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.sval{font-size:14px;font-weight:700}
.total-box{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-radius:var(--r-md);
  margin-bottom:14px;border:1.5px solid var(--border);
  box-shadow:var(--shadow-sm);
}
.total-num{font-size:28px;font-weight:800;letter-spacing:-.04em}
.mgr-verdict{font-size:13px;color:var(--text2);line-height:1.85;margin-bottom:12px}
.mgr-feedback{
  font-size:12px;color:var(--text2);
  background:var(--c3l);
  padding:10px 14px;border-radius:var(--r-sm);
  line-height:1.7;border-left:3px solid var(--c3);
}
.loop-badge{
  margin-left:auto;font-size:10px;
  padding:3px 10px;border-radius:100px;
  background:rgba(232,159,68,.15);color:var(--c3);
  border:1px solid rgba(232,159,68,.3);font-weight:700;
}

/* SUMMARY */
.insight-box{
  background:linear-gradient(135deg,#F0FAF5,#EBF8F2);
  border:1.5px solid rgba(35,149,106,.2);
  border-radius:var(--r-lg);
  padding:20px;margin-bottom:16px;
  box-shadow:0 2px 10px rgba(35,149,106,.08);
}
.strat-box{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kv-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-sm)}
.kv-title{font-size:9px;letter-spacing:.15em;margin-bottom:10px;font-weight:800;text-transform:uppercase}
.kv-item{font-size:12px;color:var(--text2);padding:7px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;line-height:1.5}
.next-box{
  background:linear-gradient(135deg,var(--c2l),#F0F9FF);
  border:1.5px solid rgba(33,149,202,.2);
  border-radius:var(--r-md);padding:14px 18px;
  display:flex;align-items:center;gap:12px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(33,149,202,.08);
}
.approved-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;padding:4px 12px;border-radius:100px;
  background:var(--c1l);color:var(--c1);
  border:1.5px solid rgba(35,149,106,.25);font-weight:700;
}

/* MISC */
.spinner{text-align:center;padding:48px 0;font-size:13px;color:var(--text3);animation:blink 1.5s infinite;font-weight:500}
.err{font-size:12px;color:var(--c4);background:var(--c4l);border-radius:var(--r-sm);padding:10px 14px;margin-top:10px;border:1px solid rgba(228,85,73,.2);font-weight:500}
.retry-btn{margin-top:8px;padding:6px 16px;border-radius:var(--r-sm);border:1.5px solid var(--c4);background:none;color:var(--c4);font-size:11px;font-family:inherit;cursor:pointer;font-weight:600;transition:all .15s}
.retry-btn:hover{background:var(--c4l)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

/* RESUME BANNER */
.resume-banner{
  background:var(--c1l);
  border:1.5px solid rgba(35,149,106,.25);
  border-radius:var(--r-md);
  padding:14px 18px;margin-bottom:20px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 2px 8px rgba(35,149,106,.08);
}
.rbtn{padding:6px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:none;font-size:11px;font-family:inherit;cursor:pointer;font-weight:600;transition:all .15s}
.rbtn-yes{border-color:var(--c1);color:var(--c1);background:var(--bg2)}
.rbtn-yes:hover{background:var(--c1);color:#fff}
.rbtn-no{color:var(--text3)}

/* EXPORT MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(13,27,42,.4);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-xl);padding:24px;max-width:400px;width:92%;box-shadow:var(--shadow-lg);animation:fadeUp .2s ease}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px;letter-spacing:-.02em}
.mbtn{
  width:100%;padding:12px 16px;
  border-radius:var(--r-md);
  border:1.5px solid var(--border);
  background:var(--bg3);color:var(--text2);
  font-size:13px;font-family:inherit;cursor:pointer;
  text-align:left;display:flex;align-items:center;gap:12px;
  transition:all .15s;margin-bottom:8px;font-weight:500;
}

<script>
// ─── CONFIG ───
const AGENTS={

  designer:{name:"DESIGNER",icon:"designer",color:"#5B7FFF"},
  consultant:{name:"CONSULTANT",icon:"consultant",color:"#5B7FFF"},

};
const ICONS={
  marketer:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  designer:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
  consultant: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>',
  researcher: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  manager:    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  running:    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/><polyline points="1 20 1 14 7 14"/></svg>',
  done:       '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  logo:       '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
  globe:      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
};
const ROLES={
  marketer:`あなたは中小企業の売上改善を専門とするシニアマーケターです。【現状の課題→具体的施策→期待成果】の順で提言してください。
厳守事項：
①質問禁止。情報不足は合理的に補完して即提言する
②「まず〜から始め」「第1フェーズは〜」など段階的ステップで述べる
③施策は「何を・誰に・どうやって・いつまでに」を明記する
④抽象論禁止。「認知度向上」ではなく「Instagram週3投稿で3ヶ月後フォロワー1000人獲得」のように具体化
⑤200字以内で断言口調`,
  designer:`あなたは売上につながるUX/ブランドデザインを専門とするデザイナーです。【現状の問題点→改善施策→期待効果】の順で提言してください。
厳守事項：
①質問禁止。即提言する
②「LPのファーストビューを〜に変更しCVR3%向上」など施策と数値をセットで述べる
③現状から1ステップ上のリアルな改善を提案する（理想論禁止）
④200字以内で断言口調`,
  consultant:`あなたはMcKinsey出身で中小企業のP&L改善を専門とするコンサルタントです。【現状の財務課題→優先施策→ROI試算】の順で提言してください。
厳守事項：
①質問禁止。即分析・提言する
②「月次で〜万円のコスト削減」「3ヶ月でROI〜倍」など具体的財務インパクトを試算する
③現場が明日から実行できるレベルの施策を提案する（絵に描いた餅禁止）
④200字以内で断言口調`,
  researcher:`あなたはユーザー行動分析とインサイト抽出を専門とするUXリサーチャーです。【ユーザーの現状行動→潜在ニーズ→具体的対応策】の順で提言してください。
厳守事項：
①質問禁止。即分析・提言する
②「〜層は〜という課題を持ち、〜を求めている」など具体的ペルソナで述べる
③仮説で構わないが根拠を添える。「一般的に〜の傾向から推測すると」など
④200字以内で断言口調`,
};
const PHASES=["課題定義","市場分析","戦略立案","実行計画"];
const PHASE_JA=["課題・ゴール定義","市場・ユーザー分析","戦略立案","実行計画・KPI"];
const SCORE_ITEMS=["市場性","実現性","独自性","戦略整合性","ユーザー共感度"];
const PROJ_KEY="sc_projects";
const APIKEY_KEY="sc_apikey";

// ─── STATE ───
let apiKey="";
let cancelled=false;
let currentProjId=null;
function checkCancelled(){ if(cancelled) throw new Error("__CANCELLED__"); }
let st={
  step:"projects",project:"",files:[],
  phaseIdx:0,questions:null,ctx:"",answers:{},loading:null,
  history:[],mgrState:null,loopCount:0,
  summary:null,error:"",busy:false,statusMsg:"",
};

// ─── PROJECT STORAGE ───
function getProjects(){try{return JSON.parse(localStorage.getItem(PROJ_KEY)||"[]");}catch{return[];}}
function saveProject(proj){
  const projs=getProjects();
  const idx=projs.findIndex(p=>p.id===proj.id);
  if(idx>=0)projs[idx]=proj; else projs.unshift(proj);
  localStorage.setItem(PROJ_KEY,JSON.stringify(projs));
}
function deleteProject(id){
  const projs=getProjects().filter(p=>p.id!==id);
  localStorage.setItem(PROJ_KEY,JSON.stringify(projs));
}
function saveCurrent(){
  if(!currentProjId)return;
  const projs=getProjects();
  const proj=projs.find(p=>p.id===currentProjId)||{id:currentProjId};
  proj.state={...st,files:st.files.map(f=>f.type==="text"?f:{...f,data:"[binary]"})};
  proj.name=st.project?.slice(0,40)||"無題";
  proj.updatedAt=new Date().toISOString();
  proj.status=st.step==="summary"?"done":"running";
  proj.score=st.mgrState?Object.values(st.mgrState.scores||{}).reduce((a,b)=>a+b,0):null;
  saveProject(proj);
}

// ─── RENDER ───
function S(u){
  Object.assign(st,u);
  if(!Array.isArray(st.brushupLog))st.brushupLog=[];
  if(!Array.isArray(st.files))st.files=[];
  if(!Array.isArray(st.history))st.history=[];
  if(!st.materials)st.materials="";
  if(!st.facts)st.facts="";
  if(!st.extraQuestions)st.extraQuestions=[];
  if(!st.extraAnswers)st.extraAnswers={};
  if(st.step!=="projects"&&st.step!=="apikey"&&st.step!=="input")saveCurrent();
  // statusMsgだけの更新なら部分更新（フラッシュ防止）
  if(Object.keys(u).length===1&&u.statusMsg!==undefined){
    const el=document.getElementById("statusMsg");
    if(el){el.textContent=u.statusMsg;return;}
  }
  render();
}

function render(){
  const hr=document.getElementById("hright");
  hr.style.display=(st.step==="meeting"||st.step==="manager"||st.step==="summary"||st.step==="input")?"flex":"none";
  const app=document.getElementById("app");
  // スクロール位置を保持
  const scrollY=window.scrollY;
  if(st.step==="apikey")app.innerHTML=renderApiKey();
  else if(st.step==="projects")app.innerHTML=renderProjects();
  else if(st.step==="input")app.innerHTML=renderInput();
  else if(st.step==="meeting")app.innerHTML=renderMeeting();
  else if(st.step==="manager")app.innerHTML=renderManager();
  else app.innerHTML=renderSummary();
  bindEvents();
  // スクロール位置を復元（カウントダウン中の跳ね防止）
  if(st.busy&&st.statusMsg)window.scrollTo(0,scrollY);
}

// ── API KEY ──
function renderApiKey(){
  const saved=localStorage.getItem(APIKEY_KEY)||"";
  return`<div class="api-screen fade">
    <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#23956a,#2195ca);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 4px 20px rgba(35,149,106,.3)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </div>
    <h2>Strategy Council</h2>
    <p>Anthropic APIキーを入力して<br>AIマルチエージェント会議を始めましょう。</p>
    ${saved?`<div class="saved-key-box"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg> ${saved.slice(0,20)}••••</span><button class="forget-btn" onclick="forgetKey()">削除</button></div>`:""}
    <div class="input-wrap" style="margin-bottom:10px">
      <input type="password" id="apiKeyInput" placeholder="${saved?"変更する場合のみ入力":"sk-ant-api03-..."}"/>
      <button class="eye" onclick="toggleEye()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <p class="api-note">取得先: <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a></p>
    <button class="btn btn-accent" onclick="submitApiKey()">開始する →</button>
  </div>`;
}
function toggleEye(){const i=document.getElementById("apiKeyInput");if(i)i.type=i.type==="password"?"text":"password";}
function forgetKey(){if(confirm("APIキーを削除しますか？")){localStorage.removeItem(APIKEY_KEY);apiKey="";render();}}
function submitApiKey(){
  const v=document.getElementById("apiKeyInput")?.value?.trim();
  const saved=localStorage.getItem(APIKEY_KEY)||"";
  const key=v||saved;
  if(!key||!key.startsWith("sk-"))return alert("正しいAPIキーを入力してください");
  if(v)localStorage.setItem(APIKEY_KEY,v);
  apiKey=key;
  S({step:"projects"});
}

// ── PROJECTS ──
function renderProjects(){
  const projs=getProjects();
  const list=projs.length===0
    ?`<div style="text-align:center;padding:40px 0;color:var(--text3);font-size:13px">プロジェクトがありません<br><span style="font-size:11px">下のボタンから新規作成してください</span></div>`
    :projs.map(p=>{
      const d=new Date(p.updatedAt);
      const dateStr=`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
      const statusEl=p.status==="done"
        ?`<span class="proj-status status-done">✓ DONE${p.score?` · ${p.score}pt`:""}</span>`
        :`<span class="proj-status status-running">● 進行中</span>`;
      const icon=p.status==="done"?ICONS.done:ICONS.running;
      const iconBg=p.status==="done"?"linear-gradient(135deg,#E8F5EF,#D4EDE2)":"linear-gradient(135deg,#EBF6FF,#D8EEFA)";
      const iconColor=p.status==="done"?"#23956a":"#2195ca";
      return`<div class="proj-card" onclick="openProject('${p.id}')">
        <div class="proj-icon" style="background:${iconBg};color:${iconColor}">${icon}</div>
        <div class="proj-info">
          <div class="proj-name">${p.name||"無題"}</div>
          <div class="proj-meta">更新: ${dateStr}</div>
        </div>
        ${statusEl}
        <div class="proj-actions" onclick="event.stopPropagation()">
          ${p.status!=="done"?`<button class="proj-btn" onclick="event.stopPropagation();openProject('${p.id}')">再開</button>`:""}
          <button class="proj-btn del" onclick="event.stopPropagation();removeProject('${p.id}')">削除</button>
        </div>
      </div>`;
    }).join("");
  return`<div class="fade">
    <div class="proj-header">
      <div>
        <div style="font-size:10px;color:var(--text3);letter-spacing:.12em;margin-bottom:4px;font-weight:700;text-transform:uppercase">My Projects</div>
        <h2 style="font-size:24px;font-weight:800;letter-spacing:-.04em">マイプロジェクト</h2>
      </div>
      <button class="hbtn" onclick="S({step:'apikey'})">APIキー設定</button>
    </div>
    ${list}
    <button class="new-proj-btn" onclick="newProject()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新規プロジェクトを作成
    </button>
  </div>`;
}
function openProject(id){
  const projs=getProjects();
  const proj=projs.find(p=>p.id===id);
  if(!proj){alert("プロジェクトが見つかりません");return;}
  currentProjId=id;
  if(proj.state&&proj.state.step){
    // stateが存在して有効なstepがある場合のみ復元
    Object.assign(st,proj.state);
    st.busy=false;st.loading=null;st.error="";
    if(!Array.isArray(st.brushupLog))st.brushupLog=[];
    if(!Array.isArray(st.files))st.files=[];
    if(!Array.isArray(st.history))st.history=[];
    if(!st.step||st.step==="projects")st.step="input";
  } else {
    // stateがない場合はinput画面で開く
    st.step="input";
    st.project=proj.name||"";
    st.files=[];
    st.history=[];
    st.brushupLog=[];
  }
  render();
}

async function resumeFromSave(){
  cancelled=false;
  if(!apiKey||!apiKey.startsWith("sk-")){
    S({error:"APIキーが見つかりません。ページを再読み込みしてください。"});
    return;
  }
  // バイナリファイルが[binary]になっている場合は除去
  const binaryFiles=st.files.filter(f=>f.data==="[binary]");
  if(binaryFiles.length>0){
    st.files=st.files.filter(f=>f.data!=="[binary]");
    S({needsReattach:binaryFiles.map(f=>f.name)});
  }
  const h=st.history||[];
  const phasesDone=h.length;
  if(st.step==="manager"){
    S({busy:true,statusMsg:"マネージャー審査を再開中...",error:""});
    const histText=buildHistText(h);
    const loopCount=st.loopCount||0;
    await runManagerAuto(histText,"",loopCount,h);
  } else if(phasesDone<PHASE_JA.length){
    const nextPhase=phasesDone;
    S({busy:true,statusMsg:`Phase ${nextPhase+1}から再開中...`,answers:{},questions:null,error:""});
    await runPhase(nextPhase,h);
  } else {
    S({error:"再開できる状態ではありません。新規プロジェクトを作成してください。"});
  }
}
function newProject(){
  currentProjId="proj_"+Date.now();
  st={step:"input",project:"",files:[],facts:"",phaseIdx:0,questions:null,ctx:"",answers:{},loading:null,history:[],mgrState:null,loopCount:0,summary:null,error:"",busy:false,statusMsg:""};
  render();
}
function removeProject(id){
  cancelled=true;
  setTimeout(()=>{
    cancelled=false;
    deleteProject(id);
    if(currentProjId===id){currentProjId=null;st={...st,step:"projects"};}
    render();
  },100);
}

// ── INPUT ──
function renderInput(){
  const flist=st.files&&st.files.length>0?st.files.map((f,i)=>`<div class="fi-item"><span style="font-size:11px;color:var(--text3);font-weight:600">${f.type==="pdf"?"PDF":"TXT"}</span><span class="fi-name">${f.name}</span><button class="fi-rm" onclick="removeFile(${i})">×</button></div>`).join(""):"";
  return`<div class="fade">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px">
      <button onclick="S({step:'projects'})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1">‹</button>
      <div style="font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.01em">新規プロジェクト</div>
    </div>
    <div class="badges">
      ${Object.values(AGENTS).map(a=>`<span class="abadge" style="display:inline-flex;align-items:center;gap:5px"><span style="color:var(--text3)">${ICONS[a.icon]}</span>${a.name}</span>`).join("")}
      <span class="abadge" style="border-color:rgba(33,149,202,.3);color:var(--c2);background:var(--c2l);display:inline-flex;align-items:center;gap:5px">${ICONS.manager} MANAGER</span>
    </div>
    <label class="lbl" style="font-size:11px;font-weight:800;color:var(--text3)">企画の概要</label>
    <textarea id="ptxt" rows="5" placeholder="例：30代向けオーガニックスキンケアブランドをD2Cで展開したい。競合は資生堂ナチュラルライン。初年度予算3000万円。">${st.project}</textarea>
    <label class="lbl" style="margin-top:12px">確定している事実・数値（任意）</label>
    <textarea id="factstxt" rows="4" placeholder="例：&#10;・月間問い合わせ数：約30件&#10;・成約率：10%&#10;・客単価：15万円&#10;・主な流入：紹介80%、SNS20%&#10;※エージェントはここに書いた数値を推論せず事実として使います">${st.facts||""}</textarea>
    <label class="lbl" style="margin-top:12px">参考資料（任意）</label>
    <div class="drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div style="margin-bottom:5px;color:var(--text3)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></div>
      <div style="font-size:12px;color:var(--text2)">PDF・テキストをドロップ（画像不可）</div>
      <div style="font-size:10px;color:var(--text3);margin-top:2px">テキストに変換して送信されます</div>
    </div>
    ${flist}
    <label class="lbl" style="margin-top:8px">または直接テキストで入力</label>
    <textarea id="materialtxt" rows="3" placeholder="資料の内容や補足情報をここに直接入力することもできます">${st.materials||""}</textarea>
    ${st.error?`<div class="err">${st.error}</div>`:""}
    <button class="btn btn-accent" id="startBtn" onclick="startMeeting()" ${st.project.trim()?"":"disabled"}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Start Meeting
    </button>
    ${st.history&&st.history.length>0?`<button class="btn btn-ghost" style="margin-top:6px" onclick="backToMeeting()">← 会議画面に戻る</button>`:""}
    <button class="btn btn-ghost" onclick="S({step:'projects'})">← 戻る</button>
  </div>`;
}

// ── MEETING ──
function renderMeeting(){
  const progDots=["課題定義","市場分析","戦略立案","実行計画","Manager審査"].map((name,i)=>{
    const cls=i<st.phaseIdx?"done":i===st.phaseIdx?"active":"";
    return`<div class="prog-stage ${cls}"><div class="prog-dot">${i<st.phaseIdx?"✓":i+1}</div><div class="prog-name">${name}</div></div>`;
  }).join("");
  const sdot=st.error?`<div class="sdot err"></div>`:`<div class="sdot ${st.busy?"running":"ok"}"></div>`;
  const statusBox=`<div class="status-bar">${sdot}<span id="statusMsg" style="font-size:12px">${st.error||st.statusMsg||"自動実行中..."}</span></div>`;
  const reattachBanner="";
  const hist=st.history.map((r,ri)=>{
    // アコーディオンのサマリー（各エージェントの回答を短縮して表示）
    const summaryText=Object.values(r.answers).map(a=>a.slice(0,20)).join(" / ");
    const agentCards=Object.entries(r.answers).map(([id,a])=>`
      <div class="accordion-agent">
        <div class="accordion-agent-head">
          <span style="color:var(--text3);display:flex;align-items:center">${ICONS[AGENTS[id].icon]||""}</span>
          <span class="accordion-agent-name" style="color:#23956a">${AGENTS[id].name}</span>
        </div>
        <div class="accordion-agent-ans">${a}</div>
      </div>`).join("");
    return`<div class="accordion">
      <div class="accordion-header" onclick="toggleAccordion(${ri})">
        <span class="accordion-phase">${PHASES[ri]}</span>
        <span class="accordion-title">${PHASE_JA[ri]}</span>
        <span class="accordion-summary">${summaryText}...</span>
        <svg id="acc-chevron-${ri}" class="accordion-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div id="acc-body-${ri}" class="accordion-body">
        ${agentCards}
      </div>
    </div>`;
  }).join("");
  let cur="";
  if(!st.questions&&!st.busy){
    // 止まっている状態 - 再開ボタンを表示
    cur=`<div style="text-align:center;padding:32px 0">
      <div style="font-size:13px;color:var(--text2);margin-bottom:16px">会議が一時停止しています</div>
      <button class="btn btn-accent" style="max-width:240px" onclick="retryFromError()">▶ 続きから再開する</button>
    </div>`;
  } else if(!st.questions&&st.busy){cur=`<div class="spinner">質問を生成中...</div>`;}
  else if(st.questions){
    const cards=Object.keys(AGENTS).map(id=>{
      const a=st.answers[id],isL=st.loading===id,q=st.questions[id]||"";
      return`<div class="agent-card" style="border-color:${a?AGENTS[id].color+"30":"var(--border)"}">
        <div class="agent-head"><span style="color:var(--text3);display:flex;align-items:center">${ICONS[AGENTS[id].icon]||""}</span><span class="agent-name" style="color:var(--accent)">${AGENTS[id].name}</span>
        <span style="margin-left:auto;font-size:10px;color:${a?"var(--green)":isL?"var(--accent)":"var(--text3)"}">${a?"✓ 完了":isL?"考え中...":"待機中..."}</span>
        </div>${q?`<div class="agent-q">${q}</div>`:""}
        ${a?`<div class="agent-ans">${a}</div>`:isL?`<div class="dots"><div class="dot b1" style="background:${AGENTS[id].color}"></div><div class="dot b2" style="background:${AGENTS[id].color}"></div><div class="dot b3" style="background:${AGENTS[id].color}"></div></div>`:""}
      </div>`;
    }).join("");
    cur=`<div class="fade"><div class="phase-lbl">${PHASES[st.phaseIdx]}</div><div class="phase-ttl">${PHASE_JA[st.phaseIdx]}</div>${st.ctx?`<div class="ctx-box">${st.ctx}</div>`:""}${cards}</div>`;
  }
  return`<div><div class="prog-wrap"><div class="prog-stages">${progDots}</div></div>${statusBox}${reattachBanner}${hist}${cur}${st.error?`<div class="err">${st.error}<br><button class="retry-btn" onclick="retryFromError()">リトライ</button></div>`:""}</div>`;
}

// ── MANAGER ──
function renderManager(){
  // First time (no mgrState yet): show spinner
  if(!st.mgrState&&!st.busy)return`<div style="text-align:center;padding:32px 0">
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">マネージャー審査が一時停止しています</div>
    <button class="btn btn-accent" style="max-width:240px" onclick="retryFromError()">▶ 続きから再開する</button>
  </div>`;
  if(!st.mgrState)return`<div class="spinner">マネージャーが仮想空間でシミュレーション中...<br><span style="font-size:11px;display:block;margin-top:6px">ループ ${st.loopCount}/30</span></div>`;
  const m=st.mgrState;if(!m)return`<div class="spinner">読み込み中...</div>`;
  // 各スコアを0-20にクランプ
if(m.scores){Object.keys(m.scores).forEach(k=>{m.scores[k]=Math.min(20,Math.max(0,parseInt(m.scores[k])||0));});}
const total=Object.values(m.scores||{}).reduce((a,b)=>a+b,0);
  const approved=total>=95;
  const sc=approved?"var(--green)":total>=70?"var(--amber)":"var(--red)";
  const sbg=approved?"#071A0F":total>=70?"#1A1300":"#1A0508";
  const scoreCards=SCORE_ITEMS.map(k=>{
    const v=m.scores?.[k]||0;const c=v>=19?"var(--green)":v>=15?"var(--amber)":"var(--red)";
    return`<div class="score-item"><div class="score-name">${k}</div><div class="sbar-wrap"><div class="sbar" style="width:${v*5}%;background:${c}"></div></div><div class="sval" style="color:${c}">${v}<span style="font-size:10px;color:var(--text3)">/20</span></div></div>`;
  }).join("");
  const statusMsg=approved?`<div style="font-size:12px;color:var(--green);padding:6px 0;animation:blink 1.5s infinite">✓ Approved — 最終レポートを生成中...</div>`
    :st.loopCount>=40?`<div class="err" style="background:#FEF0EF;color:#c0392b;border-color:rgba(228,85,73,.2)">最大回数（40回）に到達しました。</div>`
    :st.loopCount>=30&&!st.extraMode&&!st.busy?`<div style="border:1.5px solid #2195ca;border-radius:12px;padding:18px;margin-top:12px;background:linear-gradient(135deg,#EBF6FF,#F0F8FF)">
        <div style="font-size:14px;font-weight:700;color:#2195ca;margin-bottom:6px">🔍 追加ブラッシュアップで精度を上げる</div>
        <div style="font-size:12px;color:#4A5E72;margin-bottom:14px">エージェントがいくつか質問します。回答することでより現実的・具体的な分析が可能になります（最大+10回）</div>
        <button class="btn btn-accent" style="max-width:240px;margin:0" onclick="startExtraMode()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          さらに10回ブラッシュアップする
        </button>
      </div>`
    :`<div style="font-size:12px;color:var(--text3);padding:6px 0;animation:blink 1.5s infinite">ブラッシュアップ中... (${st.loopCount}/30)</div>`;
  return`<div class="fade">
    <div class="mgr-panel">
      <div class="mgr-hdr">
        ${ICONS.manager}
        <span style="font-size:13px;font-weight:700;letter-spacing:-.01em">マネージャー審査</span>
        <span class="loop-badge">ループ ${st.loopCount}/30</span>
        ${approved?`<span style="margin-left:8px;font-size:10px;font-weight:700;color:var(--green)">✓ 承認済み</span>`:""}
      </div>
      <div class="mgr-body">
        ${m.env?`<div class="env-badge" style="display:inline-flex;align-items:center;gap:5px">${ICONS.globe} ${m.env}</div>`:""}
        <div class="score-grid">${scoreCards}</div>
        <div class="total-box" style="background:${sbg}">
          <div><div style="font-size:10px;color:var(--text3);margin-bottom:2px;letter-spacing:.08em">TOTAL SCORE</div>
          <div class="total-num" style="color:${sc}">${total}<span style="font-size:13px;font-weight:400">/100</span></div></div>
          <div style="font-size:11px;font-weight:700;color:${sc}">${approved?"✓ 95点以上 承認":total>=70?"△ ブラッシュアップ中":"✗ 再検討中"}</div>
        </div>
        ${m.verdict?`<div class="mgr-verdict">${m.verdict}</div>`:""}
        ${m.feedback&&!approved?`<div class="mgr-feedback">${m.feedback}</div>`:""}
        ${st.busy && !st.brushupProgress?.active ? `<div style="font-size:12px;color:var(--text3);padding:6px 0;animation:blink 1.5s infinite">${st.statusMsg||"マネージャーが審査中..."}</div>` : statusMsg}
        ${(()=>{return (st.brushupLog&&Array.isArray(st.brushupLog)&&st.brushupLog.length>0)?renderBrushupProgress():"";})()}
      </div>
    </div>
    ${st.extraMode&&st.extraQuestions.length>0?renderExtraQuestions():""}
    ${st.error?`<div class="err">${st.error}<br><button class="retry-btn" onclick="retryBrushup()">リトライ</button></div>`:""}
  </div>`;
}

function updateExtraAnswer(idx,val){
  if(!st.extraAnswers)st.extraAnswers={};
  st.extraAnswers={...st.extraAnswers,[idx]:val};
}

function renderExtraQuestions(){
  const qs=st.extraQuestions||[];
  if(qs.length===0)return"";
  const qForms=qs.map((q,i)=>{
    const ans=st.extraAnswers?.[i]||"";
    return "<div style=\"margin-bottom:14px\"><div style=\"font-size:12px;font-weight:600;color:#1A2A38;margin-bottom:6px\">"+(i+1)+". "+q+"</div><textarea rows=\"2\" style=\"width:100%;border:1.5px solid #E4EAF0;border-radius:8px;padding:8px 12px;font-size:12px;font-family:inherit;resize:none;outline:none\" oninput=\"updateExtraAnswer("+i+",this.value)\" placeholder=\"回答を入力してください...\">"+ans+"</textarea></div>";
  }).join("");
  return`<div style="margin-top:16px;border:1.5px solid #2195ca;border-radius:12px;padding:18px;background:#EBF6FF">
    <div style="font-size:12px;font-weight:700;color:#2195ca;margin-bottom:4px">エージェントからの質問</div>
    <div style="font-size:11px;color:#4A5E72;margin-bottom:14px">回答することでより精度の高い分析が可能になります</div>
    ${qForms}
    <button class="btn btn-accent" style="margin-top:4px" onclick="submitExtraAnswers()">回答して再分析する</button>
  </div>`;
}

function renderBrushupProgress(){
  if(!st.brushupLog||!Array.isArray(st.brushupLog)||st.brushupLog.length===0)return"";
  const rounds=st.brushupLog.map(round=>{
    const cards=Object.keys(AGENTS).map(id=>{
      const entry=round.agents[id];
      if(!entry)return"";
      const isDone=entry.status==="done";
      const isThinking=entry.status==="thinking";
      return`<div style="border:1px solid ${isDone?AGENTS[id].color+"50":isThinking?AGENTS[id].color+"80":"var(--border)"};border-radius:8px;padding:9px 12px;margin-bottom:6px;background:var(--bg);transition:all .3s">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:${isDone?"5px":"0"}">
          <span style="color:var(--text3);display:flex">${ICONS[AGENTS[id].icon]}</span>
          <span style="font-size:11px;font-weight:700;color:var(--accent)">${AGENTS[id].name}</span>
          <span style="margin-left:auto;font-size:10px;color:${isDone?"var(--green)":isThinking?"var(--accent)":"var(--text3)"};font-weight:600">${isDone?"✓ 完了":isThinking?"改善中...":"待機"}</span>
        </div>
        ${isThinking?`<div style="display:flex;gap:4px;padding:3px 0"><div class="dot b1" style="background:var(--accent)"></div><div class="dot b2" style="background:var(--accent)"></div><div class="dot b3" style="background:var(--accent)"></div></div>`:""}
        ${isDone&&entry.ans?`<div style="font-size:12px;color:var(--text2);line-height:1.75;margin-top:2px">${entry.ans}</div>`:""}
      </div>`;
    }).join("");
    return`<div style="margin-bottom:16px">
      <div style="font-size:10px;color:var(--amber);letter-spacing:.1em;font-weight:700;margin-bottom:8px">ROUND ${round.round} — ${round.feedback||"品質改善中"}</div>
      ${cards}
    </div>`;
  }).join("");
  return`<div style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px">${rounds}</div>`;
}

// ── SUMMARY ──
function renderSummary(){
  const s=st.summary||{};
  const total=Object.values(st.mgrState?.scores||{}).reduce((a,b)=>a+b,0);
  const sc=total>=95?"#23956a":total>=70?"#b87000":"#c0392b";
  const sbg=total>=95?"#E8F5EF":total>=70?"#FEF5E8":"#FEF0EF";

  // アクションプラン（Phase別カード）
  const phaseColors=["#23956a","#2195ca","#e89f44"];
  const phaseIcons=["🚀","📈","🏆"];
  const actionCards=(s.actions||[]).map((a,i)=>{
    const c=phaseColors[i]||"#8dcba7";
    const icon=phaseIcons[i]||"◆";
    const label=["Phase 1","Phase 2","Phase 3"][i]||"Action "+(i+1);
    return`<div style="flex:1;min-width:200px;background:#fff;border-radius:14px;padding:18px;border:2px solid ${c};position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;right:0;height:4px;background:${c}"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-size:18px">${icon}</span>
        <span style="font-size:10px;font-weight:800;color:${c};letter-spacing:.1em;text-transform:uppercase">${label}</span>
      </div>
      <div style="font-size:12px;color:#1A2A38;line-height:1.75">${a}</div>
    </div>`;
  }).join(`<div style="display:flex;align-items:center;color:#C8D8E4;font-size:22px;flex-shrink:0;padding:0 4px">→</div>`);

  // KPIカード
  const kpiIcons=["📊","💰","🔄"];
  const kpiCards=(s.kpi||[]).map((k,i)=>{
    const parts=k.split("：");
    const label=parts[0]||k;
    const value=parts[1]||"";
    return`<div style="flex:1;background:linear-gradient(135deg,#F0FAF5,#E8F5EF);border-radius:12px;padding:16px;text-align:center;border:1.5px solid rgba(35,149,106,.2)">
      <div style="font-size:22px;margin-bottom:6px">${kpiIcons[i]||"◆"}</div>
      <div style="font-size:11px;font-weight:700;color:#23956a;margin-bottom:4px">${label}</div>
      ${value?`<div style="font-size:12px;color:#4A6070;line-height:1.5">${value}</div>`:""}
    </div>`;
  }).join("");

  // スコアゲージ（マネージャー審査）
  const scoreItems=["市場性","実現性","独自性","戦略整合性","ユーザー共感度"];
  const scoreGauges=scoreItems.map(k=>{
    const v=st.mgrState?.scores?.[k]||0;
    const c=v>=16?"#23956a":v>=12?"#b87000":"#c0392b";
    const pct=v/20*100;
    return`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:12px;font-weight:600;color:#1A2A38">${k}</span>
        <span style="font-size:13px;font-weight:700;color:${c}">${v}<span style="font-size:10px;color:#8AA0B0">/20</span></span>
      </div>
      <div style="height:6px;background:#E8EEF2;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${c};border-radius:3px"></div>
      </div>
    </div>`;
  }).join("");

  return`<div class="fade">
    <!-- ヘッダー -->
    <div style="background:linear-gradient(135deg,#23956a,#2195ca);border-radius:var(--r-xl);padding:28px;margin-bottom:20px;color:#fff;box-shadow:0 4px 24px rgba(35,149,106,.2)">
      <div style="font-size:10px;letter-spacing:.2em;opacity:.75;margin-bottom:8px;font-weight:600">FINAL REPORT</div>
      <div style="font-size:22px;font-weight:800;line-height:1.3;margin-bottom:14px;letter-spacing:-.02em">${s.title||"マーケティング戦略レポート"}</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span style="background:rgba(255,255,255,.2);padding:5px 14px;border-radius:100px;font-size:12px;font-weight:700;backdrop-filter:blur(8px)">✓ ${total}/100点 承認済み</span>
        <span style="opacity:.65;font-size:11px">${new Date().toLocaleDateString("ja-JP")}</span>
      </div>
    </div>

    <!-- KEY INSIGHT -->
    <div style="background:linear-gradient(135deg,#F0FAF5,#EBF8F2);border:1.5px solid rgba(35,149,106,.2);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;border-left:4px solid #23956a;box-shadow:0 2px 10px rgba(35,149,106,.08)">
      <div style="font-size:10px;font-weight:800;color:#23956a;letter-spacing:.15em;margin-bottom:8px;text-transform:uppercase">Key Insight</div>
      <div style="font-size:17px;font-weight:700;color:#1A2A38;line-height:1.55;margin-bottom:12px">${s.keyInsight||""}</div>
      <div style="font-size:13px;color:#4A6070;line-height:1.9">${s.strategy||""}</div>
    </div>

    <!-- ACTION PLAN -->
    <div style="background:#fff;border:1.5px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)">
      <div style="font-size:10px;font-weight:800;color:#2195ca;letter-spacing:.15em;margin-bottom:6px;text-transform:uppercase">Action Plan</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:16px;letter-spacing:-.02em">実行ロードマップ</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${actionCards}</div>
    </div>

    <!-- KPI -->
    <div style="background:#fff;border:1.5px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)">
      <div style="font-size:10px;font-weight:800;color:#e89f44;letter-spacing:.15em;margin-bottom:6px;text-transform:uppercase">KPI</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:16px;letter-spacing:-.02em">成果指標</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${kpiCards}</div>
    </div>

    <!-- NEXT ACTION -->
    ${s.nextStep?`<div style="background:linear-gradient(135deg,#EBF6FF,#F0F8FF);border:1.5px solid rgba(33,149,202,.2);border-radius:var(--r-md);padding:16px 20px;display:flex;align-items:center;gap:14px;margin-bottom:16px">

function buildReport(){
  const s=st.summary||{};const m=st.mgrState;

  let t=`STRATEGY COUNCIL — Final Report\n${"═".repeat(50)}\n\n`;
  t+=`Project: ${st.project}\nGenerated: ${new Date().toLocaleString("ja-JP")}\n\n`;
  t+=`${"─".repeat(40)}\nMEETING LOG\n\n`;
  st.history.forEach((r,i)=>{t+=`■ Phase ${i+1}: ${PHASE_JA[i]}\n`;Object.entries(r.answers).forEach(([id,a])=>{t+=`\n[${AGENTS[id].name}]\n${a}\n`;});t+="\n";});

}

function bindEvents(){
  const t=document.getElementById("ptxt");
  if(t)t.addEventListener("input",e=>{st.project=e.target.value;const b=document.getElementById("startBtn");if(b)b.disabled=!st.project.trim();});
  const ft=document.getElementById("factstxt");
  if(ft)ft.addEventListener("input",e=>{st.facts=e.target.value;});
  const mt=document.getElementById("materialtxt");
  if(mt)mt.addEventListener("input",e=>{st.materials=e.target.value;});
  const dz=document.getElementById("dropZone");
  if(dz){
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag");});
    dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));
    dz.addEventListener("drop",async e=>{e.preventDefault();dz.classList.remove("drag");await addFiles(Array.from(e.dataTransfer.files));});
  }
  const fi=document.getElementById("fileInput");
  if(fi)fi.onchange=async e=>{await addFiles(Array.from(e.target.files));fi.value="";};

}

async function addFiles(raw){const p=(await Promise.all(raw.map(pf))).filter(Boolean);st.files=[...st.files,...p];render();}
async function pf(f){
  const ext=f.name.split(".").pop().toLowerCase();
  if(f.type==="application/pdf"||ext==="pdf"){
    // PDFはページ内テキストを抽出してtext型として保存
    try{
      const arrayBuf=await f.arrayBuffer();
      const txt=await extractPdfText(arrayBuf);
      return{type:"text",name:f.name,data:txt.slice(0,3000)};
    }catch(e){
      // 抽出失敗時はファイル名のみ記録
      return{type:"text",name:f.name,data:`[${f.name}のテキスト抽出に失敗しました]`};
    }
  }else if(f.type.startsWith("image/")){
    alert("画像ファイルはトークン消費が大きいため対応していません。テキストエリアに内容を貼り付けてください。");
    return null;
  }else{
    const d=await toTxt(f);
    return{type:"text",name:f.name,data:d.slice(0,3000)};
  }
}

async function extractPdfText(arrayBuf){
  // ブラウザでPDFテキスト抽出（pdfjs-distを使用）
  const pdfjsLib=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.mjs");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.mjs";
  const pdf=await pdfjsLib.getDocument({data:arrayBuf}).promise;
  let text="";
  for(let i=1;i<=Math.min(pdf.numPages,10);i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    pages.push(content.items.map(function(item){return item.str;}).join(" "));

  }
  return text||"[テキストを抽出できませんでした]";
}
function b64(f){return new Promise((r,j)=>{const rd=new FileReader();rd.onload=()=>r(rd.result.split(",")[1]);rd.onerror=j;rd.readAsDataURL(f);});}
function toTxt(f){return new Promise((r,j)=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.onerror=j;rd.readAsText(f);});}
function removeFile(i){st.files=st.files.filter((_,idx)=>idx!==i);render();}

// ── API ──
async function api(system,msg,retryCount=0){
  const content=[];
  for(const f of (st.files||[])){
    if(f.data&&f.data!=="[binary]"){
      content.push({type:"text",text:"[資料: "+f.name+"]\n"+f.data.slice(0,2000)});
    }
  }
  content.push({type:"text",text:msg});
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,system,messages:[{role:"user",content}]})});
  const data=await res.json();
  if(data.error){
    if(res.status===429||data.error.message?.includes("rate limit")||data.error.message?.includes("token")){
      if(retryCount>=3)throw new Error("レート制限：3回リトライしましたが解消されません。数分待ってからリトライしてください。");
      for(let i=120;i>0;i--){
        if(cancelled)throw new Error("__CANCELLED__");
        // statusMsgのみ部分更新（DOM全体を再描画しない）
        st.statusMsg=`レート制限中 — ${i}秒後に自動リトライ (${retryCount+1}/3回目)`;
        const el=document.getElementById("statusMsg");
        if(el)el.textContent=st.statusMsg;
        await new Promise(r=>setTimeout(r,1000));
        if(cancelled)throw new Error("__CANCELLED__");
      }
      return api(system,msg,retryCount+1);
    }
    throw new Error(data.error.message);
  }
  if(!res.ok&&res.status===0)throw new Error("ネットワークエラー：Vercelから開いてください。");
  return data.content[0].text;
}
function pj(t){try{return JSON.parse(t.replace(/```json\n?|```/g,"").trim());}catch{return null;}}

// ── PROMPTS ──
const FAC=`マーケティング戦略会議の司会。各エージェントに【現状から次の1ステップ】を分析・提言させる指示を与えよ。questionsは「現状の〜を踏まえ、〜を具体的手法・期間・数値目標込みで提言せよ」形式にすること。理想論でなく現場実行可能な提言を引き出すこと。JSONのみ：{"phase":"フェーズ名","questions":{"marketer":"指示","designer":"指示","consultant":"指示","researcher":"指示"},"context":"目的30字"}`;
const MGR=`あなたは厳格な評価基準を持つシニアマーケティングマネージャーです。戦略案を仮想空間でシミュレーションし5項目を各20点満点で採点してください。【採点の厳格基準】市場性：需要の確かさ・市場規模の現実性（抽象的提案=0〜8点、具体的根拠あり=9〜15点、市場データ・事例あり=16〜20点）。実現性：現場で実行できるか（理想論=0〜8点、段階的計画あり=9〜15点、即実行可能=16〜20点）。独自性：競合との差別化（一般論=0〜8点、差別化要素あり=9〜15点、明確なUSPあり=16〜20点）。戦略整合性：施策の一貫性（バラバラ=0〜8点、ある程度整合=9〜15点、完全整合=16〜20点）。ユーザー共感度：ターゲットへの刺さり度（漠然=0〜8点、ペルソナ明確=9〜15点、インサイト深い=16〜20点）。【重要】各スコアは0〜20の整数のみ。JSONのみ出力：{"env":"仮想空間名","scores":{"市場性":整数,"実現性":整数,"独自性":整数,"戦略整合性":整数,"ユーザー共感度":整数},"verdict":"採点理由と課題100字","feedback":"95点未満の具体的改善指示（何が足りないか）100字","revisedStrategy":"改善した戦略150字"}`;
const SUM=`マーケティング戦略の統括AI。エージェントの議論から【現状→Phase1（1ヶ月）→Phase2（3ヶ月）→Phase3（6ヶ月）】の段階的ロードマップを含む実行戦略をまとめよ。抽象論禁止、全て具体的施策・数値・期間で記述。JSONのみ出力：{"title":"戦略タイトル","keyInsight":"核心インサイト（現状の根本課題と打ち手）50字","strategy":"Phase別ロードマップ含む統合戦略200字","actions":["Phase1(1ヶ月):具体施策","Phase2(3ヶ月):具体施策","Phase3(6ヶ月):具体施策"],"kpi":["指標1:現状値→目標値・期間","指標2:現状値→目標値・期間","指標3:現状値→目標値・期間"],"nextStep":"明日できる最初の1アクション50字"}`;

// ── FULL AUTO FLOW ──
async function startMeeting(){
  if(!st.project.trim())return;
  cancelled=false;
  S({step:"meeting",brushupProgress:null,brushupLog:[],busy:true,error:"",statusMsg:"会議を開始します...",phaseIdx:0,history:[],answers:{},questions:null,ctx:""});
  await runPhase(0,[]);
}
async function runPhase(phaseIdx,history){
  S({phaseIdx,answers:{},questions:null,ctx:"",statusMsg:`Phase ${phaseIdx+1}「${PHASE_JA[phaseIdx]}」 質問を生成中...`});
  const histText=buildHistText(history);
  try{
    checkCancelled();
    const factsSection=st.facts?.trim()?`
【確定数値（推論禁止）】${st.facts.slice(0,200)}`:"";
    const matsSection=st.materials?.trim()?`
【参考資料】${st.materials.slice(0,300)}`:"";
    const msg=history.length===0
      ?`企画:${st.project.slice(0,200)}${factsSection}${matsSection}
フェーズ1(${PHASE_JA[0]})`
      :`企画:${st.project.slice(0,200)}${factsSection}
議論:${histText}
フェーズ${phaseIdx+1}(${PHASE_JA[phaseIdx]})`;
    const raw=await api(FAC,msg);const p=pj(raw)||{};
    S({questions:p.questions||{},ctx:p.context||"",busy:false,statusMsg:`Phase ${phaseIdx+1}「${PHASE_JA[phaseIdx]}」 エージェントが回答中...`});
    const answers=await runAgentsAuto(p.questions||{},phaseIdx);
    const newHistory=[...history,{phase:PHASE_JA[phaseIdx],questions:p.questions||{},answers}];
    S({history:newHistory,answers:{}});
    if(phaseIdx+1<PHASE_JA.length){
      // フェーズ間30秒待機
      for(let w=30;w>0;w--){
        if(cancelled)throw new Error("__CANCELLED__");
        st.statusMsg=`次のフェーズまで ${w}秒待機中...`;
        const el=document.getElementById("statusMsg");
        if(el)el.textContent=st.statusMsg;
        await new Promise(r=>setTimeout(r,1000));
      }
      await runPhase(phaseIdx+1,newHistory);
    } else{
      // マネージャーへの提出前に45秒待機
      for(let w=45;w>0;w--){
        if(cancelled)throw new Error("__CANCELLED__");
        st.statusMsg=`マネージャーへ提出まで ${w}秒待機中...`;
        const el=document.getElementById("statusMsg");
        if(el)el.textContent=st.statusMsg;
        await new Promise(r=>setTimeout(r,1000));
      }
      S({step:"manager",loopCount:0,mgrState:null,busy:true,statusMsg:"マネージャーへ提出中..."});
      await runManagerAuto(buildHistText(newHistory),"",0,newHistory);
    }
  }catch(e){if(e.message==="__CANCELLED__")return;S({error:e.message,busy:false,statusMsg:""});}
}
async function runAgentsAuto(qs,phaseIdx){
  const answers={};
  const agentKeys=Object.keys(AGENTS);
  for(let i=0;i<agentKeys.length;i++){
    const id=agentKeys[i];
    S({loading:id,statusMsg:`${PHASES[phaseIdx]} — ${AGENTS[id].name} が回答中... (${i+1}/${agentKeys.length})`});
    try{
      checkCancelled();
      const factsNote=st.facts?.trim()?`
【必須前提・確定数値（推論で変えるな）】${st.facts.slice(0,200)}`:"";
      const ans=await api(ROLES[id],`企画：${st.project}${factsNote}
質問：${qs[id]||"このフェーズについて専門的見解を述べてください。"}`);
      answers[id]=ans;
      st.answers={...st.answers,[id]:ans};
      S({loading:id});
      // 次のエージェントまで20秒待機（レート制限対策）
      if(i<agentKeys.length-1){
        for(let w=20;w>0;w--){
          if(cancelled)throw new Error("__CANCELLED__");
          st.statusMsg=`次のエージェントまで ${w}秒待機中...`;
          const el=document.getElementById("statusMsg");
          if(el)el.textContent=st.statusMsg;
          await new Promise(r=>setTimeout(r,1000));
        }
      }
    }
    catch(e){if(e.message==="__CANCELLED__")throw e;S({error:e.message,loading:null});throw e;}
  }
  S({loading:null});return answers;
}
async function runManagerAuto(histText,prevRevised,loopCount,history){
  S({loopCount,busy:true,statusMsg:"マネージャーがシミュレーション中... (第"+(loopCount+1)+"回目)"});
  const combined=prevRevised?histText+"\n\n[Revised]\n"+prevRevised:histText;
  try{
    checkCancelled();
    const raw=await api(MGR,"企画："+st.project+"\n\n戦略案：\n"+combined+"\nブラッシュアップ回数："+loopCount);
    // JSONを複数方法でパース
    let m=pj(raw);
    if(!m||!m.scores){
      try{
        const start=raw.indexOf("{");
        const end=raw.lastIndexOf("}");
        if(start>=0&&end>start)m=JSON.parse(raw.slice(start,end+1));
      }catch(e2){}
    }
    // 正規表現でスコアを抽出
    if(!m||!m.scores){
      const keys=["市場性","実現性","独自性","戦略整合性","ユーザー共感度"];
      const scores={};
      keys.forEach(function(k){
        const re=new RegExp('"'+k+'"\\s*:\\s*(\\d+)');
        const match=raw.match(re);
        scores[k]=match?parseInt(match[1]):0;
      });
      const vm=raw.match(/"verdict"\s*:\s*"([^"]+)"/);
      const fm=raw.match(/"feedback"\s*:\s*"([^"]+)"/);
      const rm=raw.match(/"revisedStrategy"\s*:\s*"([^"]+)"/);
      const em=raw.match(/"env"\s*:\s*"([^"]+)"/);
      m={env:em?em[1]:"仮想空間",scores:scores,verdict:vm?vm[1]:"",feedback:fm?fm[1]:"",revisedStrategy:rm?rm[1]:""};
    }
    if(!m)m={};
    // 各スコアを0-20にクランプ
    if(m.scores){Object.keys(m.scores).forEach(function(k){m.scores[k]=Math.min(20,Math.max(0,parseInt(m.scores[k])||0));});}
    const total=Object.values(m.scores||{}).reduce(function(a,b){return a+b;},0);
    S({mgrState:m,loopCount:loopCount,busy:false});
    saveCurrent();
    if(total>=95){
      setTimeout(function(){generateFinalAuto(history,m);},600);
    } else if(loopCount>=40){
      setTimeout(function(){generateFinalAuto(history,m);},600);
    } else if(loopCount>=30){
      S({busy:false,statusMsg:"30回到達。追加ブラッシュアップが可能です。"});
    } else {
      await brushupAuto(histText,m,loopCount+1,history);
    }
  }catch(e){
    if(e.message==="__CANCELLED__")return;
    S({error:e.message,busy:false,statusMsg:""});
  }
}
async function brushupAuto(histText,prevMgr,newCount,history){
  const feedback=prevMgr?.feedback||"";
  const revised={};
  const fbShort=feedback.slice(0,80);

  // Helper: build completely new log array (never mutate in place)
  function updateLog(agentId, agentData){
    const prev=st.brushupLog;
    const lastIdx=prev.length-1;
    const newAgents={...prev[lastIdx].agents,[agentId]:agentData};
    const newLast={...prev[lastIdx],agents:newAgents};
    const newLog=[...prev.slice(0,lastIdx),newLast];
    return newLog;
  }

  // Add new round with empty agents
  const newLog=[...st.brushupLog,{round:newCount,feedback:fbShort,agents:{}}];
  S({busy:true, brushupLog:newLog, statusMsg:`ブラッシュアップ ${newCount}/30回 — 改善開始...`});

  for(const id of Object.keys(AGENTS)){
    // thinking state - fully immutable update
    S({brushupLog:updateLog(id,{status:"thinking",ans:""}),
       statusMsg:`ブラッシュアップ ${newCount}/30回 — ${AGENTS[id].name} が改善中...`});
    try{
      checkCancelled();
      const ans=await api(
        ROLES[id],
        `改善指示：${feedback}\n企画：${st.project.slice(0,100)}\n結論のみ50字で`
      );
      revised[id]=ans;
      // done state - fully immutable update
      S({brushupLog:updateLog(id,{status:"done",ans}),
         statusMsg:`ブラッシュアップ ${newCount}/30回 — ${AGENTS[id].name} 完了`});
    }
    catch(e){if(e.message==="__CANCELLED__")throw e;S({error:e.message,busy:false});throw e;}
  }

  const revisedText=Object.entries(revised).map(([id,a])=>`${AGENTS[id].name}(revised): ${a}`).join("\n");
  await runManagerAuto(histText,(prevMgr?.revisedStrategy||"")+"\n"+revisedText,newCount,history);
}
async function generateFinalAuto(history,mgrResult){
  S({busy:true,statusMsg:"最終レポートを生成中..."});
  const total=Object.values(mgrResult?.scores||{}).reduce((a,b)=>a+b,0);
  try{
    const sumMsg="企画："+st.project+"\n\n会議ログ：\n"+buildHistText(history)+"\nManagerスコア："+total+"点\n総評："+(mgrResult?.verdict||"");
    const raw=await api(SUM,sumMsg);
    // 複数方法でJSONパース
    let s=null;
    try{s=JSON.parse(raw.replace(/```json\n?|```/g,"").trim());}catch(e1){}
    if(!s||!s.strategy){
      try{
        const si=raw.indexOf("{");const ei=raw.lastIndexOf("}");
        if(si>=0&&ei>si)s=JSON.parse(raw.slice(si,ei+1));
      }catch(e2){}
    }
    if(!s||!s.strategy){
      // フォールバック：正規表現で各フィールドを抽出
      function extractField(text,key){
        const re=new RegExp('"'+key+'"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"');
        const m=text.match(re);return m?m[1].replace(/\\n/g,"\n"):"";
      }
      function extractArray(text,key){
        const re=new RegExp('"'+key+'"\\s*:\\s*\\[([^\\]]+)\\]');
        const m=text.match(re);
        if(!m)return[];
        return m[1].match(/"((?:[^"\\\\]|\\\\.)*)"/g)||[];
      }
      s={
        title:extractField(raw,"title")||"Strategy Report",
        keyInsight:extractField(raw,"keyInsight"),
        strategy:extractField(raw,"strategy")||raw.replace(/```json|```/g,"").trim().slice(0,500),
        actions:extractArray(raw,"actions").map(function(a){return a.replace(/^"|"$/g,"");}),
        kpi:extractArray(raw,"kpi").map(function(k){return k.replace(/^"|"$/g,"");}),
        nextStep:extractField(raw,"nextStep")
      };
    }
    if(!s)s={title:"Strategy Report",keyInsight:"",strategy:"レポートの生成に失敗しました",actions:[],kpi:[],nextStep:""};
    S({summary:s,step:"summary",busy:false,statusMsg:""});
    saveCurrent();
  }catch(e){if(e.message==="__CANCELLED__")return;S({error:e.message,busy:false,statusMsg:""});}
}
async function retryFromError(){
  S({error:"",busy:false});

  setTimeout(async()=>{
    try{
      await resumeFromSave();
    }catch(e){
      if(e.message!=="__CANCELLED__"){
        S({error:e.message,busy:false});
      }
    }
  },100);
}
async function retryBrushup(){if(!st.mgrState)return;S({error:""});await brushupAuto(buildHistText(st.history),st.mgrState,st.loopCount+1,st.history);}
function buildHistText(hist){
  return hist.map((r,i)=>`[Phase${i+1}:${PHASE_JA[i]}]`+Object.entries(r.answers).map(([id,a])=>`${AGENTS[id].name}:${a.slice(0,150)}`).join("|")).join("\n");
}
