        const el=document.getElementById("statusMsg");
        if(el)el.textContent=st.statusMsg;
        await new Promise(r=>setTimeout(r,1000));
      }
      await runPhase(phaseIdx+1,newHistory);
    } else{
      // マネージャーへの提出前に45秒待機
      for(let w=45;w>0;w--){
        if(cancelled)throw new Error("__CANCELLED__");
        st.statusMsg=`マネージャーへ提出まで ${w}秒待機中...`;
        const el=document.getElementById("statusMsg");
        if(el)el.textContent=st.statusMsg;
        await new Promise(r=>setTimeout(r,1000));
      }
      S({step:"manager",loopCount:0,mgrState:null,busy:true,statusMsg:"マネージャーへ提出中..."});
      await runManagerAuto(buildHistText(newHistory),"",0,newHistory);
    }
  }catch(e){if(e.message==="__CANCELLED__")return;S({error:e.message,busy:false,statusMsg:""});}
}
async function runAgentsAuto(qs,phaseIdx,researchCtx){
  const answers={};
  const agentKeys=Object.keys(AGENTS);
  const researchNote=researchCtx
    ?"\n\n【Gemini Deep Research — 活用必須データ】\n"+researchCtx.slice(0,500)
     +"\n★上記の競合固有名詞・数値・事例を必ず引用して回答せよ"
    :"";
  for(let i=0;i<agentKeys.length;i++){
    const id=agentKeys[i];
    S({loading:id,statusMsg:`${PHASES[phaseIdx]} — ${AGENTS[id].name} が回答中... (${i+1}/${agentKeys.length})`});
    try{
      checkCancelled();
      const factsNote=st.facts?.trim()?`
【必須前提・確定数値（推論で変えるな）】${st.facts.slice(0,200)}`:"";
      const prevMgrNote=st.mgrNotes?.length>0?st.mgrNotes[st.mgrNotes.length-1]?.note:null;
      const mgrHint=prevMgrNote?.directive?`
【マネージャー指示】${prevMgrNote.directive}
不足観点を補強せよ：${prevMgrNote.gap}`:"";
      const ans=await api(ROLES[id]+researchNote,`${ISOLATION_RULE}${localBizRule()}
【現在日付】${todayStr()}（時系列・期限は必ず本日以降の未来日付で記述。過去の日付禁止）
企画：${st.project}${factsNote}${mgrHint}
質問：${qs[id]||"このフェーズについて専門的見解を述べてください。"}`);
      answers[id]=ans;
      st.answers={...st.answers,[id]:ans};
      S({loading:id});
      // 次のエージェントまで20秒待機（レート制限対策）
      if(i<agentKeys.length-1){
        for(let w=20;w>0;w--){
          if(cancelled)throw new Error("__CANCELLED__");
          st.statusMsg=`次のエージェントまで ${w}秒待機中...`;
          const el=document.getElementById("statusMsg");
          if(el)el.textContent=st.statusMsg;
          await new Promise(r=>setTimeout(r,1000));
        }
      }
    }
    catch(e){if(e.message==="__CANCELLED__")throw e;S({error:e.message,loading:null});throw e;}
  }
  S({loading:null});return answers;
}
async function runManagerAuto(histText,prevRevised,loopCount,history){
  S({loopCount:loopCount,busy:true,statusMsg:"マネージャーがシミュレーション中... (第"+(loopCount+1)+"回目)"});
  const combined=prevRevised?histText+"\n\n[Revised]\n"+prevRevised:histText;
  try{
    checkCancelled();
    const factsNote=st.facts&&st.facts.trim()?"\n【確定事実】"+st.facts.slice(0,150):"";
    // ベスト案との比較コンテキスト
    const bestCtx=st.bestMgrState?"\n\n【現在のベスト案スコア（更新を目指す基準値）】\n"
      +Object.entries(st.bestMgrState.scores||{}).map(([k,v])=>k+":"+v+"/20").join(" / ")
      +"\n合計："+Object.values(st.bestMgrState.scores||{}).reduce((a,b)=>a+b,0)+"/100"
      +"\n\n【評価の根本ルール】"
      +"\n①あなたのミッションはベストスコアを更新するために本ラウンドの案を採点すること。"
      +"\n②項目ごとにベスト案と本案を比較し、本案が同等以上なら本案のスコア、本案が劣化していたらベスト案のスコアを維持して採点する（後退禁止）。"
      +"\n③ベスト案を全面否定して新規案を作るのではなく、ベスト案に対して『どの項目が』『どれだけ』改善したかを判定せよ。"
      +"\n④feedbackには、次ラウンドで狙うべき項目（最も伸びしろが大きい1項目）と、それを上げる具体方法を明示せよ。"
      :"";
    const mgrMsg=ISOLATION_RULE+localBizRule()+"\n企画："+st.project+"\n【現在日付】"+todayStr()+"（全ての時系列・期限・BEP・開発時期は本日以降の未来日付で記述。時系列の前後矛盾【例：BEP達成が開発開始より前】は減点対象。発見したら指摘せよ）"+factsNote+bestCtx+"\n\n戦略案：\n"+combined+"\nブラッシュアップ回数："+loopCount+"\n【採点追加観点】本企画の文脈と無関係な固有名詞（融資制度・他案件の屋号・他クライアントの人物像など）が混入していたら戦略整合性を-5点。";
    const raw=await api(MGR,mgrMsg);

    // ── JSONパース（3段階） ──
    let m=null;
    // 段階1: 直接パース
    try{m=JSON.parse(raw);}catch(e1){}
    // 段階2: マークダウン除去
    if(!m||!m.scores){
      try{m=JSON.parse(raw.replace(/```json\n?|```/g,"").trim());}catch(e2){}
    }
    // 段階3: {}ブロック抽出
    if(!m||!m.scores){
      try{
        const si=raw.indexOf("{");
        const ei=raw.lastIndexOf("}");
        if(si>=0&&ei>si)m=JSON.parse(raw.slice(si,ei+1));
      }catch(e3){}
    }
    // 段階4: 正規表現でスコアを個別抽出
    if(!m||!m.scores){
      const keys=["市場性","実現性","独自性","戦略整合性","ユーザー共感度"];
      const scores={};
      keys.forEach(function(k){
        const re=new RegExp('"'+k+'"\\s*:\\s*(\\d+)');
        const match=raw.match(re);
        scores[k]=match?parseInt(match[1]):0;
      });
      const envM=raw.match(/"env"\s*:\s*"([^"]+)"/);
      const verdM=raw.match(/"verdict"\s*:\s*"([^"]+)"/);
      const feedM=raw.match(/"feedback"\s*:\s*"([^"]+)"/);
      const revM=raw.match(/"revisedStrategy"\s*:\s*"([^"]+)"/);
      m={
        env:envM?envM[1]:"仮想空間",
        scores:scores,
        verdict:verdM?verdM[1]:"",
        feedback:feedM?feedM[1]:"",
        revisedStrategy:revM?revM[1]:""
      };
    }
    if(!m)m={};

    // ── スコアを0-20にクランプ ──
    if(m.scores){
      var keys2=Object.keys(m.scores);
      for(var i=0;i<keys2.length;i++){
        m.scores[keys2[i]]=Math.min(20,Math.max(0,parseInt(m.scores[keys2[i]])||0));
      }
    }

    const total=Object.values(m.scores||{}).reduce(function(a,b){return a+b;},0);
    const prevBest=st.bestMgrState?Object.values(st.bestMgrState.scores||{}).reduce((a,b)=>a+b,0):0;
    // ── ハイブリッドベスト案：項目ごとにベストスコアを保持し、totalがより高い revisedStrategy を採用 ──
    // これにより1項目でも改善があれば確実に積み上がる（後退の安全弁）
    let bestMgrState;
    if(!st.bestMgrState){
      bestMgrState=m;
    } else {
      // 項目ごとに max を取った合成スコア
      const mergedScores={};
      SCORE_ITEMS.forEach(k=>{
        mergedScores[k]=Math.max(parseInt(st.bestMgrState.scores?.[k])||0, parseInt(m.scores?.[k])||0);
      });
      const mergedTotal=Object.values(mergedScores).reduce((a,b)=>a+b,0);
      // revisedStrategy は合計スコアが高い方を採用（ただし合成スコアは保存）
      const adoptCurrent=total>=prevBest;
      bestMgrState={
        ...(adoptCurrent?m:st.bestMgrState),
        scores:mergedScores,
        // ベスト案の説明文は、より高い revisedStrategy を採用
        revisedStrategy:adoptCurrent?m.revisedStrategy:st.bestMgrState.revisedStrategy,
        verdict:adoptCurrent?m.verdict:st.bestMgrState.verdict,
        feedback:m.feedback||st.bestMgrState.feedback
      };
    }
    // 全ループの評価履歴を蓄積（上位3案統合のために使用）
    const mgrHistory=[...(st.mgrHistory||[]),{loopCount,total,m}];
    S({mgrState:m,bestMgrState,mgrHistory,loopCount:loopCount,busy:false});
    saveCurrent();

    // ── ループ継続判定（ベスト合成スコアで判定：項目ごとのmaxが積み上がって95に届けば承認） ──
    const mergedBestTotal=Object.values(bestMgrState.scores||{}).reduce((a,b)=>a+b,0);
    if(mergedBestTotal>=95){
      // 承認！解像度を上げる → 最終レポート生成
      S({step:"summary",statusMsg:"✓ ベストスコア "+mergedBestTotal+"点で承認！戦略の解像度を上げています..."});
      saveCurrent();
      setTimeout(async function(){
        try{
          await concretizeStrategy(history,bestMgrState);
          await generateFinalAuto(history,bestMgrState);
        }catch(e){if(e.message!=="__CANCELLED__")S({error:e.message,busy:false});}
      },600);
    } else if(loopCount>=40){
      // 40回到達 → 上位3案を統合してワンモアチャンス
      S({statusMsg:"最大回数（40回）到達。上位3案を統合して最終評価を行います..."});
      setTimeout(function(){synthesizeTop3Auto(history,mgrHistory);},600);
    } else if(loopCount>=30&&!st.extraMode&&!st.extraUsed){
      // 30回到達かつextraモード未使用 → ユーザーに追加オプションを提示（処理を止める）
      S({busy:false,statusMsg:"30回のブラッシュアップが完了しました。"});
      // ここで処理を止める（extraUsed=trueなら絶対ここに来ない）
    } else if(loopCount>=30&&st.extraUsed){
      // extraモード使用済み → 40回まで継続
      S({statusMsg:"追加ブラッシュアップ継続中 ("+loopCount+"/40)..."});
      await brushupAuto(histText,m,loopCount+1,history);
    } else {
      // 通常ブラッシュアップ継続
      await brushupAuto(histText,m,loopCount+1,history);
    }
  }catch(e){
    if(e.message==="__CANCELLED__")return;
    S({error:e.message,busy:false,statusMsg:""});
  }
}
async function brushupAuto(histText,prevMgr,newCount,history){
  const feedback=prevMgr?.feedback||"";
  const revised={};
  const fbShort=feedback.slice(0,80);

  // Helper: build completely new log array (never mutate in place)
  function updateLog(agentId, agentData){
    const prev=st.brushupLog;
    const lastIdx=prev.length-1;
    const newAgents={...prev[lastIdx].agents,[agentId]:agentData};
    const newLast={...prev[lastIdx],agents:newAgents};
    const newLog=[...prev.slice(0,lastIdx),newLast];
    return newLog;
  }

  // ── 焦点項目選定：ベストスコアを更新するための狙い撃ち戦略 ──
  // ベーススコアは"ベスト案"の各項目（無ければ今ラウンド）
  const baseScores=(st.bestMgrState&&st.bestMgrState.scores)?st.bestMgrState.scores:(prevMgr.scores||{});
  const bestTotalNow=Object.values(baseScores).reduce((a,b)=>parseInt(a)+(parseInt(b)||0),0);
  // 最弱項目 & 最強項目
  const sortedByScore=Object.entries(baseScores).map(([k,v])=>({k,v:parseInt(v)||0})).sort((a,b)=>a.v-b.v);
  const weakest=sortedByScore[0]||{k:"市場性",v:0};
  const strongest=sortedByScore[sortedByScore.length-1]||{k:"市場性",v:0};
  // 戦略選定ロジック：
  // ・ベスト80点未満 → 弱点補強モード（reinforce）：最弱項目を集中フォロー
  // ・ベスト80〜89点 → 偶数ラウンドは弱点補強、奇数は強み伸展で多面的に押し上げ
  // ・ベスト90点以上 → 強み伸展モード（amplify）：満点に最も近い項目を20点に到達させ確実に95点突破
  let focusMode,focusItem,focusV;
  if(bestTotalNow>=90){
    focusMode="amplify";focusItem=strongest.v<20?strongest.k:weakest.k;focusV=baseScores[focusItem]||0;
  }else if(bestTotalNow>=80){
    if(newCount%2===0){focusMode="reinforce";focusItem=weakest.k;focusV=weakest.v;}
    else{focusMode="amplify";focusItem=strongest.k;focusV=strongest.v;}
  }else{
    focusMode="reinforce";focusItem=weakest.k;focusV=weakest.v;
  }
  const focusPlan={mode:focusMode,focusItem,bestV:focusV,bestTotal:bestTotalNow};

  // Add new round with empty agents
  const maxBrushupRounds=st.extraUsed?40:30;
  const newLog=[...st.brushupLog,{round:newCount,feedback:fbShort,agents:{},focus:focusPlan}];
  S({busy:true, brushupLog:newLog, focusPlan, statusMsg:`R${newCount}/${maxBrushupRounds} — ${focusMode==="amplify"?"【伸展】":"【補強】"}${focusItem}（${focusV}/20）を狙い撃ち`});

  // スコア情報と低評価項目を抽出（ベスト基準）
  const scoresSummary=Object.entries(baseScores).map(([k,v])=>k+":"+v+"/20").join(" / ");
  const weakAreas=Object.entries(baseScores).filter(([,v])=>parseInt(v)<16).map(([k])=>k).join("・")||"なし";
  const histSummary=buildHistText(history).slice(0,400);
  // 焦点ブロック：各エージェントとマネージャーに伝える"今ラウンドの狙い"
  const focusBlock="\n\n【今ラウンドの焦点（最重要）】\n"
    +"・ベストスコア："+bestTotalNow+"/100（目標95）\n"
    +"・狙い撃ち項目："+focusItem+"（現在 "+focusV+"/20）\n"
    +"・戦略モード："+(focusMode==="amplify"?"AMPLIFY（既に強い『"+focusItem+"』を満点20に伸ばしてベスト更新）":"REINFORCE（弱点『"+focusItem+"』をベース戦略の中で補強してベスト更新）")+"\n"

    if(!mFinal){const si=mgrRaw.indexOf("{"),ei=mgrRaw.lastIndexOf("}");if(si>=0&&ei>si)try{mFinal=JSON.parse(mgrRaw.slice(si,ei+1));}catch(e){}}
    if(mFinal&&mFinal.scores){
      Object.keys(mFinal.scores).forEach(k=>{mFinal.scores[k]=Math.min(20,Math.max(0,parseInt(mFinal.scores[k])||0));});

      const bestTotal=st.bestMgrState?Object.values(st.bestMgrState.scores||{}).reduce((a,b)=>a+b,0):0;
      if(synthTotal>bestTotal){
        // 統合案がベストを更新
        S({mgrState:mFinal,bestMgrState:mFinal,statusMsg:"統合戦略が最高スコア("+synthTotal+"点)を達成！レポートを生成します。"});
        saveCurrent();
        setTimeout(function(){generateFinalAuto(history,mFinal);},800);
        return;
      }
    }
    // 統合でも改善しなかった → 既存ベスト案でレポート
    S({statusMsg:"最高スコア案でレポートを生成します。"});
    setTimeout(function(){generateFinalAuto(history,st.bestMgrState);},600);
  }catch(e){
    if(e.message==="__CANCELLED__")return;
    // エラー時もベスト案でフォールバック
    setTimeout(function(){generateFinalAuto(history,st.bestMgrState);},600);
  }
}
async function geminiDiagram(strategy,challenge,phases){

    const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+geminiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}]})});

// GPT Image 2.0 (model: gpt-image-1 — OpenAI API名) → Gemini Nano Banana フォールバック
async function generateImageGPT(prompt){
  if(!openaiKey)return null;
  try{
    // GPT Image 2.0 = model "gpt-image-1" (OpenAI公式API識別子)
    const res=await fetch("https://api.openai.com/v1/images/generations",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+openaiKey},
      body:JSON.stringify({model:"gpt-image-1",prompt:prompt,n:1,size:"1024x1024",quality:"high"})
    });
    const data=await res.json();
    if(data.error){console.warn("GPT Image 2.0 error:",data.error.message);return null;}
    const b64=data.data?.[0]?.b64_json;
    if(b64)return"data:image/png;base64,"+b64;
    return data.data?.[0]?.url||null;
  }catch(e){console.warn("GPT Image 2.0 failed:",e.message);return null;}
}
async function generateImageNanoBanana(prompt){
  // Gemini Nano Banana = imagen-3.0-generate-002（フォールバック専用）
  if(!geminiKey)return null;
  try{
    const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key="+geminiKey,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({instances:[{prompt:prompt}],parameters:{sampleCount:1,aspectRatio:"1:1",safetyFilterLevel:"block_few"}})
    });
    const data=await res.json();
    if(data.error){console.warn("Nano Banana error:",data.error.message);return null;}
    const b64=data.predictions?.[0]?.bytesBase64Encoded;
    const mime=data.predictions?.[0]?.mimeType||"image/png";
    if(b64)return"data:"+mime+";base64,"+b64;
    return null;
  }catch(e){console.warn("Nano Banana failed:",e.message);return null;}
}

    const usr=ISOLATION_RULE+"\n企画："+st.project+factsNote+"\n\n承認された戦略：\n"+strategy+"\n\n会議要約：\n"+histSlim+"\n\n現状認識：会議ログから現在の数値・状態を抽出して使用。記述が無い項目は「未測定」とし、まず測定タスクを Week1 に入れること。";
    const raw=await api(sys,usr,0,3000);
    let c=null;
    try{c=JSON.parse(raw);}catch(e){}
    if(!c){try{c=JSON.parse(raw.replace(/```json\n?|```/g,"").trim());}catch(e){}}
    if(!c){const si=raw.indexOf("{"),ei=raw.lastIndexOf("}");if(si>=0&&ei>si)try{c=JSON.parse(raw.slice(si,ei+1));}catch(e){}}
    if(c){
      S({concreteSteps:c,statusMsg:"✓ 解像度向上完了。最終レポート生成へ..."});
      saveCurrent();
    }
  }catch(e){
    if(e.message==="__CANCELLED__")throw e;
    console.warn("concretizeStrategy failed:",e.message);
  }
}

async function generateFinalAuto(history,mgrResult){
  S({busy:true,statusMsg:"最終レポートを生成中..."});
  const useBest=st.bestMgrState||mgrResult;
  const total=Object.values(useBest&&useBest.scores||{}).reduce(function(a,b){return a+b;},0);
  try{
    const factsForSum=st.facts&&st.facts.trim()?"\n\n【重要な制約・確定事実（これに反する提案・施策は絶対に出力しないこと）】\n"+st.facts:"";
    const bestStrategyForSum=useBest?.revisedStrategy?"\n\n【採用するベスト戦略案】\n"+useBest.revisedStrategy:"";
    const concreteForSum=st.concreteSteps?"\n\n【解像度向上ステップで確定した実行プロセス（最重要 — レポートはこの実行計画を反映せよ）】\n"+JSON.stringify(st.concreteSteps).slice(0,2400):"";
    const sumMsg=ISOLATION_RULE+localBizRule()+"\n企画："+st.project+"\n\n【本日の日付】"+todayStr()+"（フェーズ開始時期・期限は全てこの日付を基準に計算すること。過去の日付を使用禁止）"+factsForSum+bestStrategyForSum+concreteForSum+"\n\n会議ログ：\n"+buildHistText(history)+"\nManagerスコア："+total+"点\n総評："+(useBest&&useBest.verdict||"")+"\n\n【出力指示】monthlyPlan・kpi・phases は上の【実行プロセス】の week1to4・kpiPlaybook・processFlow を必ず反映すること。抽象的な指針表現を禁止し、誰がいつ何を測るかが分かるレベルで記述せよ。";
    const raw=await api(SUM,sumMsg,0,2000);

    // ── 4段階パース ──
    let s=null;
    // 1: そのままパース
    try{s=JSON.parse(raw);}catch(e1){}
    // 2: マークダウン除去
    if(!s||!s.title){
      try{s=JSON.parse(raw.replace(/```json\n?|```/g,"").trim());}catch(e2){}
    }
    // 3: {}ブロック抽出
    if(!s||!s.title){
      try{
        const si=raw.indexOf("{");const ei=raw.lastIndexOf("}");
        if(si>=0&&ei>si)s=JSON.parse(raw.slice(si,ei+1));
      }catch(e3){}
    }
    // 4: 正規表現で各フィールドを個別抽出
    if(!s||!s.title){
      function extractStr(text,key){
        const re=new RegExp('"'+key+'"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"');
        const m=text.match(re);
        return m?m[1].replace(/\\n/g,"\n").replace(/\\"/g,'"'):"";
      }
      function extractArr(text,key){
        const re=new RegExp('"'+key+'"\\s*:\\s*\\[([^\\]]+)\\]');
        const m=text.match(re);
        if(!m)return[];
        const items=m[1].match(/"((?:[^"\\\\]|\\\\.)*)"/g)||[];
        return items.map(function(i){return i.replace(/^"|"$/g,"");});
      }
      s={
        title:extractStr(raw,"title")||"Strategy Report",
        keyInsight:extractStr(raw,"keyInsight"),
        strategy:extractStr(raw,"strategy"),
        actions:extractArr(raw,"actions"),
        kpi:extractArr(raw,"kpi"),
        nextStep:extractStr(raw,"nextStep")
      };
    }
    // strategyにJSONが混入していたら除去
    if(s&&s.strategy){
      s.strategy=s.strategy.replace(/```json[\s\S]*?```/g,"").replace(/```/g,"").trim();
      // strategyの中にJSONオブジェクトが含まれている場合、その前のテキストだけ取る
      const jsonIdx=s.strategy.indexOf('{"title"');
      if(jsonIdx>0)s.strategy=s.strategy.slice(0,jsonIdx).trim();
      if(jsonIdx===0){
        // strategyが丸ごとJSONならkeyInsightから取る
        s.strategy=s.keyInsight||"";
      }
    }
    if(!s)s={title:"Strategy Report",keyInsight:"",strategy:"",actions:[],kpi:[],nextStep:""};
    // Gemini で図解データを生成（キーがある場合のみ）
    let reportDiagram=null;
    if(geminiKey&&s.strategy){
      S({statusMsg:"Gemini で戦略フロー図を生成中..."});
      reportDiagram=await geminiDiagram(s.strategy,s.challenge||"",s.phases||[]);
    }
    // 戦略ビジュアル画像を生成（GPT Image 1 または Gemini Imagen）
    let reportImages=null;
    if((openaiKey||geminiKey)&&s.keyInsight&&s.strategy){
      try{
        checkCancelled();
        const imgResult=await generateStrategyImage(s.strategy,s.keyInsight,st.project);
        if(imgResult)reportImages={strategy:imgResult};
      }catch(e){if(e.message==="__CANCELLED__")throw e;console.warn("Image generation failed:",e.message);}
    }
    S({summary:s,reportDiagram,reportImages,step:"summary",busy:false,statusMsg:""});
    saveCurrent();
  }catch(e){
    if(e.message==="__CANCELLED__")return;
    S({error:e.message,busy:false,statusMsg:""});
  }
}

async function reattachFiles(input){
  const raw=Array.from(input.files);
  const processed=await Promise.all(raw.map(pf));
  // 既存ファイルと重複しないよう追加
  const existing=st.files.map(f=>f.name);
  const newFiles=processed.filter(f=>!existing.includes(f.name));
  st.files=[...st.files,...newFiles];
  // 再添付リストから削除
  const reattached=processed.map(f=>f.name);
  const remaining=(st.needsReattach||[]).filter(n=>!reattached.includes(n));
  S({needsReattach:remaining.length>0?remaining:null});
  input.value="";
  // 全て再添付完了したら自動再開
  if(remaining.length===0){
    setTimeout(()=>resumeFromSave(),500);
  }
}

function updateExtraAnswer(idx,val){
  if(!st.extraAnswers)st.extraAnswers={};
  st.extraAnswers[idx]=val;
}

function renderExtraQuestions(){
  const qs=st.extraQuestions||[];
  if(qs.length===0)return"";
  var forms=qs.map(function(q,i){
    const ans=(st.extraAnswers&&st.extraAnswers[i])||"";
    return'<div style="margin-bottom:12px">'+
      '<div style="font-size:12px;font-weight:600;color:#1A2A38;margin-bottom:5px">'+(i+1)+'. '+q+'</div>'+
      '<textarea rows="2" style="width:100%;border:1.5px solid #E4EAF0;border-radius:8px;padding:8px 12px;font-size:12px;font-family:inherit;resize:none;outline:none;box-sizing:border-box" '+
      'oninput="updateExtraAnswer('+i+',this.value)" '+
      'placeholder="回答を入力してください...">'+ans+'</textarea>'+
    '</div>';
  }).join("");
  return'<div style="margin-top:16px;border:1.5px solid #2195ca;border-radius:12px;padding:18px;background:#EBF6FF">'+
    '<div style="font-size:13px;font-weight:700;color:#2195ca;margin-bottom:4px">エージェントからの質問</div>'+
    '<div style="font-size:11px;color:#4A5E72;margin-bottom:14px">回答することでより精度の高い分析が可能になります</div>'+
    forms+
    '<button style="width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#23956a,#1a7a56);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit" onclick="submitExtraAnswers()">回答して再分析する →</button>'+
  '</div>';
}

  if(!st.extraMode){
    S({extraMode:true,extraQuestions:[],extraAnswers:{},busy:true,statusMsg:"エージェントが追加の質問を生成中..."});
  }

async function submitExtraAnswers(){
  const answers=st.extraAnswers||{};
  const qs=st.extraQuestions||[];
  const qaLines=qs.map(function(q,i){return"Q: "+q+"\nA: "+(answers[i]||"（未回答）");});
  const qaText=qaLines.join("\n");
  const newFacts=(st.facts||"")+"\n\n【追加情報（ユーザー回答）】\n"+qaText;
  S({facts:newFacts,extraMode:false,extraUsed:true,extraQuestions:[],extraAnswers:{},busy:true,statusMsg:"追加情報を反映してブラッシュアップ中..."});
  try{
    await brushupAuto(buildHistText(st.history||[]),st.mgrState,st.loopCount+1,st.history||[]);
  }catch(e){
    if(e.message==="__CANCELLED__")return;
    S({error:e.message,busy:false});
  }
}

  try{

    if(e.message!=="__CANCELLED__"){
      S({error:e.message,busy:false});

  }
}

  return hist.map((r,i)=>`[Phase${i+1}:${PHASE_JA[i]}]`+Object.entries(r.answers).map(([id,a])=>`${AGENTS[id].name}:${a.slice(0,150)}`).join("|")).join("\n");
}
