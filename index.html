<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy Council</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* 参照デザイン準拠：白ベース + ブルーアクセント */
  --bg:#F8FAFB;
  --bg2:#FFFFFF;
  --bg3:#F0F2FF;
  --bg4:#E8EBFF;
  --border:#E2E6F0;
  --border2:#C8CEEA;
  --text:#0F1128;
  --text2:#4A5280;
  --text3:#8E97C0;
  --accent:#3A3AF5;
  --accent2:#2828D4;
  --accent-light:#EEEEFF;
  --amber:#F5A623;
  --amber-light:#FFF8ED;
  --green:#0FA66A;
  --green-light:#E8FBF3;
  --red:#F04438;
  --red-light:#FFF0EE;
  --blue2:#5B8DEF;
  --card-hover:#F5F6FF;
  --shadow-sm:0 1px 4px rgba(58,58,245,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(58,58,245,.1),0 2px 6px rgba(0,0,0,.05);
  --shadow-lg:0 12px 40px rgba(58,58,245,.12),0 4px 12px rgba(0,0,0,.06);
  --r-sm:8px;--r-md:14px;--r-lg:18px;--r-xl:24px;
}

body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans JP',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.6}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#F0F2FF}
::-webkit-scrollbar-thumb{background:#C8CEEA;border-radius:2px}
textarea::-webkit-scrollbar{width:3px}
textarea::-webkit-scrollbar-thumb{background:#C8CEEA;border-radius:2px}

/* HEADER */
header{
  border-bottom:1px solid var(--border);
  padding:0 32px;height:58px;
  display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,.95);
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px);
  box-shadow:0 1px 8px rgba(58,58,245,.06);
}
.logo{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--blue2));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 3px 10px rgba(58,58,245,.35);
}
.htitle{font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--text)}
.hsub{font-size:10px;color:var(--text3);letter-spacing:.1em;font-weight:500}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{
  background:none;border:1.5px solid var(--border2);color:var(--text2);
  padding:6px 14px;border-radius:var(--r-sm);cursor:pointer;
  font-size:12px;font-family:inherit;font-weight:600;transition:all .15s;
}
.hbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.hbtn.icon-btn{padding:6px 10px;display:flex;align-items:center;justify-content:center}
.hbtn.icon-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.hbtn.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-light)}

main{max-width:780px;margin:0 auto;padding:36px 20px}

/* BUTTONS */
.btn{
  width:100%;padding:13px 20px;border:none;border-radius:var(--r-md);
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none!important}
.btn-accent{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  box-shadow:0 3px 14px rgba(58,58,245,.35);
}
.btn-accent:hover:not(:disabled){
  box-shadow:0 5px 20px rgba(58,58,245,.45);
  transform:translateY(-1px);
}
.btn-ghost{
  background:var(--bg2);border:1.5px solid var(--border);
  color:var(--text2);margin-top:8px;
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.btn-export{
  background:var(--bg2);border:2px solid var(--accent);
  color:var(--accent);margin-top:6px;font-weight:700;
}
.btn-export:hover{background:var(--accent-light);box-shadow:0 2px 10px rgba(58,58,245,.2)}

/* INPUTS */
textarea,input[type=text],input[type=password]{
  width:100%;background:var(--bg2);
  border:1.5px solid var(--border);border-radius:var(--r-md);
  color:var(--text);padding:12px 14px;font-size:14px;
  font-family:inherit;outline:none;transition:all .2s;
  box-shadow:var(--shadow-sm);
}
textarea{resize:vertical;line-height:1.7}
textarea:focus,input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(58,58,245,.1),var(--shadow-sm);
}
textarea::placeholder,input::placeholder{color:var(--text3)}
.lbl{
  font-size:11px;font-weight:700;color:var(--text3);
  letter-spacing:.08em;display:block;margin-bottom:6px;text-transform:uppercase;
}
.input-wrap{position:relative}
.input-wrap input{padding-right:44px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px}

/* DROP ZONE */
.drop{
  border:2px dashed var(--border2);border-radius:var(--r-md);
  padding:20px;text-align:center;cursor:pointer;margin:10px 0;
  transition:all .2s;background:var(--bg3);
}
.drop:hover,.drop.drag{border-color:var(--accent);background:var(--accent-light)}
.fi-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  margin-bottom:5px;background:var(--bg2);box-shadow:var(--shadow-sm);
}
.fi-name{font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi-badge{font-size:9px;padding:2px 7px;border-radius:100px;background:var(--accent-light);color:var(--accent);font-weight:700}
.fi-rm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:0 3px;transition:color .15s}
.fi-rm:hover{color:var(--red)}

/* PROJECT LIST */
.proj-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.proj-header h2{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--text)}
.proj-card{
  background:var(--bg2);border:1.5px solid var(--border);
  border-radius:var(--r-lg);padding:16px 20px;margin-bottom:10px;
  cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm);
}
.proj-card:hover{
  border-color:var(--accent);background:var(--bg2);
  box-shadow:var(--shadow-md);transform:translateY(-2px);
}
.proj-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.proj-info{flex:1;min-width:0}
.proj-name{font-size:14px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.proj-meta{font-size:11px;color:var(--text3)}
.proj-status{font-size:10px;padding:4px 11px;border-radius:100px;font-weight:700;letter-spacing:.04em;flex-shrink:0}
.status-running{background:var(--accent-light);color:var(--accent);border:1.5px solid rgba(58,58,245,.2)}
.status-done{background:var(--green-light);color:var(--green);border:1.5px solid rgba(15,166,106,.2)}
.proj-actions{display:flex;gap:6px;flex-shrink:0}
.proj-btn{
  padding:5px 12px;border-radius:var(--r-sm);font-size:11px;font-weight:600;
  font-family:inherit;cursor:pointer;border:1.5px solid var(--border);
  background:none;color:var(--text2);transition:all .15s;
}
.proj-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-light)}
.proj-btn.del:hover{color:var(--red);border-color:var(--red);background:var(--red-light)}
.new-proj-btn{
  width:100%;padding:16px;border:2px dashed var(--border2);
  border-radius:var(--r-lg);background:none;color:var(--text3);
  font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:10px;font-weight:600;
}
.new-proj-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

/* AGENT BADGES */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.abadge{
  font-size:11px;padding:5px 12px;border-radius:100px;
  background:var(--bg3);border:1.5px solid var(--border2);
  color:var(--text2);font-weight:600;display:inline-flex;align-items:center;gap:5px;
}

/* PROGRESS */
.prog-wrap{margin-bottom:28px}
.prog-stages{display:flex;align-items:flex-start;gap:0;position:relative}
.prog-stage{flex:1;text-align:center;position:relative}
.prog-stage:not(:last-child)::after{
  content:'';position:absolute;top:11px;left:55%;width:90%;height:2px;
  background:var(--border);z-index:0;border-radius:1px;
}
.prog-stage.done:not(:last-child)::after{background:var(--accent)}
.prog-dot{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border);
  background:var(--bg2);margin:0 auto 6px;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;transition:all .3s;color:var(--text3);
  box-shadow:var(--shadow-sm);
}
.prog-stage.done .prog-dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(58,58,245,.35)}
.prog-stage.active .prog-dot{border-color:var(--accent);color:var(--accent);animation:glow 1.5s infinite;background:var(--accent-light)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(58,58,245,.3)}50%{box-shadow:0 0 0 7px rgba(58,58,245,0)}}
.prog-name{font-size:9px;color:var(--text3);letter-spacing:.02em;line-height:1.3;font-weight:500}
.prog-stage.done .prog-name,.prog-stage.active .prog-name{color:var(--accent);font-weight:700}

/* STATUS BAR */
.status-bar{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  background:#FFFFFF;border:1.5px solid var(--border);
  border-radius:var(--r-md);margin-bottom:20px;
  font-size:12px;color:var(--text);font-weight:500;
  box-shadow:var(--shadow-sm);
}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sdot.running{background:var(--accent);animation:glow 1.2s infinite}
.sdot.ok{background:var(--green)}
.sdot.err{background:var(--red)}

/* AGENT CARDS */
.agent-card{
  border:1.5px solid var(--border);border-radius:var(--r-md);
  padding:16px;margin-bottom:10px;background:var(--bg2);
  transition:all .2s;box-shadow:var(--shadow-sm);
}
.agent-card:hover{box-shadow:var(--shadow-md);border-color:var(--border2)}
.agent-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.agent-name{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.agent-q{
  font-size:12px;color:var(--text2);background:var(--bg3);
  padding:8px 12px;border-radius:var(--r-sm);margin-bottom:10px;
  line-height:1.65;border-left:3px solid var(--accent);
}
.agent-ans{font-size:13px;color:var(--text2);line-height:1.85}
.dots{display:flex;gap:5px;padding:6px 0}
.dot{width:5px;height:5px;border-radius:50%}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
.b1{animation:blink 1.2s infinite}
.b2{animation:blink 1.2s infinite .22s}
.b3{animation:blink 1.2s infinite .44s}

/* HISTORY / ACCORDION */
.hist-block{opacity:.3;margin-bottom:16px}
.hist-div{font-size:10px;color:var(--text3);letter-spacing:.12em;margin-bottom:8px;font-weight:700}
.accordion{border:1.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.accordion-header{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;background:var(--bg2);transition:background .15s;user-select:none}
.accordion-header:hover{background:var(--accent-light)}
.accordion-phase{font-size:9px;font-weight:800;color:var(--accent);letter-spacing:.12em;min-width:64px;text-transform:uppercase}
.accordion-title{font-size:13px;font-weight:600;color:var(--text);flex:1}
.accordion-summary{font-size:11px;color:var(--text3);flex:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accordion-chevron{color:var(--text3);transition:transform .25s;flex-shrink:0}
.accordion-chevron.open{transform:rotate(180deg)}
.accordion-body{border-top:1.5px solid var(--border);padding:16px;background:var(--bg3);display:none}
.accordion-body.open{display:block;animation:fadeUp .2s ease}
.accordion-agent{padding:10px 0;border-bottom:1px solid var(--border)}
.accordion-agent:last-child{border-bottom:none}
.accordion-agent-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.accordion-agent-name{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.accordion-agent-ans{font-size:12px;color:var(--text2);line-height:1.8}

/* PHASE */
.phase-lbl{font-size:10px;color:var(--accent);letter-spacing:.15em;font-weight:800;margin-bottom:4px;text-transform:uppercase}
.phase-ttl{font-size:18px;font-weight:700;margin-bottom:12px;letter-spacing:-.02em}
.ctx-box{
  font-size:12px;color:var(--accent2);padding:10px 14px 10px 16px;
  border-left:3px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin-bottom:16px;background:var(--accent-light);font-weight:500;
}

/* MANAGER */
.mgr-panel{border:1.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-top:16px;box-shadow:var(--shadow-md)}
.mgr-hdr{
  display:flex;align-items:center;gap:10px;padding:14px 20px;
  background:linear-gradient(135deg,var(--accent-light),#EBF3FF);
  border-bottom:1.5px solid var(--border);
}
.mgr-body{padding:20px}
.env-badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;
  padding:4px 12px;border-radius:100px;
  background:var(--accent-light);color:var(--accent);
  border:1.5px solid rgba(58,58,245,.2);margin-bottom:16px;font-weight:600;
}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.score-item{background:var(--bg3);border-radius:var(--r-sm);padding:12px;border:1.5px solid var(--border)}
.score-name{font-size:10px;color:var(--text3);margin-bottom:6px;font-weight:700;letter-spacing:.04em}
.sbar-wrap{height:5px;background:var(--border);border-radius:3px;margin-bottom:6px;overflow:hidden}
.sbar{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.sval{font-size:15px;font-weight:800}
.mgr-verdict{font-size:13px;color:var(--text2);line-height:1.85;margin-bottom:12px}
.mgr-feedback{
  font-size:12px;color:var(--text2);
  background:var(--amber-light);padding:10px 14px;
  border-radius:var(--r-sm);line-height:1.7;border-left:3px solid var(--amber);
}
.loop-badge{
  margin-left:auto;font-size:10px;padding:3px 10px;border-radius:100px;
  background:rgba(245,166,35,.15);color:var(--amber);
  border:1.5px solid rgba(245,166,35,.3);font-weight:700;
}

/* SUMMARY */
.insight-box{
  background:linear-gradient(135deg,var(--accent-light),#EBF3FF);
  border:1.5px solid rgba(58,58,245,.2);
  border-radius:var(--r-lg);padding:20px;margin-bottom:16px;
  border-left:4px solid var(--accent);
  box-shadow:0 2px 10px rgba(58,58,245,.08);
}
.strat-box{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kv-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-sm)}
.kv-title{font-size:9px;letter-spacing:.15em;margin-bottom:10px;font-weight:800;text-transform:uppercase}
.kv-item{font-size:12px;color:var(--text2);padding:7px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;line-height:1.5}
.next-box{
  background:linear-gradient(135deg,var(--accent-light),#EBF3FF);
  border:1.5px solid rgba(58,58,245,.2);
  border-radius:var(--r-md);padding:14px 18px;
  display:flex;align-items:center;gap:12px;margin-bottom:16px;
  box-shadow:0 2px 8px rgba(58,58,245,.08);
}
.approved-tag{
  display:inline-flex;align-items:center;gap:5px;font-size:10px;
  padding:4px 12px;border-radius:100px;
  background:var(--green-light);color:var(--green);
  border:1.5px solid rgba(15,166,106,.25);font-weight:700;
}

/* MISC */
.spinner{text-align:center;padding:52px 0;font-size:13px;color:var(--text3);animation:blink 1.5s infinite;font-weight:500}
.err{font-size:12px;color:var(--red);background:var(--red-light);border-radius:var(--r-sm);padding:10px 14px;margin-top:10px;border:1.5px solid rgba(240,68,56,.2);font-weight:500}
.retry-btn{margin-top:8px;padding:6px 16px;border-radius:var(--r-sm);border:1.5px solid var(--red);background:none;color:var(--red);font-size:11px;font-family:inherit;cursor:pointer;font-weight:600;transition:all .15s}
.retry-btn:hover{background:var(--red-light)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .3s ease}

/* RESUME BANNER */
.resume-banner{background:var(--accent-light);border:1.5px solid rgba(58,58,245,.2);border-radius:var(--r-md);padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:14px}
.rbtn{padding:6px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border2);background:none;font-size:11px;font-family:inherit;cursor:pointer;font-weight:600;transition:all .15s}
.rbtn-yes{border-color:var(--accent);color:var(--accent);background:var(--bg2)}
.rbtn-yes:hover{background:var(--accent);color:#fff}
.rbtn-no{color:var(--text3)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,17,40,.45);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.modal{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-xl);padding:24px;max-width:400px;width:92%;box-shadow:var(--shadow-lg);animation:fadeUp .2s ease}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px;letter-spacing:-.02em}
.mbtn{width:100%;padding:12px 16px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);font-size:13px;font-family:inherit;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:all .15s;margin-bottom:8px;font-weight:500}
.mbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.modal-close{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:none;color:var(--text3);font-size:12px;font-family:inherit;cursor:pointer;margin-top:4px;font-weight:500;transition:all .15s}
.modal-close:hover{background:var(--bg3)}

/* API KEY SCREEN */
.api-screen{max-width:440px;margin:72px auto;text-align:center}
.api-screen h2{font-size:24px;font-weight:800;margin-bottom:10px;letter-spacing:-.04em}
.api-screen p{font-size:14px;color:var(--text2);line-height:1.75;margin-bottom:24px}
.saved-key-box{background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-md);padding:12px 16px;font-size:12px;color:var(--text2);display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:500}
.forget-btn{background:none;border:none;color:var(--red);font-size:11px;cursor:pointer;font-family:inherit;font-weight:700}
.api-note{font-size:11px;color:var(--text3);margin-bottom:20px}
.api-note a{color:var(--accent);text-decoration:none;font-weight:600}
.api-note a:hover{text-decoration:underline}

/* LOCAL WARNING */
#localWarning{padding:10px 24px;font-size:12px;background:#FFFBF0;border-bottom:1px solid rgba(245,166,35,.3);color:var(--amber);text-align:center;font-weight:500;display:none}
#localWarning a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
  <div>

<script>
// ─── CONFIG ───
const AGENTS={

  done:       '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  logo:       '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
  globe:      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
};
const ROLES={
  marketer:"あなたはシニアマーケターです。市場分析、ターゲット設定、顧客獲得戦略、ブランドポジショニング、KPI設計の専門家です。確定数値がある場合は必ずそれを前提に使い、推論で数値を作らないでください。200字以内で具体的に答えてください。",
  designer:"あなたはUX/ブランドデザイナーです。ユーザー体験設計、ビジュアルアイデンティティの専門家です。確定数値がある場合は必ずそれを前提に使い、推論で数値を作らないでください。200字以内で具体的に答えてください。",
  consultant:"あなたはMcKinsey出身の経営コンサルタントです。事業戦略、競合分析、P&L管理の専門家です。確定数値がある場合は必ずそれを前提に使い、推論で数値を作らないでください。200字以内で具体的に答えてください。",
  researcher:"あなたはUXリサーチャーです。定性・定量調査、ペルソナ構築の専門家です。確定数値がある場合は必ずそれを前提に使い、推論で数値を作らないでください。200字以内で具体的に答えてください。",
};
const PHASES=["課題定義","市場分析","戦略立案","実行計画"];
const PHASE_JA=["課題・ゴール定義","市場・ユーザー分析","戦略立案","実行計画・KPI"];
const SCORE_ITEMS=["市場性","実現性","独自性","戦略整合性","ユーザー共感度"];
const PROJ_KEY="sc_projects";
const APIKEY_KEY="sc_apikey";

// ─── STATE ───
let apiKey="";
let cancelled=false;
let currentProjId=null;
function checkCancelled(){ if(cancelled) throw new Error("__CANCELLED__"); }
let st={
  step:"projects",project:"",files:[],
  phaseIdx:0,questions:null,ctx:"",answers:{},loading:null,
  history:[],mgrState:null,loopCount:0,
  summary:null,error:"",busy:false,statusMsg:"",
};

// ─── PROJECT STORAGE ───
function getProjects(){try{return JSON.parse(localStorage.getItem(PROJ_KEY)||"[]");}catch{return[];}}
function saveProject(proj){
  const projs=getProjects();
  const idx=projs.findIndex(p=>p.id===proj.id);
  if(idx>=0)projs[idx]=proj; else projs.unshift(proj);
  localStorage.setItem(PROJ_KEY,JSON.stringify(projs));
}
function deleteProject(id){
  const projs=getProjects().filter(p=>p.id!==id);
  localStorage.setItem(PROJ_KEY,JSON.stringify(projs));
}
function saveCurrent(){
  if(!currentProjId)return;
  const projs=getProjects();
  const proj=projs.find(p=>p.id===currentProjId)||{id:currentProjId};
  proj.state={...st,files:st.files.map(f=>f.type==="text"?f:{...f,data:"[binary]"})};
  proj.name=st.project?.slice(0,40)||"無題";
  proj.updatedAt=new Date().toISOString();
  proj.status=st.step==="summary"?"done":"running";
  proj.score=st.mgrState?Object.values(st.mgrState.scores||{}).reduce((a,b)=>a+b,0):null;
  saveProject(proj);
}

// ─── RENDER ───
function S(u){
  Object.assign(st,u);
  if(!Array.isArray(st.brushupLog))st.brushupLog=[];
  if(!Array.isArray(st.files))st.files=[];
  if(!Array.isArray(st.history))st.history=[];
  if(st.step!=="projects"&&st.step!=="apikey"&&st.step!=="input")saveCurrent();
  // statusMsgだけの更新なら部分更新（フラッシュ防止）
  if(Object.keys(u).length===1&&u.statusMsg!==undefined){
    const el=document.getElementById("statusMsg");
    if(el){el.textContent=u.statusMsg;return;}
  }
  render();
}

function render(){
  const hr=document.getElementById("hright");
  hr.style.display=(st.step==="meeting"||st.step==="manager"||st.step==="summary"||st.step==="input")?"flex":"none";
  const app=document.getElementById("app");
  // スクロール位置を保持
  const scrollY=window.scrollY;
  if(st.step==="apikey")app.innerHTML=renderApiKey();
  else if(st.step==="projects")app.innerHTML=renderProjects();
  else if(st.step==="input")app.innerHTML=renderInput();
  else if(st.step==="meeting")app.innerHTML=renderMeeting();
  else if(st.step==="manager")app.innerHTML=renderManager();
  else app.innerHTML=renderSummary();
  bindEvents();
  // スクロール位置を復元（カウントダウン中の跳ね防止）
  if(st.busy&&st.statusMsg)window.scrollTo(0,scrollY);
}

// ── API KEY ──
function renderApiKey(){
  const saved=localStorage.getItem(APIKEY_KEY)||"";
  return`<div class="api-screen fade">
    <div style="font-size:32px;margin-bottom:14px">⚡</div>
    <h2>APIキー設定</h2>
    <p>Anthropic APIキーを入力してください。<br>キーはこのブラウザ内にのみ保存されます。</p>
    ${saved?`<div class="saved-key-box"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg> ${saved.slice(0,20)}••••</span><button class="forget-btn" onclick="forgetKey()">削除</button></div>`:""}
    <div class="input-wrap" style="margin-bottom:10px">
      <input type="password" id="apiKeyInput" placeholder="${saved?"変更する場合のみ入力":"sk-ant-api03-..."}"/>
      <button class="eye" onclick="toggleEye()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <p class="api-note">取得先: <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a></p>
    <button class="btn btn-accent" onclick="submitApiKey()">開始する →</button>
  </div>`;
}
function toggleEye(){const i=document.getElementById("apiKeyInput");if(i)i.type=i.type==="password"?"text":"password";}
function forgetKey(){if(confirm("APIキーを削除しますか？")){localStorage.removeItem(APIKEY_KEY);apiKey="";render();}}
function submitApiKey(){
  const v=document.getElementById("apiKeyInput")?.value?.trim();
  const saved=localStorage.getItem(APIKEY_KEY)||"";
  const key=v||saved;
  if(!key||!key.startsWith("sk-"))return alert("正しいAPIキーを入力してください");
  if(v)localStorage.setItem(APIKEY_KEY,v);
  apiKey=key;
  S({step:"projects"});
}

// ── PROJECTS ──
function renderProjects(){
  const projs=getProjects();
  const list=projs.length===0
    ?`<div style="text-align:center;padding:40px 0;color:var(--text3);font-size:13px">プロジェクトがありません<br><span style="font-size:11px">下のボタンから新規作成してください</span></div>`
    :projs.map(p=>{
      const d=new Date(p.updatedAt);
      const dateStr=`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
      const statusEl=p.status==="done"
        ?`<span class="proj-status status-done">✓ DONE${p.score?` · ${p.score}pt`:""}</span>`
        :`<span class="proj-status status-running">● 進行中</span>`;
      const icon=p.status==="done"?ICONS.done:ICONS.running;
      return`<div class="proj-card" onclick="openProject('${p.id}')">
        <div class="proj-icon" style="background:${p.status==="done"?"#071A0F":"#0A0E1A"}">${icon}</div>
        <div class="proj-info">
          <div class="proj-name">${p.name||"無題"}</div>
          <div class="proj-meta">更新: ${dateStr}</div>
        </div>
        ${statusEl}
        <div class="proj-actions" onclick="event.stopPropagation()">
          ${p.status!=="done"?`<button class="proj-btn" onclick="event.stopPropagation();openProject('${p.id}')">再開</button>`:""}
          <button class="proj-btn del" onclick="event.stopPropagation();removeProject('${p.id}')">削除</button>
        </div>
      </div>`;
    }).join("");
  return`<div class="fade">
    <div class="proj-header">
      <div>
        <div style="font-size:11px;color:var(--text3);letter-spacing:.1em;margin-bottom:3px">PROJECTS</div>
        <h2>マイプロジェクト</h2>
      </div>
      <button class="hbtn" onclick="S({step:'apikey'})">APIキー設定</button>
    </div>
    ${list}
    <button class="new-proj-btn" onclick="newProject()">＋ 新規プロジェクト</button>
  </div>`;
}
function openProject(id){
  const projs=getProjects();
  const proj=projs.find(p=>p.id===id);
  if(!proj){alert("プロジェクトが見つかりません");return;}
  currentProjId=id;
  if(proj.state&&proj.state.step){
    // stateが存在して有効なstepがある場合のみ復元
    Object.assign(st,proj.state);
    st.busy=false;st.loading=null;st.error="";
    if(!Array.isArray(st.brushupLog))st.brushupLog=[];
    if(!Array.isArray(st.files))st.files=[];
    if(!Array.isArray(st.history))st.history=[];
    if(!st.step||st.step==="projects")st.step="input";
  } else {
    // stateがない場合はinput画面で開く
    st.step="input";
    st.project=proj.name||"";
    st.files=[];
    st.history=[];
    st.brushupLog=[];
  }
  render();
}

async function resumeFromSave(){
  cancelled=false;
  if(!apiKey||!apiKey.startsWith("sk-")){
    S({error:"APIキーが見つかりません。ページを再読み込みしてください。"});
    return;
  }
  // バイナリファイルが[binary]になっている場合は除去
  const binaryFiles=st.files.filter(f=>f.data==="[binary]");
  if(binaryFiles.length>0){
    st.files=st.files.filter(f=>f.data!=="[binary]");
    S({needsReattach:binaryFiles.map(f=>f.name)});
  }
  const h=st.history||[];
  const phasesDone=h.length;
  if(st.step==="manager"){
    S({busy:true,statusMsg:"マネージャー審査を再開中...",error:""});
    const histText=buildHistText(h);
    const loopCount=st.loopCount||0;
    await runManagerAuto(histText,"",loopCount,h);
  } else if(phasesDone<PHASE_JA.length){
    const nextPhase=phasesDone;
    S({busy:true,statusMsg:`Phase ${nextPhase+1}から再開中...`,answers:{},questions:null,error:""});
    await runPhase(nextPhase,h);
  } else {
    S({error:"再開できる状態ではありません。新規プロジェクトを作成してください。"});
  }
}
function newProject(){
  currentProjId="proj_"+Date.now();
  st={step:"input",project:"",files:[],facts:"",phaseIdx:0,questions:null,ctx:"",answers:{},loading:null,history:[],mgrState:null,loopCount:0,summary:null,error:"",busy:false,statusMsg:""};
  render();
}
function removeProject(id){
  cancelled=true;
  setTimeout(()=>{
    cancelled=false;
    deleteProject(id);
    if(currentProjId===id){currentProjId=null;st={...st,step:"projects"};}
    render();
  },100);
}

// ── INPUT ──
function renderInput(){
  const flist=st.files&&st.files.length>0?st.files.map((f,i)=>`<div class="fi-item"><span style="font-size:11px;color:var(--text3);font-weight:600">${f.type==="pdf"?"PDF":"TXT"}</span><span class="fi-name">${f.name}</span><button class="fi-rm" onclick="removeFile(${i})">×</button></div>`).join(""):"";
  return`<div class="fade">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px">
      <button onclick="S({step:'projects'})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1">‹</button>
      <div style="font-size:13px;font-weight:600;color:var(--text2)">新規プロジェクト</div>
    </div>
    <div class="badges">
      ${Object.values(AGENTS).map(a=>`<span class="abadge" style="display:inline-flex;align-items:center;gap:5px"><span style="color:var(--text3)">${ICONS[a.icon]}</span>${a.name}</span>`).join("")}
      <span class="abadge" style="border-color:var(--border2);color:var(--text2);display:inline-flex;align-items:center;gap:5px">${ICONS.manager} MANAGER</span>
    </div>
    <label class="lbl">企画の概要</label>
    <textarea id="ptxt" rows="5" placeholder="例：30代向けオーガニックスキンケアブランドをD2Cで展開したい。競合は資生堂ナチュラルライン。初年度予算3000万円。">${st.project}</textarea>
    <label class="lbl" style="margin-top:12px">確定している事実・数値（任意）</label>
    <textarea id="factstxt" rows="4" placeholder="例：&#10;・月間問い合わせ数：約30件&#10;・成約率：10%&#10;・客単価：15万円&#10;・主な流入：紹介80%、SNS20%&#10;※エージェントはここに書いた数値を推論せず事実として使います">${st.facts||""}</textarea>
    <label class="lbl" style="margin-top:12px">参考資料（任意）</label>
    <div class="drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div style="margin-bottom:5px;color:var(--text3)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></div>
      <div style="font-size:12px;color:var(--text2)">PDF・テキストをドロップ（画像不可）</div>
      <div style="font-size:10px;color:var(--text3);margin-top:2px">テキストに変換して送信されます</div>
    </div>
    ${flist}
    <label class="lbl" style="margin-top:8px">または直接テキストで入力</label>
    <textarea id="materialtxt" rows="3" placeholder="資料の内容や補足情報をここに直接入力することもできます">${st.materials||""}</textarea>
    ${st.error?`<div class="err">${st.error}</div>`:""}
    <button class="btn btn-accent" id="startBtn" onclick="startMeeting()" ${st.project.trim()?"":"disabled"}>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Start MTG
    </button>
    ${st.history&&st.history.length>0?`<button class="btn btn-ghost" style="margin-top:6px" onclick="backToMeeting()">← 会議画面に戻る</button>`:""}
    <button class="btn btn-ghost" onclick="S({step:'projects'})">← 戻る</button>
  </div>`;
}

// ── MEETING ──
function renderMeeting(){
  const progDots=["課題定義","市場分析","戦略立案","実行計画","Manager審査"].map((name,i)=>{
    const cls=i<st.phaseIdx?"done":i===st.phaseIdx?"active":"";
    return`<div class="prog-stage ${cls}"><div class="prog-dot">${i<st.phaseIdx?"✓":i+1}</div><div class="prog-name">${name}</div></div>`;
  }).join("");
  const sdot=st.error?`<div class="sdot err"></div>`:`<div class="sdot ${st.busy?"running":"ok"}"></div>`;
  const statusBox=`<div class="status-bar">${sdot}<span id="statusMsg" style="font-size:12px">${st.error||st.statusMsg||"自動実行中..."}</span></div>`;
  const reattachBanner="";
  const hist=st.history.map((r,ri)=>`<div class="hist-block"><div class="hist-div">── ${PHASES[ri]} · ${PHASE_JA[ri]} ──</div>${Object.entries(r.answers).map(([id,a])=>`<div class="agent-card" style="border-color:var(--border2)"><div class="agent-head"><span style="color:var(--text3);display:flex">${ICONS[AGENTS[id].icon]}</span><span class="agent-name" style="color:var(--accent)">${AGENTS[id].name}</span></div><div class="agent-ans">${a}</div></div>`).join("")}</div>`).join("");
  let cur="";
  if(!st.questions&&!st.busy){
    // 止まっている状態 - 再開ボタンを表示
    cur=`<div style="text-align:center;padding:32px 0">
      <div style="font-size:13px;color:var(--text2);margin-bottom:16px">会議が一時停止しています</div>
      <button class="btn btn-accent" style="max-width:240px" onclick="retryFromError()">▶ 続きから再開する</button>
    </div>`;
  } else if(!st.questions&&st.busy){cur=`<div class="spinner">質問を生成中...</div>`;}
  else if(st.questions){
    const cards=Object.keys(AGENTS).map(id=>{
      const a=st.answers[id],isL=st.loading===id,q=st.questions[id]||"";
      return`<div class="agent-card" style="border-color:${a?AGENTS[id].color+"30":"var(--border)"}">
        <div class="agent-head"><span style="color:var(--text3);display:flex;align-items:center">${ICONS[AGENTS[id].icon]||""}</span><span class="agent-name" style="color:var(--accent)">${AGENTS[id].name}</span>
        <span style="margin-left:auto;font-size:10px;color:${a?"var(--green)":isL?"var(--accent)":"var(--text3)"}">${a?"✓ 完了":isL?"考え中...":"待機中..."}</span>
        </div>${q?`<div class="agent-q">${q}</div>`:""}
        ${a?`<div class="agent-ans">${a}</div>`:isL?`<div class="dots"><div class="dot b1" style="background:${AGENTS[id].color}"></div><div class="dot b2" style="background:${AGENTS[id].color}"></div><div class="dot b3" style="background:${AGENTS[id].color}"></div></div>`:""}
      </div>`;
    }).join("");
    cur=`<div class="fade"><div class="phase-lbl">${PHASES[st.phaseIdx]}</div><div class="phase-ttl">${PHASE_JA[st.phaseIdx]}</div>${st.ctx?`<div class="ctx-box">${st.ctx}</div>`:""}${cards}</div>`;
  }
  return`<div><div class="prog-wrap"><div class="prog-stages">${progDots}</div></div>${statusBox}${reattachBanner}${hist}${cur}${st.error?`<div class="err">${st.error}<br><button class="retry-btn" onclick="retryFromError()">リトライ</button></div>`:""}</div>`;
}

// ── MANAGER ──
function renderManager(){
  // First time (no mgrState yet): show spinner
  if(!st.mgrState&&!st.busy)return`<div style="text-align:center;padding:32px 0">
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">マネージャー審査が一時停止しています</div>
    <button class="btn btn-accent" style="max-width:240px" onclick="retryFromError()">▶ 続きから再開する</button>
  </div>`;
  if(!st.mgrState)return`<div class="spinner">マネージャーが仮想空間でシミュレーション中...<br><span style="font-size:11px;display:block;margin-top:6px">ループ ${st.loopCount}/30</span></div>`;
  const m=st.mgrState;if(!m)return`<div class="spinner">読み込み中...</div>`;
  const total=Object.values(m.scores||{}).reduce((a,b)=>a+b,0);
  const approved=total>=95;
  const sc=approved?"var(--green)":total>=70?"var(--amber)":"var(--red)";
  const sbg=approved?"#071A0F":total>=70?"#1A1300":"#1A0508";
  const scoreCards=SCORE_ITEMS.map(k=>{
    const v=Math.min(20,Math.max(0,parseInt(m.scores?.[k])||0));
    const c=v>=16?"#0FA66A":v>=12?"#F5A623":"#F04438";
    const bg=v>=16?"#E8FBF3":v>=12?"#FFF8ED":"#FFF0EE";
    const pct=v/20*100;
    return`<div class="score-item" style="background:${bg}">
      <div style="font-size:10px;font-weight:700;color:#8E97C0;margin-bottom:6px;letter-spacing:.04em">${k}</div>
      <div style="height:5px;background:#E2E6F0;border-radius:3px;margin-bottom:6px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${c};border-radius:3px;transition:width .6s ease"></div>
      </div>
      <div style="font-size:16px;font-weight:800;color:${c}">${v}<span style="font-size:10px;color:#8E97C0;font-weight:400">/20</span></div>
    </div>`;
  }).join("");
  const statusMsg=approved?`<div style="font-size:12px;color:var(--green);padding:6px 0;animation:blink 1.5s infinite">✓ Approved — 最終レポートを生成中...</div>`
    :st.loopCount>=40?`<div class="err" style="background:#FEF0EF;color:#c0392b">最大回数（40回）に到達しました。</div>`
    :st.loopCount>=30&&!st.extraMode&&!st.extraUsed&&!st.busy?`<div style="border:1.5px solid #2195ca;border-radius:12px;padding:18px;margin-top:12px;background:#EBF6FF">
        <div style="font-size:13px;font-weight:700;color:#2195ca;margin-bottom:6px">🔍 追加ブラッシュアップで精度を上げる</div>
        <div style="font-size:12px;color:#4A5E72;margin-bottom:12px">エージェントがいくつか質問します。回答することでより具体的な分析が可能になります（最大+10回）</div>
        <button class="btn btn-accent" style="max-width:240px;margin:0" onclick="startExtraMode()">さらに10回ブラッシュアップする</button>
      </div>`
    :`<div style="font-size:12px;color:var(--text3);padding:6px 0;animation:blink 1.5s infinite">ブラッシュアップ中... (${st.loopCount}/30)</div>`;
  return`<div class="fade">
    <div class="mgr-panel">
      <div class="mgr-hdr">
        ${ICONS.manager}
        <span style="font-size:12px;font-weight:700;letter-spacing:.04em">マネージャー審査</span>
        <span class="loop-badge">ループ ${st.loopCount}/30</span>
        ${approved?`<span style="margin-left:8px;font-size:10px;font-weight:700;color:var(--green)">✓ 承認済み</span>`:""}
      </div>
      <div class="mgr-body">
        ${m.env?`<div class="env-badge" style="display:inline-flex;align-items:center;gap:5px">${ICONS.globe} ${m.env}</div>`:""}
        <div class="score-grid">${scoreCards}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:12px;margin-bottom:14px;border:2px solid ${sc};background:${sbg}">
          <div>
            <div style="font-size:10px;color:#8AA0B0;margin-bottom:4px;letter-spacing:.1em;font-weight:700">TOTAL SCORE</div>
            <div style="font-size:32px;font-weight:800;color:${sc};line-height:1">${total}<span style="font-size:14px;font-weight:400;color:#8AA0B0">/100</span></div>
          </div>
          <div style="font-size:12px;font-weight:700;color:${sc};padding:7px 16px;border-radius:100px;background:rgba(255,255,255,.9);border:2px solid ${sc}">${approved?"✓ 承認済み":total>=70?"△ 改善中":"✗ 要改善"}</div>
        </div>
        ${m.verdict?`<div class="mgr-verdict">${m.verdict}</div>`:""}
        ${m.feedback&&!approved?`<div class="mgr-feedback">${m.feedback}</div>`:""}
        ${st.busy && !st.brushupProgress?.active ? `<div style="font-size:12px;color:var(--text3);padding:6px 0;animation:blink 1.5s infinite">${st.statusMsg||"マネージャーが審査中..."}</div>` : statusMsg}
        ${(()=>{return (st.brushupLog&&Array.isArray(st.brushupLog)&&st.brushupLog.length>0)?renderBrushupProgress():"";})()}
      </div>
    </div>
    ${(st.extraMode&&st.extraQuestions&&st.extraQuestions.length>0)?renderExtraQuestions():""}
    ${st.error?`<div class="err">${st.error}<br><button class="retry-btn" onclick="retryBrushup()">リトライ</button></div>`:""}
  </div>`;
}

function renderBrushupProgress(){
  if(!st.brushupLog||!Array.isArray(st.brushupLog)||st.brushupLog.length===0)return"";
  const rounds=st.brushupLog.map(function(round,ri){
    const isLast=ri===st.brushupLog.length-1;
    const allDone=Object.values(round.agents||{}).every(function(e){return e&&e.status==="done";});
    const hc=allDone?"#23956a":"#2195ca";
    const hbg=allDone?"#F0FAF5":"#EBF6FF";
    const fb=(round.feedback||"品質改善中").slice(0,40);
    const cards=Object.keys(AGENTS).map(function(id){
      const entry=round.agents[id];if(!entry)return"";
      const done=entry.status==="done";const thinking=entry.status==="thinking";
      const dc=done?"#23956a":thinking?"#2195ca":"#8AA0B0";
      const cbg=done?"#F0FAF5":thinking?"#EBF6FF":"#F8FAFB";
      const cb=done?"rgba(35,149,106,.25)":thinking?"rgba(33,149,202,.25)":"#E4EAF0";
      return'<div style="border:1px solid '+cb+';border-radius:8px;padding:10px 12px;margin-bottom:6px;background:'+cbg+'">'+
        '<div style="display:flex;align-items:center;gap:7px;margin-bottom:'+(done&&entry.ans?"6px":"0")+'">'+
        '<span style="color:'+dc+';display:flex">'+(ICONS[AGENTS[id].icon]||"")+'</span>'+
        '<span style="font-size:11px;font-weight:700;color:#1A2A38">'+AGENTS[id].name+'</span>'+
        '<span style="margin-left:auto;font-size:10px;color:'+dc+';font-weight:600">'+(done?"✓ 完了":thinking?"改善中...":"待機")+'</span>'+
        '</div>'+
        (thinking?'<div style="display:flex;gap:4px;padding:4px 0"><div class="dot b1" style="background:#2195ca"></div><div class="dot b2" style="background:#2195ca"></div><div class="dot b3" style="background:#2195ca"></div></div>':"")+
        (done&&entry.ans?'<div style="font-size:12px;color:#4A6070;line-height:1.75">'+entry.ans+'</div>':"")+
      '</div>';
    }).join("");
    const chev='style="color:#8AA0B0;transition:transform .2s;transform:'+(isLast?"rotate(180deg)":"rotate(0)")+'"';
    return'<div style="border:1.5px solid '+(allDone?"rgba(35,149,106,.2)":"rgba(33,149,202,.2)")+';border-radius:12px;overflow:hidden;margin-bottom:8px">'+
      '<div onclick="toggleRound('+round.round+')" style="display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:'+hbg+';user-select:none">'+
      '<span style="width:22px;height:22px;border-radius:50%;background:'+hc+';color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+round.round+'</span>'+
      '<span style="font-size:11px;font-weight:700;color:'+hc+'">Round '+round.round+'</span>'+
      '<span style="font-size:11px;color:#8AA0B0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+fb+'</span>'+
      '<span style="font-size:10px;color:'+hc+';font-weight:600">'+(allDone?"完了":"進行中")+'</span>'+
      '<svg id="round-chevron-'+round.round+'" '+chev+' width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>'+
      '</div>'+
      '<div id="round-body-'+round.round+'" style="display:'+(isLast?"block":"none")+';padding:12px;background:#fff;border-top:1px solid #E4EAF0">'+cards+'</div>'+
    '</div>';
  }).join("");
  return'<div style="margin-top:16px;border-top:1px solid #E4EAF0;padding-top:16px">'+rounds+'</div>';
}

    <button class="btn btn-ghost" onclick="goProjects()">← プロジェクト一覧へ</button>
  </div>`;
}

function backToMeeting(){
  // 直前の会議画面に戻る
  const prevStep=st.history&&st.history.length>=PHASE_JA.length?"manager":"meeting";
  st.step=prevStep;
  st.busy=false;
  st.error="";
  render();
}

function goEdit(){
  // 進行中の内容を保持したままinput画面へ
  cancelled=true;
  saveCurrent();
  setTimeout(()=>{
    cancelled=false;
    // stepだけinputに戻す（project/facts/filesは保持）
    st.step="input";
    st.busy=false;
    st.loading=null;
    st.error="";
    render();
  },150);
}

function goProjects(){
  cancelled=true;
  saveCurrent();
  setTimeout(()=>{
    cancelled=false;
    S({step:"projects"});
  },200);
}

function buildReport(){
  const s=st.summary||{};const m=st.mgrState;
  const total=Object.values(m?.scores||{}).reduce((a,b)=>a+b,0);
  let t=`STRATEGY COUNCIL — Final Report\n${"═".repeat(50)}\n\n`;
  t+=`Project: ${st.project}\nGenerated: ${new Date().toLocaleString("ja-JP")}\n\n`;
  t+=`${"─".repeat(40)}\nMEETING LOG\n\n`;
  st.history.forEach((r,i)=>{t+=`■ Phase ${i+1}: ${PHASE_JA[i]}\n`;Object.entries(r.answers).forEach(([id,a])=>{t+=`\n[${AGENTS[id].name}]\n${a}\n`;});t+="\n";});
  t+=`${"─".repeat(40)}\nマネージャー審査\n`;
  t+=`Space: ${m?.env||"—"}\nScore: ${total}/100\n`;
  if(m?.scores)Object.entries(m.scores).forEach(([k,v])=>{t+=`  ${k}: ${v}/20\n`;});
  t+=`\n${"─".repeat(40)}\nFINAL STRATEGY\n\n`;
  t+=`Title: ${s.title||""}\n\nKey Insight:\n${s.keyInsight||""}\n\nStrategy:\n${s.strategy||""}\n\nアクションプラン:\n${(s.actions||[]).map((a,i)=>`${i+1}. ${a}`).join("\n")}\n\nKPI:\n${(s.kpi||[]).map(k=>`◆ ${k}`).join("\n")}\n\nNext Action:\n${s.nextStep||""}\n`;
  return t;
}

async function addFiles(raw){const p=(await Promise.all(raw.map(pf))).filter(Boolean);st.files=[...st.files,...p];render();}
async function pf(f){
  const ext=f.name.split(".").pop().toLowerCase();
  if(f.type==="application/pdf"||ext==="pdf"){
    // PDFはページ内テキストを抽出してtext型として保存
    try{
      const arrayBuf=await f.arrayBuffer();
      const txt=await extractPdfText(arrayBuf);
      return{type:"text",name:f.name,data:txt.slice(0,3000)};
    }catch(e){
      // 抽出失敗時はファイル名のみ記録
      return{type:"text",name:f.name,data:`[${f.name}のテキスト抽出に失敗しました]`};
    }
  }else if(f.type.startsWith("image/")){
    alert("画像ファイルはトークン消費が大きいため対応していません。テキストエリアに内容を貼り付けてください。");
    return null;
  }else{
    const d=await toTxt(f);
    return{type:"text",name:f.name,data:d.slice(0,3000)};
  }
}

async function extractPdfText(arrayBuf){
  // ブラウザでPDFテキスト抽出（pdfjs-distを使用）
  const pdfjsLib=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.mjs");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.mjs";
  const pdf=await pdfjsLib.getDocument({data:arrayBuf}).promise;
  let text="";
  for(let i=1;i<=Math.min(pdf.numPages,10);i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    pages.push(content.items.map(function(item){return item.str;}).join(" "));

  }
  return text||"[テキストを抽出できませんでした]";
}
function b64(f){return new Promise((r,j)=>{const rd=new FileReader();rd.onload=()=>r(rd.result.split(",")[1]);rd.onerror=j;rd.readAsDataURL(f);});}
function toTxt(f){return new Promise((r,j)=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.onerror=j;rd.readAsText(f);});}

async function api(system,msg,retryCount=0){
  const content=[];
  for(const f of (st.files||[])){
    if(f.data&&f.data!=="[binary]"){
      content.push({type:"text",text:"[資料: "+f.name+"]\n"+f.data.slice(0,2000)});
    }
  }
  content.push({type:"text",text:msg});
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,system,messages:[{role:"user",content}]})});
  const data=await res.json();
  if(data.error){
    if(res.status===429||data.error.message?.includes("rate limit")||data.error.message?.includes("token")){
      if(retryCount>=3)throw new Error("レート制限：3回リトライしましたが解消されません。数分待ってからリトライしてください。");
      for(let i=120;i>0;i--){
        if(cancelled)throw new Error("__CANCELLED__");
        // statusMsgのみ部分更新（DOM全体を再描画しない）
        st.statusMsg=`レート制限中 — ${i}秒後に自動リトライ (${retryCount+1}/3回目)`;
        const el=document.getElementById("statusMsg");
        if(el)el.textContent=st.statusMsg;
        await new Promise(r=>setTimeout(r,1000));
        if(cancelled)throw new Error("__CANCELLED__");
      }
      return api(system,msg,retryCount+1);
    }
    throw new Error(data.error.message);
  }
  if(!res.ok&&res.status===0)throw new Error("ネットワークエラー：Vercelから開いてください。");
  return data.content[0].text;
}
function cleanText(t){
  if(!t)return"";
  // ```json...```ブロックを除去
  t=t.replace(/```json[\s\S]*?```/g,"").replace(/```/g,"").trim();
  // JSONオブジェクトが混入している場合、その手前で切る
  const ji=t.search(/\{"(title|keyInsight|strategy|actions|kpi)"/);
  if(ji>5)return t.slice(0,ji).trim();
  if(ji===0||ji<0&&t.startsWith("{"))return"";
  return t;
}

function pj(t){
  if(!t)return null;
  // まずそのままパース
  try{return JSON.parse(t);}catch(e0){}
  // マークダウン除去
  try{return JSON.parse(t.replace(/```json\n?|```/g,"").trim());}catch(e1){}
  // {から}を抽出
  try{const s=t.indexOf("{");const e=t.lastIndexOf("}");if(s>=0&&e>s)return JSON.parse(t.slice(s,e+1));}catch(e2){}
  return null;
}

async function runManagerAuto(histText,prevRevised,loopCount,history){
  S({loopCount:loopCount,busy:true,statusMsg:"マネージャーがシミュレーション中... (第"+(loopCount+1)+"回目)"});
  const combined=prevRevised?histText+"\n\n[Revised]\n"+prevRevised:histText;
  try{
    checkCancelled();
    const factsNote=st.facts&&st.facts.trim()?"\n【確定事実】"+st.facts.slice(0,150):"";
    const mgrMsg="企画："+st.project+factsNote+"\n\n戦略案：\n"+combined+"\nブラッシュアップ回数："+loopCount;
    const raw=await api(MGR,mgrMsg);

    // ── JSONパース（3段階） ──
    let m=null;
    // 段階1: 直接パース
    try{m=JSON.parse(raw);}catch(e1){}
    // 段階2: マークダウン除去
    if(!m||!m.scores){
      try{m=JSON.parse(raw.replace(/```json\n?|```/g,"").trim());}catch(e2){}
    }
    // 段階3: {}ブロック抽出
    if(!m||!m.scores){
      try{
        const si=raw.indexOf("{");
        const ei=raw.lastIndexOf("}");
        if(si>=0&&ei>si)m=JSON.parse(raw.slice(si,ei+1));
      }catch(e3){}
    }
    // 段階4: 正規表現でスコアを個別抽出
    if(!m||!m.scores){
      const keys=["市場性","実現性","独自性","戦略整合性","ユーザー共感度"];
      const scores={};
      keys.forEach(function(k){
        const re=new RegExp('"'+k+'"\\s*:\\s*(\\d+)');
        const match=raw.match(re);
        scores[k]=match?parseInt(match[1]):0;
      });
      const envM=raw.match(/"env"\s*:\s*"([^"]+)"/);
      const verdM=raw.match(/"verdict"\s*:\s*"([^"]+)"/);
      const feedM=raw.match(/"feedback"\s*:\s*"([^"]+)"/);
      const revM=raw.match(/"revisedStrategy"\s*:\s*"([^"]+)"/);
      m={
        env:envM?envM[1]:"仮想空間",
        scores:scores,
        verdict:verdM?verdM[1]:"",
        feedback:feedM?feedM[1]:"",
        revisedStrategy:revM?revM[1]:""
      };
    }
    if(!m)m={};

    // ── スコアを0-20にクランプ ──
    if(m.scores){
      var keys2=Object.keys(m.scores);
      for(var i=0;i<keys2.length;i++){
        m.scores[keys2[i]]=Math.min(20,Math.max(0,parseInt(m.scores[keys2[i]])||0));
      }
    }

    const total=Object.values(m.scores||{}).reduce(function(a,b){return a+b;},0);
    S({mgrState:m,loopCount:loopCount,busy:false});
    saveCurrent();

    // ── ループ継続判定 ──
    if(total>=95){
      // 承認！最終レポート生成
      S({statusMsg:"✓ 承認されました！最終レポートを生成中..."});
      setTimeout(function(){generateFinalAuto(history,m);},600);
    } else if(loopCount>=40){
      // 40回到達 → 強制終了
      S({statusMsg:"最大回数（40回）到達。最高スコア案でレポートを生成します。"});
      setTimeout(function(){generateFinalAuto(history,m);},600);
    } else if(loopCount>=30&&!st.extraMode&&!st.extraUsed){
      // 30回到達 → ユーザーに追加オプションを提示（処理を止める）
      S({busy:false,statusMsg:"30回のブラッシュアップが完了しました。"});
      // ここで処理を止める（brushupAutoを呼ばない）
    } else {
      // ブラッシュアップ継続
      await brushupAuto(histText,m,loopCount+1,history);
    }
  }catch(e){
    if(e.message==="__CANCELLED__")return;
    S({error:e.message,busy:false,statusMsg:""});
  }
}
async function brushupAuto(histText,prevMgr,newCount,history){
  const feedback=prevMgr?.feedback||"";
  const revised={};
  const fbShort=feedback.slice(0,80);

  // Helper: build completely new log array (never mutate in place)
  function updateLog(agentId, agentData){
    const prev=st.brushupLog;
    const lastIdx=prev.length-1;
    const newAgents={...prev[lastIdx].agents,[agentId]:agentData};
    const newLast={...prev[lastIdx],agents:newAgents};
    const newLog=[...prev.slice(0,lastIdx),newLast];
    return newLog;
  }

  // Add new round with empty agents
  const newLog=[...st.brushupLog,{round:newCount,feedback:fbShort,agents:{}}];
  S({busy:true, brushupLog:newLog, statusMsg:`ブラッシュアップ ${newCount}/30回 — 改善開始...`});

  for(const id of Object.keys(AGENTS)){
    // thinking state - fully immutable update
    S({brushupLog:updateLog(id,{status:"thinking",ans:""}),
       statusMsg:`ブラッシュアップ ${newCount}/30回 — ${AGENTS[id].name} が改善中...`});
    try{
      checkCancelled();
      const ans=await api(
        ROLES[id],
        `改善指示：${feedback}\n企画：${st.project.slice(0,100)}\n結論のみ50字で`
      );
      revised[id]=ans;
      // done state - fully immutable update
      S({brushupLog:updateLog(id,{status:"done",ans}),
         statusMsg:`ブラッシュアップ ${newCount}/30回 — ${AGENTS[id].name} 完了`});
    }
    catch(e){if(e.message==="__CANCELLED__")throw e;S({error:e.message,busy:false});throw e;}
  }

  const revisedText=Object.entries(revised).map(([id,a])=>`${AGENTS[id].name}(revised): ${a}`).join("\n");
  await runManagerAuto(histText,(prevMgr?.revisedStrategy||"")+"\n"+revisedText,newCount,history);
}
async function generateFinalAuto(history,mgrResult){
  S({busy:true,statusMsg:"最終レポートを生成中..."});
  const total=Object.values(mgrResult&&mgrResult.scores||{}).reduce(function(a,b){return a+b;},0);
  try{
    const sumMsg="企画："+st.project+"\n\n会議ログ：\n"+buildHistText(history)+"\nManagerスコア："+total+"点\n総評："+(mgrResult&&mgrResult.verdict||"");
    const raw=await api(SUM,sumMsg);

    // ── 4段階パース ──
    let s=null;
    // 1: そのままパース
    try{s=JSON.parse(raw);}catch(e1){}
    // 2: マークダウン除去
    if(!s||!s.title){
      try{s=JSON.parse(raw.replace(/```json\n?|```/g,"").trim());}catch(e2){}
    }
    // 3: {}ブロック抽出
    if(!s||!s.title){
      try{
        const si=raw.indexOf("{");const ei=raw.lastIndexOf("}");
        if(si>=0&&ei>si)s=JSON.parse(raw.slice(si,ei+1));
      }catch(e3){}
    }
    // 4: 正規表現で各フィールドを個別抽出
    if(!s||!s.title){
      function extractStr(text,key){
        const re=new RegExp('"'+key+'"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"');
        const m=text.match(re);
        return m?m[1].replace(/\\n/g,"\n").replace(/\\"/g,'"'):"";
      }
      function extractArr(text,key){
        const re=new RegExp('"'+key+'"\\s*:\\s*\\[([^\\]]+)\\]');
        const m=text.match(re);
        if(!m)return[];
        const items=m[1].match(/"((?:[^"\\\\]|\\\\.)*)"/g)||[];
        return items.map(function(i){return i.replace(/^"|"$/g,"");});
      }
      s={
        title:extractStr(raw,"title")||"Strategy Report",
        keyInsight:extractStr(raw,"keyInsight"),
        strategy:extractStr(raw,"strategy"),
        actions:extractArr(raw,"actions"),
        kpi:extractArr(raw,"kpi"),
        nextStep:extractStr(raw,"nextStep")
      };
    }
    // strategyにJSONが混入していたら除去
    if(s&&s.strategy){
      s.strategy=s.strategy.replace(/```json[\s\S]*?```/g,"").replace(/```/g,"").trim();
      // strategyの中にJSONオブジェクトが含まれている場合、その前のテキストだけ取る
      const jsonIdx=s.strategy.indexOf('{"title"');
      if(jsonIdx>0)s.strategy=s.strategy.slice(0,jsonIdx).trim();
      if(jsonIdx===0){
        // strategyが丸ごとJSONならkeyInsightから取る
        s.strategy=s.keyInsight||"";
      }
    }
    if(!s)s={title:"Strategy Report",keyInsight:"",strategy:"",actions:[],kpi:[],nextStep:""};
    S({summary:s,step:"summary",busy:false,statusMsg:""});
    saveCurrent();
  }catch(e){
    if(e.message==="__CANCELLED__")return;
    S({error:e.message,busy:false,statusMsg:""});
  }
}

async function reattachFiles(input){
  const raw=Array.from(input.files);
  const processed=await Promise.all(raw.map(pf));
  // 既存ファイルと重複しないよう追加
  const existing=st.files.map(f=>f.name);
  const newFiles=processed.filter(f=>!existing.includes(f.name));
  st.files=[...st.files,...newFiles];
  // 再添付リストから削除
  const reattached=processed.map(f=>f.name);
  const remaining=(st.needsReattach||[]).filter(n=>!reattached.includes(n));
  S({needsReattach:remaining.length>0?remaining:null});
  input.value="";
  // 全て再添付完了したら自動再開
  if(remaining.length===0){
    setTimeout(()=>resumeFromSave(),500);
  }
}

function updateExtraAnswer(idx,val){
  if(!st.extraAnswers)st.extraAnswers={};
  st.extraAnswers[idx]=val;
}

function renderExtraQuestions(){
  const qs=st.extraQuestions||[];
  if(qs.length===0)return"";
  var forms=qs.map(function(q,i){
    const ans=(st.extraAnswers&&st.extraAnswers[i])||"";
    return'<div style="margin-bottom:12px">'+
      '<div style="font-size:12px;font-weight:600;color:#1A2A38;margin-bottom:5px">'+(i+1)+'. '+q+'</div>'+
      '<textarea rows="2" style="width:100%;border:1.5px solid #E4EAF0;border-radius:8px;padding:8px 12px;font-size:12px;font-family:inherit;resize:none;outline:none;box-sizing:border-box" '+
      'oninput="updateExtraAnswer('+i+',this.value)" '+
      'placeholder="回答を入力してください...">'+ans+'</textarea>'+
    '</div>';
  }).join("");
  return'<div style="margin-top:16px;border:1.5px solid #2195ca;border-radius:12px;padding:18px;background:#EBF6FF">'+
    '<div style="font-size:13px;font-weight:700;color:#2195ca;margin-bottom:4px">エージェントからの質問</div>'+
    '<div style="font-size:11px;color:#4A5E72;margin-bottom:14px">回答することでより精度の高い分析が可能になります</div>'+
    forms+
    '<button style="width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#23956a,#1a7a56);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit" onclick="submitExtraAnswers()">回答して再分析する →</button>'+
  '</div>';
}

async function startExtraMode(){
  if(!st.extraMode){
    S({extraMode:true,extraQuestions:[],extraAnswers:{},busy:true,statusMsg:"エージェントが追加の質問を生成中..."});
  }
  try{
    const score=Object.values(st.mgrState&&st.mgrState.scores||{}).reduce(function(a,b){return a+b;},0);
    const feedback=(st.mgrState&&st.mgrState.feedback)||"";
    const histText=buildHistText(st.history||[]);
    const sysP="あなたはマーケティング戦略の分析精度を高めるインタビュアーです。現在スコア"+score+"/100点。改善のため4つの質問をしてください。JSONのみ出力（他テキスト不要）：{\"questions\":[\"質問1\",\"質問2\",\"質問3\",\"質問4\"]}";
    const userP="企画："+st.project+"\n改善指示："+feedback+"\n要約："+histText.slice(0,300);
    const raw=await api(sysP,userP);
    const parsed=pj(raw)||{questions:[]};
    S({extraQuestions:parsed.questions||[],extraAnswers:{},busy:false,statusMsg:""});
  }catch(e){
    if(e.message==="__CANCELLED__")return;
    S({error:e.message,busy:false,extraMode:false});
  }
}

async function submitExtraAnswers(){
  const answers=st.extraAnswers||{};
  const qs=st.extraQuestions||[];
  const qaLines=qs.map(function(q,i){return"Q: "+q+"\nA: "+(answers[i]||"（未回答）");});
  const qaText=qaLines.join("\n");
  const newFacts=(st.facts||"")+"\n\n【追加情報（ユーザー回答）】\n"+qaText;
  S({facts:newFacts,extraMode:false,extraUsed:true,extraQuestions:[],extraAnswers:{},busy:true,statusMsg:"追加情報を反映してブラッシュアップ中..."});
  try{
    await brushupAuto(buildHistText(st.history||[]),st.mgrState,st.loopCount+1,st.history||[]);
  }catch(e){
    if(e.message==="__CANCELLED__")return;
    S({error:e.message,busy:false});
  }
}

async function retryFromError(){
  S({error:""});
  try{
    await resumeFromSave();
  }catch(e){
    if(e.message!=="__CANCELLED__"){
      S({error:e.message,busy:false});
    }
  }
}
async function retryBrushup(){if(!st.mgrState)return;S({error:""});await brushupAuto(buildHistText(st.history),st.mgrState,st.loopCount+1,st.history);}
function buildHistText(hist){
  return hist.map((r,i)=>`[Phase${i+1}:${PHASE_JA[i]}]`+Object.entries(r.answers).map(([id,a])=>`${AGENTS[id].name}:${a.slice(0,150)}`).join("|")).join("\n");
}
