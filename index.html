<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#3A3AF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Strategy Council">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233A3AF5'/><polygon points='55 18 22 60 49 60 45 82 78 40 51 40 55 18' fill='white'/></svg>">
<title>Strategy Council</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* 参照デザイン準拠：白ベース + ブルーアクセント */
  --bg:#F8FAFB;
  --bg2:#FFFFFF;
  --bg3:#F0F2FF;
  --bg4:#E8EBFF;
  --border:#E2E6F0;
  --border2:#C8CEEA;
  --text:#0F1128;
  --text2:#4A5280;
  --text3:#8E97C0;
  --accent:#3A3AF5;
  --accent2:#2828D4;
  --accent-light:#EEEEFF;
  --amber:#dbff00;
  --amber-light:#F4FFB0;
  --yellow:#dbff00;
  --yellow-light:#F4FFB0;
  --purple:#7B5CF0;
  --purple-light:#F0ECFF;
  --blue3:#8BA8F0;
  --green:#3A3AF5;
  --green-light:#EEEEFF;
  --red:#E84040;
  --red-light:#FFF0F0;
  --blue2:#5B8DEF;
  --card-hover:#F5F6FF;
  --shadow-sm:0 1px 4px rgba(58,58,245,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(58,58,245,.1),0 2px 6px rgba(0,0,0,.05);
  --shadow-lg:0 12px 40px rgba(58,58,245,.12),0 4px 12px rgba(0,0,0,.06);
  --r-sm:8px;--r-md:14px;--r-lg:18px;--r-xl:24px;
}

body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans JP',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.6;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#F0F2FF}
::-webkit-scrollbar-thumb{background:#C8CEEA;border-radius:2px}
textarea::-webkit-scrollbar{width:3px}
textarea::-webkit-scrollbar-thumb{background:#C8CEEA;border-radius:2px}

/* HEADER */
header{
  border-bottom:1px solid var(--border);
  padding:0 32px;height:58px;
  display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,.95);
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px);
  box-shadow:0 1px 8px rgba(58,58,245,.06);
}
.logo{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--blue2));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 3px 10px rgba(58,58,245,.35);
}
.htitle{font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--text)}
.hsub{font-size:10px;color:var(--text3);letter-spacing:.1em;font-weight:500}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{
  background:none;border:1.5px solid var(--border2);color:var(--text2);
  padding:6px 14px;border-radius:var(--r-sm);cursor:pointer;
  font-size:12px;font-family:inherit;font-weight:600;transition:all .15s;
}
.hbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.hbtn.icon-btn{padding:6px 10px;display:flex;align-items:center;justify-content:center}
.hbtn.icon-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.hbtn.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-light)}

main{max-width:780px;margin:0 auto;padding:36px 20px}

/* BUTTONS */
.btn{
  width:100%;padding:13px 20px;border:none;border-radius:var(--r-md);
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none!important}
.btn-accent{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  box-shadow:0 3px 14px rgba(58,58,245,.35);
}
.btn-accent:hover:not(:disabled){
  box-shadow:0 5px 20px rgba(58,58,245,.45);
  transform:translateY(-1px);
}
.btn-ghost{
  background:var(--bg2);border:1.5px solid var(--border);
  color:var(--text2);margin-top:8px;
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.btn-export{
  background:var(--bg2);border:2px solid var(--accent);
  color:var(--accent);margin-top:6px;font-weight:700;
}
.btn-export:hover{background:var(--accent-light);box-shadow:0 2px 10px rgba(58,58,245,.2)}

/* INPUTS */
textarea,input[type=text],input[type=password]{
  width:100%;background:var(--bg2);
  border:1.5px solid var(--border);border-radius:var(--r-md);
  color:var(--text);padding:12px 14px;font-size:14px;
  font-family:inherit;outline:none;transition:all .2s;
  box-shadow:var(--shadow-sm);
}
textarea{resize:vertical;line-height:1.7}
textarea:focus,input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(58,58,245,.1),var(--shadow-sm);
}
textarea::placeholder,input::placeholder{color:var(--text3)}
.lbl{
  font-size:11px;font-weight:700;color:var(--text3);
  letter-spacing:.08em;display:block;margin-bottom:6px;text-transform:uppercase;
}
.input-wrap{position:relative}
.input-wrap input{padding-right:44px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px}

/* DROP ZONE */
.drop{
  border:2px dashed var(--border2);border-radius:var(--r-md);
  padding:20px;text-align:center;cursor:pointer;margin:10px 0;
  transition:all .2s;background:var(--bg3);
}
.drop:hover,.drop.drag{border-color:var(--accent);background:var(--accent-light)}
.fi-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  margin-bottom:5px;background:var(--bg2);box-shadow:var(--shadow-sm);
}
.fi-name{font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi-badge{font-size:9px;padding:2px 7px;border-radius:100px;background:var(--accent-light);color:var(--accent);font-weight:700}
.fi-rm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:0 3px;transition:color .15s}
.fi-rm:hover{color:var(--red)}

/* PROJECT LIST */
.proj-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.proj-header h2{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--text)}
.proj-card{
  background:var(--bg2);border:1.5px solid var(--border);
  border-radius:var(--r-lg);padding:16px 20px;margin-bottom:10px;
  cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm);
}
.proj-card:hover{
  border-color:var(--accent);background:var(--bg2);
  box-shadow:var(--shadow-md);transform:translateY(-2px);
}
.proj-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.proj-info{flex:1;min-width:0}
.proj-name{font-size:14px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.proj-meta{font-size:11px;color:var(--text3)}
.proj-status{font-size:10px;padding:4px 11px;border-radius:100px;font-weight:700;letter-spacing:.04em;flex-shrink:0}
.status-running{background:var(--accent-light);color:var(--accent);border:1.5px solid rgba(58,58,245,.2)}
.status-done{background:var(--green-light);color:var(--green);border:1.5px solid rgba(15,166,106,.2)}
.proj-actions{display:flex;gap:6px;flex-shrink:0}
.proj-btn{
  padding:5px 12px;border-radius:var(--r-sm);font-size:11px;font-weight:600;
  font-family:inherit;cursor:pointer;border:1.5px solid var(--border);
  background:none;color:var(--text2);transition:all .15s;
}
.proj-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-light)}
.proj-btn.del:hover{color:var(--red);border-color:var(--red);background:var(--red-light)}
.new-proj-btn{
  width:100%;padding:16px;border:2px dashed var(--border2);
  border-radius:var(--r-lg);background:none;color:var(--text3);
  font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:10px;font-weight:600;
}
.new-proj-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

/* AGENT BADGES */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.abadge{
  font-size:11px;padding:5px 12px;border-radius:100px;
  background:var(--bg3);border:1.5px solid var(--border2);
  color:var(--text2);font-weight:600;display:inline-flex;align-items:center;gap:5px;
}

/* PROGRESS */
.prog-wrap{margin-bottom:28px}
.prog-stages{display:flex;align-items:flex-start;gap:0;position:relative}
.prog-stage{flex:1;text-align:center;position:relative}
.prog-stage:not(:last-child)::after{
  content:'';position:absolute;top:11px;left:55%;width:90%;height:2px;
  background:var(--border);z-index:0;border-radius:1px;
}
.prog-stage.done:not(:last-child)::after{background:var(--accent)}
.prog-dot{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border);
  background:var(--bg2);margin:0 auto 6px;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;transition:all .3s;color:var(--text3);
  box-shadow:var(--shadow-sm);
}
.prog-stage.done .prog-dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(58,58,245,.35)}
.prog-stage.active .prog-dot{border-color:var(--accent);color:var(--accent);animation:glow 1.5s infinite;background:var(--accent-light)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(58,58,245,.3)}50%{box-shadow:0 0 0 7px rgba(58,58,245,0)}}
.prog-name{font-size:9px;color:var(--text3);letter-spacing:.02em;line-height:1.3;font-weight:500}
.prog-stage.done .prog-name,.prog-stage.active .prog-name{color:var(--accent);font-weight:700}

/* STATUS BAR */
.status-bar{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  background:#FFFFFF;border:1.5px solid var(--border);
  border-radius:var(--r-md);margin-bottom:20px;
  font-size:12px;color:var(--text);font-weight:500;
  box-shadow:var(--shadow-sm);
}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sdot.running{background:var(--accent);animation:glow 1.2s infinite}
.sdot.ok{background:var(--green)}
.sdot.err{background:var(--red)}

/* AGENT CARDS */
.agent-card{
  border:1.5px solid var(--border);border-radius:var(--r-md);
  padding:16px;margin-bottom:10px;background:var(--bg2);
  transition:all .2s;box-shadow:var(--shadow-sm);
}
.agent-card:hover{box-shadow:var(--shadow-md);border-color:var(--border2)}
.agent-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.agent-name{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.agent-q{
  font-size:12px;color:var(--text2);background:var(--bg3);
  padding:8px 12px;border-radius:var(--r-sm);margin-bottom:10px;
  line-height:1.65;border-left:3px solid var(--accent);
}
.agent-ans{font-size:13px;color:var(--text2);line-height:1.85}
.dots{display:flex;gap:5px;padding:6px 0}
.dot{width:5px;height:5px;border-radius:50%}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
.b1{animation:blink 1.2s infinite}
.b2{animation:blink 1.2s infinite .22s}
.b3{animation:blink 1.2s infinite .44s}

/* HISTORY / ACCORDION */
.hist-block{opacity:.3;margin-bottom:16px}
.hist-div{font-size:10px;color:var(--text3);letter-spacing:.12em;margin-bottom:8px;font-weight:700}
.accordion{border:1.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.accordion-header{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;background:var(--bg2);transition:background .15s;user-select:none}
.accordion-header:hover{background:var(--accent-light)}
.accordion-phase{font-size:9px;font-weight:800;color:var(--accent);letter-spacing:.12em;min-width:64px;text-transform:uppercase}
.accordion-title{font-size:13px;font-weight:600;color:var(--text);flex:1}
.accordion-summary{font-size:11px;color:var(--text3);flex:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accordion-chevron{color:var(--text3);transition:transform .25s;flex-shrink:0}
.accordion-chevron.open{transform:rotate(180deg)}
.accordion-body{border-top:1.5px solid var(--border);padding:16px;background:var(--bg3);display:none}
.accordion-body.open{display:block;animation:fadeUp .2s ease}
.accordion-agent{padding:10px 0;border-bottom:1px solid var(--border)}
.accordion-agent:last-child{border-bottom:none}
.accordion-agent-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.accordion-agent-name{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.accordion-agent-ans{font-size:12px;color:var(--text2);line-height:1.8}

/* PHASE */
.phase-lbl{font-size:10px;color:var(--accent);letter-spacing:.15em;font-weight:800;margin-bottom:4px;text-transform:uppercase}
.phase-ttl{font-size:18px;font-weight:700;margin-bottom:12px;letter-spacing:-.02em}
.ctx-box{
  font-size:12px;color:var(--accent2);padding:10px 14px 10px 16px;
  border-left:3px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin-bottom:16px;background:var(--accent-light);font-weight:500;
}

/* MANAGER */
.mgr-panel{border:1.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-top:16px;box-shadow:var(--shadow-md)}
.mgr-hdr{
  display:flex;align-items:center;gap:10px;padding:14px 20px;
  background:linear-gradient(135deg,var(--accent-light),#EBF3FF);
  border-bottom:1.5px solid var(--border);
}
.mgr-body{padding:20px}
.env-badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;
  padding:4px 12px;border-radius:100px;
  background:var(--accent-light);color:var(--accent);
  border:1.5px solid rgba(58,58,245,.2);margin-bottom:16px;font-weight:600;
}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.score-item{background:var(--bg3);border-radius:var(--r-sm);padding:12px;border:1.5px solid var(--border)}
.score-name{font-size:10px;color:var(--text3);margin-bottom:6px;font-weight:700;letter-spacing:.04em}
.sbar-wrap{height:5px;background:var(--border);border-radius:3px;margin-bottom:6px;overflow:hidden}
.sbar{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.sval{font-size:15px;font-weight:800}
.mgr-verdict{font-size:13px;color:var(--text2);line-height:1.85;margin-bottom:12px}
.mgr-feedback{
  font-size:12px;color:var(--text2);
  background:var(--bg3);padding:10px 14px;
  border-radius:var(--r-sm);line-height:1.7;border-left:3px solid var(--accent);
}
.loop-badge{
  margin-left:auto;font-size:10px;padding:3px 10px;border-radius:100px;
  background:var(--accent-light);color:var(--accent);
  border:1.5px solid rgba(58,58,245,.2);font-weight:700;
}

/* SUMMARY — legacy (accordion等で使用) */
.insight-box{background:linear-gradient(135deg,var(--accent-light),#EBF3FF);border:1.5px solid rgba(58,58,245,.2);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;border-left:4px solid var(--accent);box-shadow:0 2px 10px rgba(58,58,245,.08)}
.strat-box{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kv-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-sm)}
.kv-title{font-size:9px;letter-spacing:.15em;margin-bottom:10px;font-weight:800;text-transform:uppercase}
.kv-item{font-size:12px;color:var(--text2);padding:7px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;line-height:1.5}
.next-box{background:linear-gradient(135deg,var(--accent-light),#EBF3FF);border:1.5px solid rgba(58,58,245,.2);border-radius:var(--r-md);padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(58,58,245,.08)}
.approved-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:4px 12px;border-radius:100px;background:var(--accent-light);color:var(--accent);border:1.5px solid rgba(58,58,245,.25);font-weight:700}
/* REPORT */
.rpt-section{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:28px 24px;margin-bottom:22px;box-shadow:var(--shadow-sm)}
/* 基本のセクションラベル：amber下線は付けない（強調したい箇所のみ .rpt-label-hl を併用） */
.rpt-label{font-size:15px;color:var(--accent);letter-spacing:.16em;font-weight:800;margin-bottom:16px;text-transform:uppercase;display:inline-block}
/* 強調用：太めの amber アンダーバー（今っぽい厚みの帯） */
.rpt-label-hl{box-shadow:inset 0 -9px 0 0 var(--amber);padding:0 3px 1px}
.rpt-phase-wrap{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding-bottom:4px}
.rpt-phase{flex:1;min-width:140px;background:var(--bg3);border-radius:12px;padding:14px 12px;border-top:3px solid var(--accent)}
.rpt-phase-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comp-table{width:100%;border-collapse:collapse;margin-top:8px}
.comp-table th{background:var(--bg3);padding:7px 10px;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-align:left;border-bottom:1.5px solid var(--border)}
.comp-table td{padding:9px 10px;font-size:11px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
.flow-node{background:var(--bg2);color:var(--text);border:1.5px solid var(--border);border-radius:10px;padding:7px 11px;font-size:11px;font-weight:700;text-align:center;line-height:1.4;box-shadow:0 2px 6px rgba(0,0,0,.06);white-space:nowrap}
.flow-node.hub{background:var(--accent);color:#fff;border:none}
.flow-node.source{background:var(--accent);color:#fff;border:none}
.flow-node.result{background:var(--purple);color:#fff;border:none}

/* MISC */
.spinner{text-align:center;padding:52px 0;font-size:13px;color:var(--text3);animation:blink 1.5s infinite;font-weight:500}
.err{font-size:12px;color:var(--red);background:var(--red-light);border-radius:var(--r-sm);padding:10px 14px;margin-top:10px;border:1.5px solid rgba(240,68,56,.2);font-weight:500}
.retry-btn{margin-top:8px;padding:6px 16px;border-radius:var(--r-sm);border:1.5px solid var(--red);background:none;color:var(--red);font-size:11px;font-family:inherit;cursor:pointer;font-weight:600;transition:all .15s}
.retry-btn:hover{background:var(--red-light)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .3s ease}

/* RESUME BANNER */
.resume-banner{background:var(--accent-light);border:1.5px solid rgba(58,58,245,.2);border-radius:var(--r-md);padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:14px}
.rbtn{padding:6px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border2);background:none;font-size:11px;font-family:inherit;cursor:pointer;font-weight:600;transition:all .15s}
.rbtn-yes{border-color:var(--accent);color:var(--accent);background:var(--bg2)}
.rbtn-yes:hover{background:var(--accent);color:#fff}
.rbtn-no{color:var(--text3)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,17,40,.45);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.modal{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-xl);padding:24px;max-width:400px;width:92%;box-shadow:var(--shadow-lg);animation:fadeUp .2s ease}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px;letter-spacing:-.02em}
.mbtn{width:100%;padding:12px 16px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);font-size:13px;font-family:inherit;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:all .15s;margin-bottom:8px;font-weight:500}
.mbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.modal-close{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:none;color:var(--text3);font-size:12px;font-family:inherit;cursor:pointer;margin-top:4px;font-weight:500;transition:all .15s}
.modal-close:hover{background:var(--bg3)}

/* API KEY SCREEN */
.api-screen{max-width:440px;margin:72px auto;text-align:center}
.api-screen h2{font-size:24px;font-weight:800;margin-bottom:10px;letter-spacing:-.04em}
.api-screen p{font-size:14px;color:var(--text2);line-height:1.75;margin-bottom:24px}
.saved-key-box{background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-md);padding:12px 16px;font-size:12px;color:var(--text2);display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:500}
.forget-btn{background:none;border:none;color:var(--red);font-size:11px;cursor:pointer;font-family:inherit;font-weight:700}
.api-note{font-size:11px;color:var(--text3);margin-bottom:20px}
.api-note a{color:var(--accent);text-decoration:none;font-weight:600}
.api-note a:hover{text-decoration:underline}

/* LOCAL WARNING */
#localWarning{padding:10px 24px;font-size:12px;background:#FFFBF0;border-bottom:2px solid var(--amber);color:#7A6600;text-align:center;font-weight:500;display:none}
#localWarning a{color:var(--accent);font-weight:700}

/* ─────────────────────────────────────────────
   📱 MOBILE RESPONSIVE — スマホ対応 (≤720px)
   タッチターゲット最小44px・横スクロール禁止・スタック化
───────────────────────────────────────────── */
@media (max-width:720px){
  body{font-size:14px}
  main{padding:18px 14px 60px}
  /* HEADER */
  header{padding:10px 14px;flex-wrap:wrap;gap:8px}
  .htitle{font-size:14px}
  .hsub{font-size:9px}
  .hright{gap:5px!important;flex-wrap:nowrap}
  .hbtn{padding:7px 10px;font-size:11px;min-height:36px;min-width:36px;border-radius:10px}
  .hbtn.icon-btn{padding:7px 8px;width:36px;justify-content:center}
  .hbtn:not(.icon-btn) svg{display:none}
  /* PROJECT HEADER & CARDS */
  .proj-header{margin-bottom:18px;gap:10px}
  .proj-header h2{font-size:19px}
  .proj-card{padding:12px 14px;gap:10px;flex-wrap:wrap;min-height:64px}
  .proj-icon{width:36px;height:36px;flex-shrink:0}
  .proj-name{font-size:13px;line-height:1.4}
  .proj-meta{font-size:10px}
  .proj-status{font-size:9px;padding:3px 8px}
  .proj-actions{margin-left:auto;gap:4px}
  .proj-btn{padding:6px 10px;font-size:10px;min-height:36px}
  .new-proj-btn{padding:16px;font-size:13px;min-height:54px}
  /* BUTTONS — タッチターゲット確保 */
  .btn{padding:14px 18px;font-size:13px;min-height:48px;width:100%}
  .btn-ghost,.btn-accent,.btn-export{padding:12px 16px;min-height:46px;font-size:13px}
  /* INPUT */
  textarea,input[type="text"],input[type="password"]{font-size:16px!important;padding:12px 14px;min-height:46px} /* 16px = iOS zoom防止 */
  textarea{min-height:96px}
  /* SCORE CARDS — 2列維持 */
  .score-grid{gap:6px}
  .score-item{padding:9px 10px}
  .score-item div:first-child{font-size:9px!important}
  /* MGR PANEL */
  .mgr-panel{padding:14px 12px}
  .mgr-hdr{padding:0 0 10px;flex-wrap:wrap;gap:6px}
  .loop-badge{font-size:9px;padding:2px 7px}
  /* PROGRESS STAGES — 縮小 */
  .prog-stages{padding:0 6px}
  .prog-dot{width:24px;height:24px;font-size:10px}
  .prog-name{font-size:9px;margin-top:2px}
  /* REPORT SECTIONS */
  .rpt-section{padding:18px 14px;margin-bottom:14px;border-radius:14px}
  .rpt-label{font-size:13px!important;letter-spacing:.12em!important;margin-bottom:12px!important}
  .rpt-label-hl{box-shadow:inset 0 -7px 0 0 var(--amber)!important}
  /* ROADMAP PHASES — 縦積み（横スクロール代わり） */
  .rpt-phase-wrap{flex-direction:column;gap:8px;overflow-x:visible}
  .rpt-phase{min-width:0;width:100%}
  /* TABLE — 横スクロール許可 + フォント縮小 */
  .comp-table,table{font-size:11px}
  /* MODAL — フルスクリーン化 */
  .modal{max-width:none;width:calc(100% - 24px);max-height:calc(100vh - 48px);overflow-y:auto;padding:18px 16px;border-radius:18px}
  .modal h3{font-size:14px;margin-bottom:14px}
  .mbtn{padding:14px 14px;min-height:62px;font-size:13px}
  /* PROCESS FLOW — 縦積み */
  .pflow-grid{grid-template-columns:1fr!important;gap:6px!important}
  .pflow-arrow{transform:rotate(90deg);justify-self:center}
  /* MONTHLY PLAN / WEEK CARDS — gap最適化 */
  .rpt-section [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important}
  /* HERO */
  .rpt-section + div[style*="hero"],div[style*="border-radius:var(--r-lg)"][style*="background:#3A3AF5"]{padding:22px 18px!important}
  /* API SCREEN */
  .api-screen{margin:32px auto;padding:0 4px}
  .api-screen h2{font-size:20px}
  .api-screen p{font-size:13px}
  /* SVG CHARTS — 全幅 */
  svg{max-width:100%!important}
  /* FOCUS BANNER */
  div[style*="REINFORCE"],div[style*="AMPLIFY"]{flex-wrap:wrap}
}

/* ─────────────────────────────────────────────
   📱 EXTRA SMALL (≤380px) — iPhone SE等
───────────────────────────────────────────── */
@media (max-width:380px){
  main{padding:14px 10px 50px}
  header{padding:8px 12px}
  .htitle{font-size:13px}
  .hbtn{padding:6px 8px;font-size:10px;min-height:34px;min-width:34px}
  .rpt-section{padding:14px 12px}
  .proj-card{padding:10px 12px}
}

/* ─────────────────────────────────────────────
   🖨 PRINT — エクスポートPDF時の整形
───────────────────────────────────────────── */
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:11pt}
  header,.hright,#localWarning,.btn,.btn-ghost,.btn-export,.btn-accent,button{display:none!important}
  main{max-width:none;padding:0;margin:0}
  .rpt-section,.mgr-panel,.rpt-phase{break-inside:avoid;page-break-inside:avoid}
  a{color:#3A3AF5;text-decoration:underline}
}

/* タッチ操作のフィードバック改善 */
@media (hover:none){
  .proj-card:hover{transform:none;box-shadow:var(--shadow-sm)}
  .proj-card:active{transform:scale(.98);background:var(--card-hover)}
  .btn:active,.hbtn:active,.proj-btn:active{transform:scale(.96)}
  button{-webkit-tap-highlight-color:transparent}
}

// ─── PROJECT STORAGE ───
function getProjects(){try{return JSON.parse(localStorage.getItem(PROJ_KEY)||"[]");}catch{return[];}}
function saveProject(proj){
  const projs=getProjects();
  const idx=projs.findIndex(p=>p.id===proj.id);
  if(idx>=0)projs[idx]=proj; else projs.unshift(proj);
  localStorage.setItem(PROJ_KEY,JSON.stringify(projs));
}
function deleteProject(id){
  const projs=getProjects().filter(p=>p.id!==id);
  localStorage.setItem(PROJ_KEY,JSON.stringify(projs));
}
function saveCurrent(){
  if(!currentProjId)return;
  const projs=getProjects();
  const proj=projs.find(p=>p.id===currentProjId)||{id:currentProjId};
  // reportImages (base64 PNG) はlocalStorageに保存しない → QuotaExceededError防止
  proj.state={...st,reportImages:null,files:st.files.map(f=>f.type==="text"?f:{...f,data:"[binary]"})};
  proj.name=st.summary?.title||(st.project?.slice(0,36))||"無題";
  proj.updatedAt=new Date().toISOString();
  // summaryが存在すれば完了済み（input画面に戻っても"done"を維持）
  proj.status=(st.step==="summary"||!!st.summary)?"done":"running";
  // 常にベストスコアで保存（ループ後半で下がっても最高点を維持）
  const _bestM=st.bestMgrState||st.mgrState;
  proj.score=_bestM?Object.values(_bestM.scores||{}).reduce((a,b)=>a+b,0):null;
  try{saveProject(proj);}catch(e){console.warn("saveCurrent: storage write failed:",e.message);}
}

// ─── RENDER ───
function S(u){
  Object.assign(st,u);
  if(!Array.isArray(st.brushupLog))st.brushupLog=[];
  if(!Array.isArray(st.files))st.files=[];
  if(!Array.isArray(st.history))st.history=[];
  if(st.step!=="projects"&&st.step!=="apikey"&&st.step!=="input")saveCurrent();
  // statusMsgだけの更新なら部分更新（フラッシュ防止）
  if(Object.keys(u).length===1&&u.statusMsg!==undefined){
    const el=document.getElementById("statusMsg");
    if(el){el.textContent=u.statusMsg;return;}
  }
  render();
}

function render(){
  const hr=document.getElementById("hright");
  hr.style.display=(st.step==="meeting"||st.step==="manager"||st.step==="summary"||st.step==="input")?"flex":"none";
  const app=document.getElementById("app");
  // スクロール位置を保持
  const scrollY=window.scrollY;
  if(st.step==="apikey")app.innerHTML=renderApiKey();
  else if(st.step==="projects")app.innerHTML=renderProjects();
  else if(st.step==="input")app.innerHTML=renderInput();
  else if(st.step==="meeting")app.innerHTML=renderMeeting();
  else if(st.step==="manager")app.innerHTML=renderManager();
  else app.innerHTML=renderSummary();
  bindEvents();
  // スクロール位置を復元（カウントダウン中の跳ね防止）
  if(st.busy&&st.statusMsg)window.scrollTo(0,scrollY);
}

    projectCount:projs.length,

}

function confirmPasteImport(){

  }
}

function importBackup(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      applyImport(data);
    }catch(err){
      alert("ファイルの解析に失敗しました。\n\nエラー: "+err.message);
    }
  };
  reader.readAsText(file);
}

function applyImport(data){
  // バリデーション
  if(!data||typeof data!=="object"||!Array.isArray(data.projects)){
    alert("無効なバックアップファイルです。\n\nStrategy Council のバックアップでない可能性があります。");
    return;
  }
  const incoming=data.projects;
  if(incoming.length===0){
    alert("インポート対象のプロジェクトがありません。");
    return;
  }
  const current=getProjects();
  // 既存とマージ：IDが重複する場合は updatedAt が新しい方を採用、重複しないものは追加
  const merged={};
  current.forEach(p=>{merged[p.id]=p;});
  let added=0,updated=0,skipped=0;
  incoming.forEach(p=>{
    if(!p.id||!p.name){skipped++;return;}
    const existing=merged[p.id];
    if(!existing){merged[p.id]=p;added++;}
    else{
      const newer=new Date(p.updatedAt||0).getTime()>new Date(existing.updatedAt||0).getTime();
      if(newer){merged[p.id]=p;updated++;}else{skipped++;}
    }
  });
  const result=Object.values(merged);
  // 確認ダイアログ
  const msg=`【インポート確認】\n\n📥 取り込み元: ${incoming.length}件（${data.sourceDevice||"unknown"}・${data.exportedAt?new Date(data.exportedAt).toLocaleString("ja-JP"):"日時不明"}）\n\n✓ 新規追加: ${added}件\n↻ 更新（より新しい）: ${updated}件\n⊘ スキップ（変更なし or 古い）: ${skipped}件\n\nこのデバイスは合計 ${result.length} 件のプロジェクトになります。\n\n実行しますか？`;
  if(!confirm(msg))return;
  try{
    localStorage.setItem(PROJ_KEY,JSON.stringify(result));
    alert(`✓ インポート完了\n\n新規 ${added} 件 / 更新 ${updated} 件 / スキップ ${skipped} 件`);
    closeExport();
    S({step:"projects"});
  }catch(e){
    if(e.name==="QuotaExceededError"){
      alert("ストレージ容量が不足しています。\n\n不要なプロジェクトを削除してから再度インポートしてください。");
    } else {
      alert("保存に失敗しました：" + e.message);
    }
  }
}
function openProject(id){
  const projs=getProjects();
  const proj=projs.find(p=>p.id===id);
  if(!proj){alert("プロジェクトが見つかりません");return;}
  currentProjId=id;
  // ── プロジェクト間データ漏洩防止：常に完全な初期stateから始める ──
  // （Object.assign を使うと前のプロジェクトの facts / mgrState / summary 等が残留してしまう）
  const fresh={
    step:"input",project:"",files:[],facts:"",phaseIdx:0,questions:null,ctx:"",answers:{},
    loading:null,history:[],mgrState:null,bestMgrState:null,mgrHistory:[],mgrNotes:[],
    loopCount:0,summary:null,reportDiagram:null,reportImages:null,concreteSteps:null,
    error:"",busy:false,statusMsg:"",brushupProgress:null,brushupLog:[],focusPlan:null,
    needsReattach:null,extraMode:false,extraUsed:false,extraQuestions:[],extraAnswers:{},
    phaseAccOpen:{},phaseResearch:null,brandResearch:null,isLocalBusiness:false,businessType:""
  };
  if(proj.state&&proj.state.step){
    // 保存stateを fresh の上にマージ（fresh に無いキーは無視されるため、許可されたフィールドのみ復元）
    st=Object.assign({},fresh,proj.state);
    st.busy=false;st.loading=null;st.error="";
    if(!Array.isArray(st.brushupLog))st.brushupLog=[];
    if(!Array.isArray(st.files))st.files=[];
    if(!Array.isArray(st.history))st.history=[];
    if(!st.step||st.step==="projects")st.step="input";
  } else {
    // stateがない場合は完全に新規プロジェクトとして開く（前プロジェクトの記憶ゼロ）
    st=fresh;
    st.project=proj.name||"";
  }
  render();
}

async function resumeFromSave(){
  cancelled=false;
  if(!apiKey||!apiKey.startsWith("sk-")){
    S({error:"APIキーが見つかりません。ページを再読み込みしてください。"});
    return;
  }
  // バイナリファイルが[binary]になっている場合は除去
  const binaryFiles=st.files.filter(f=>f.data==="[binary]");
  if(binaryFiles.length>0){
    st.files=st.files.filter(f=>f.data!=="[binary]");
    S({needsReattach:binaryFiles.map(f=>f.name)});
  }
  const h=st.history||[];
  const phasesDone=h.length;
  // ── ベストスコアが既に95点以上 → 解像度向上 → 最終レポート生成から再開 ──
  const bestTotal=Object.values((st.bestMgrState||st.mgrState)?.scores||{}).reduce((a,b)=>a+b,0);
  if((st.step==="manager"||st.step==="summary")&&bestTotal>=95&&!st.summary){
    S({busy:true,statusMsg:"承認済み戦略から再開中...",error:""});
    if(!st.concreteSteps){
      await concretizeStrategy(h,st.bestMgrState||st.mgrState);
    }
    await generateFinalAuto(h,st.bestMgrState||st.mgrState);
    return;
  }
  // ── summary画面だが summary が無い → レポート生成中に離脱 → 再生成 ──
  if(st.step==="summary"&&!st.summary&&st.mgrState){
    S({busy:true,statusMsg:"最終レポート生成を再開中...",error:""});
    if(!st.concreteSteps){
      await concretizeStrategy(h,st.bestMgrState||st.mgrState);
    }
    await generateFinalAuto(h,st.bestMgrState||st.mgrState);
    return;
  }
  if(st.step==="manager"){
    S({busy:true,statusMsg:"マネージャー審査を再開中...",error:""});
    const histText=buildHistText(h);
    const loopCount=st.loopCount||0;
    // 中断時にbrushupLogの最終ラウンドが未完了なら除去（agent.thinking状態を破棄）
    if(Array.isArray(st.brushupLog)&&st.brushupLog.length>0){
      const last=st.brushupLog[st.brushupLog.length-1];
      const anyThinking=Object.values(last.agents||{}).some(e=>e&&e.status==="thinking");
      if(anyThinking){
        st.brushupLog=st.brushupLog.slice(0,-1);
      }
    }
    if(st.mgrState&&loopCount>0){
      // スコアが出ている状態 → ブラッシュアップから再開（蓄積コンテキスト保持）
      await brushupAuto(histText,st.mgrState,loopCount+1,h);
    } else {
      // 初回評価 or mgrStateなし → 最初から評価
      await runManagerAuto(histText,st.mgrState?.revisedStrategy||"",loopCount,h);
    }
  } else if(phasesDone<PHASE_JA.length){
    // フェーズ途中 → 現在のフェーズから再開（st.phaseIdxを使用）
    const nextPhase=st.phaseIdx||phasesDone;
    S({busy:true,statusMsg:`Phase ${nextPhase+1}から再開中...`,answers:{},questions:null,error:""});
    await runPhase(nextPhase,h);
  } else {
    S({error:"再開できる状態ではありません。新規プロジェクトを作成してください。"});
  }
}

function renderManager(){
  // 全体フロー（会議フェーズと共通）— Manager審査(index=4)がactive
  const _progDots=["課題定義","市場分析","戦略立案","実行計画","Manager審査"].map((name,i)=>{
    const cls=i<4?"done":i===4?"active":"";
    return`<div class="prog-stage ${cls}"><div class="prog-dot">${i<4?"✓":i+1}</div><div class="prog-name">${name}</div></div>`;
  }).join("");
  const _progWrap=`<div class="prog-wrap"><div class="prog-stages">${_progDots}</div></div>`;

  // First time (no mgrState yet): show spinner
  if(!st.mgrState&&!st.busy)return`<div>${_progWrap}<div style="text-align:center;padding:32px 0">
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">マネージャー審査が一時停止しています</div>
    <button class="btn btn-accent" style="max-width:240px" onclick="retryFromError()">▶ 続きから再開する</button>
  </div></div>`;
  const _maxLoops=st.extraUsed?40:30;
  if(!st.mgrState)return`<div>${_progWrap}<div class="spinner">マネージャーが仮想空間でシミュレーション中...<br><span style="font-size:11px;display:block;margin-top:6px">ループ ${st.loopCount}/${_maxLoops}</span></div></div>`;
  const m=st.mgrState;if(!m)return`<div class="spinner">読み込み中...</div>`;
  const total=Object.values(m.scores||{}).reduce((a,b)=>a+b,0);
  const bestM=st.bestMgrState||m;
  const bestScores=bestM.scores||{};
  const bestTotal=Object.values(bestScores).reduce((a,b)=>a+b,0);
  const approved=bestTotal>=95||total>=95;
  // 表示はベストスコアを主役にする。今ラウンドのスコアは"差分"として副次表示
  const scoreCards=SCORE_ITEMS.map(k=>{
    const bestV=Math.min(20,Math.max(0,parseInt(bestScores[k])||0));
    const curV=Math.min(20,Math.max(0,parseInt(m.scores?.[k])||0));
    const delta=curV-bestV;
    const pct=bestV/20*100;
    const barColor=bestV>=16?"var(--accent)":bestV>=10?"var(--blue2)":"var(--border2)";
    const numColor=bestV>=16?"var(--accent)":bestV>=10?"var(--text)":"var(--text3)";
    const deltaColor=delta>0?"var(--accent)":delta<0?"#8E97C0":"transparent";
    const deltaTxt=delta>0?`▲+${delta}`:delta<0?`▼${delta}`:"–";
    return`<div class="score-item" style="background:var(--bg3);border-color:var(--border);position:relative">
      <div style="font-size:10px;font-weight:700;color:var(--text3);margin-bottom:7px;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center">
        <span>${k}</span>
        <span style="font-size:9px;font-weight:700;color:${deltaColor}" title="本ラウンド差分">${st.bestMgrState&&st.bestMgrState!==m?deltaTxt:""}</span>
      </div>
      <div style="height:4px;background:var(--border);border-radius:3px;margin-bottom:7px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${barColor};border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)"></div>
      </div>
      <div style="font-size:17px;font-weight:800;color:${numColor}">${bestV}<span style="font-size:10px;color:var(--text3);font-weight:400">/20</span></div>
    </div>`;
  }).join("");
  const maxLoops=st.extraUsed?40:30;
  const canResume=!st.busy&&!approved&&st.loopCount<40&&!(st.loopCount>=30&&!st.extraMode&&!st.extraUsed);
  const mgrStatusIndicator=st.busy
    ?`<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);font-weight:600;margin-left:auto"><span style="width:6px;height:6px;border-radius:50%;background:var(--accent);animation:glow 1.2s infinite;flex-shrink:0"></span>実行中</span>`
    :canResume
      ?`<button onclick="retryFromError()" style="margin-left:auto;padding:4px 12px;border-radius:var(--r-sm);border:1.5px solid var(--accent);background:var(--accent-light);color:var(--accent);font-size:11px;font-family:inherit;cursor:pointer;font-weight:700">▶ 再開</button>`
      :"";
  const statusMsg=approved?`<div style="font-size:12px;color:var(--accent);padding:6px 0;animation:blink 1.5s infinite">✓ Approved — 解像度向上 → 最終レポート生成中...</div>`
    :st.loopCount>=40?`<div class="err" style="background:#FEF0EF;color:#c0392b">最大回数（40回）に到達しました。最高スコア案でレポートを生成します。</div>`
    :st.loopCount>=30&&!st.extraMode&&!st.extraUsed&&!st.busy?`<div style="border:1.5px solid #2195ca;border-radius:12px;padding:18px;margin-top:12px;background:#EBF6FF">
        <div style="font-size:13px;font-weight:700;color:#2195ca;margin-bottom:6px">追加ブラッシュアップで精度を上げる</div>
        <div style="font-size:12px;color:#4A5E72;margin-bottom:12px">エージェントがいくつか質問します。回答することでより具体的な分析が可能になります（さらに最大10回）</div>
        <button class="btn btn-accent" style="max-width:240px;margin:0" onclick="startExtraMode()">さらに10回ブラッシュアップする</button>
      </div>`
    :`<div style="font-size:12px;color:var(--text3);padding:6px 0;animation:blink 1.5s infinite">ブラッシュアップ中... (${st.loopCount}/${maxLoops})</div>`;
  return`<div class="fade">${_progWrap}
    <div class="mgr-panel">
      <div class="mgr-hdr">
        ${ICONS.manager}
        <span style="font-size:12px;font-weight:700;letter-spacing:.04em">マネージャー審査</span>
        <span class="loop-badge">ループ ${st.loopCount}/${maxLoops}</span>
        ${approved?`<span style="margin-left:auto;font-size:10px;font-weight:700;color:var(--accent)">✓ 承認済み</span>`:mgrStatusIndicator}
      </div>
      <div class="mgr-body">
        ${m.env?`<div class="env-badge" style="display:inline-flex;align-items:center;gap:5px">${ICONS.globe} ${m.env}</div>`:""}
        <div class="score-grid">${scoreCards}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:12px;margin-bottom:${st.focusPlan?"10px":"14px"};border:1.5px solid var(--border2);background:var(--bg3);gap:14px;flex-wrap:wrap">
          <div style="display:flex;align-items:baseline;gap:18px;flex-wrap:wrap">
            <div>
              <div style="font-size:10px;color:var(--text3);margin-bottom:4px;letter-spacing:.1em;font-weight:700">BEST SCORE</div>
              <div style="font-size:32px;font-weight:800;color:${approved?"var(--accent)":bestTotal>=80?"var(--blue2)":"var(--text)"};line-height:1">${bestTotal}<span style="font-size:14px;font-weight:400;color:var(--text3)">/100</span></div>
              <div style="font-size:9px;color:var(--text3);margin-top:4px;letter-spacing:.08em">目標 95/100 まであと <span style="color:${approved?"var(--accent)":"var(--purple)"};font-weight:800">${Math.max(0,95-bestTotal)}</span> 点</div>
            </div>
            ${st.bestMgrState&&st.bestMgrState!==m?`<div style="border-left:1.5px dashed var(--border2);padding-left:18px">
              <div style="font-size:9px;color:var(--text3);margin-bottom:3px;letter-spacing:.1em;font-weight:700">今ラウンド評価</div>
              <div style="font-size:18px;font-weight:700;color:${total>=bestTotal?"var(--accent)":"#8E97C0"};line-height:1">${total}<span style="font-size:10px;color:var(--text3);font-weight:400;margin-left:2px">/100</span></div>
              <div style="font-size:10px;color:${total>bestTotal?"var(--accent)":total<bestTotal?"#8E97C0":"var(--text3)"};font-weight:700;margin-top:3px">${total>bestTotal?`▲ +${total-bestTotal} ベスト更新！`:total<bestTotal?`▼ ${total-bestTotal}（ベスト維持）`:"= 同点"}</div>
            </div>`:""}
          </div>
          <div style="font-size:12px;font-weight:700;color:${approved?"var(--accent)":"var(--text2)"};padding:7px 16px;border-radius:100px;background:var(--bg2);border:1.5px solid var(--border2)">${approved?"■ 承認済み":bestTotal>=70?"▶ 改善中":"○ 要改善"}</div>
        </div>
        ${st.focusPlan&&!approved?`<div style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:10px;margin-bottom:14px;background:linear-gradient(90deg,${st.focusPlan.mode==="amplify"?"#F0ECFF":"#EEEEFF"},var(--bg2));border:1.5px solid ${st.focusPlan.mode==="amplify"?"rgba(123,92,240,.3)":"rgba(58,58,245,.3)"}">
          <div style="font-size:9px;letter-spacing:.12em;font-weight:800;color:${st.focusPlan.mode==="amplify"?"var(--purple)":"var(--accent)"};padding:3px 9px;border-radius:100px;background:var(--bg2);border:1px solid ${st.focusPlan.mode==="amplify"?"rgba(123,92,240,.3)":"rgba(58,58,245,.3)"};flex-shrink:0">${st.focusPlan.mode==="amplify"?"AMPLIFY ↑":"REINFORCE ⇡"}</div>
          <div style="font-size:11.5px;color:var(--text);line-height:1.5;flex:1"><span style="font-weight:800;color:${st.focusPlan.mode==="amplify"?"var(--purple)":"var(--accent)"}">${st.focusPlan.focusItem}</span>（${st.focusPlan.bestV}/20）を${st.focusPlan.mode==="amplify"?"<strong>さらに伸ばす</strong>":"<strong>補強する</strong>"}焦点で次ラウンド進行中</div>
        </div>`:""}
        ${m.verdict?`<div class="mgr-verdict">${m.verdict}</div>`:""}
        ${m.feedback&&!approved?`<div style="font-size:12px;color:var(--text2);background:var(--accent-light);padding:10px 14px;border-radius:var(--r-sm);line-height:1.8;border-left:3px solid var(--accent);margin-bottom:12px">${m.feedback}</div>`:""}
        ${st.busy && !st.brushupProgress?.active ? `<div style="font-size:12px;color:var(--text3);padding:6px 0;animation:blink 1.5s infinite">${st.statusMsg||"マネージャーが審査中..."}</div>` : statusMsg}
        ${(()=>{return (st.brushupLog&&Array.isArray(st.brushupLog)&&st.brushupLog.length>0)?renderBrushupProgress():"";})()}
      </div>
    </div>
    ${(st.extraMode&&st.extraQuestions&&st.extraQuestions.length>0)?renderExtraQuestions():""}
    ${st.error?`<div class="err">${st.error}<br><button class="retry-btn" onclick="retryBrushup()">リトライ</button></div>`:""}
  </div>`;
}

function renderBrushupProgress(){
  if(!st.brushupLog||!Array.isArray(st.brushupLog)||st.brushupLog.length===0)return"";
  const rounds=st.brushupLog.map(function(round,ri){
    const isLast=ri===st.brushupLog.length-1;
    const allDone=Object.values(round.agents||{}).every(function(e){return e&&e.status==="done";});
    // 最新ラウンドのみハイライト、過去ラウンドは彩度を落とした淡いブルーグレーで統一
    const isCurrent=isLast;
    // ブランドトーン：current.done=パープル / current.thinking=プライマリブルー / past=低彩度グレーブルー
    const hc=isCurrent?(allDone?"#7B5CF0":"#3A3AF5"):"#8E97C0";
    const hbg=isCurrent?(allDone?"#F0ECFF":"#EEEEFF"):"#F4F6FB";
    const hBorder=isCurrent?(allDone?"rgba(123,92,240,.25)":"rgba(58,58,245,.25)"):"#E2E6F0";
    const fb=(round.feedback||"品質改善中").slice(0,40);
    const cards=Object.keys(AGENTS).map(function(id){
      const entry=round.agents[id];if(!entry)return"";
      const done=entry.status==="done";const thinking=entry.status==="thinking";
      // 過去ラウンドは done でもグレーに（情報過多を抑える）
      const dc=isCurrent?(done?"#7B5CF0":thinking?"#3A3AF5":"#8E97C0"):"#8E97C0";
      const cbg=isCurrent?(done?"#F0ECFF":thinking?"#EEEEFF":"#F8FAFB"):"#F8FAFB";
      const cb=isCurrent?(done?"rgba(123,92,240,.25)":thinking?"rgba(58,58,245,.25)":"#E2E6F0"):"#E2E6F0";
      const nameColor=isCurrent?"#0F1128":"#4A5280";
      const ansColor=isCurrent?"#4A5280":"#8E97C0";
      return'<div style="border:1px solid '+cb+';border-radius:8px;padding:10px 12px;margin-bottom:6px;background:'+cbg+'">'+
        '<div style="display:flex;align-items:center;gap:7px;margin-bottom:'+(done&&entry.ans?"6px":"0")+'">'+
        '<span style="color:'+dc+';display:flex">'+(ICONS[AGENTS[id].icon]||"")+'</span>'+
        '<span style="font-size:11px;font-weight:700;color:'+nameColor+'">'+AGENTS[id].name+'</span>'+
        '<span style="margin-left:auto;font-size:10px;color:'+dc+';font-weight:600">'+(done?"✓ 完了":thinking?"改善中...":"待機")+'</span>'+
        '</div>'+
        (thinking?'<div style="display:flex;gap:4px;padding:4px 0"><div class="dot b1" style="background:#3A3AF5"></div><div class="dot b2" style="background:#3A3AF5"></div><div class="dot b3" style="background:#3A3AF5"></div></div>':"")+
        (done&&entry.ans?'<div style="font-size:12px;color:'+ansColor+';line-height:1.75">'+entry.ans+'</div>':"")+
      '</div>';
    }).join("");
    const chev='style="color:#8E97C0;transition:transform .2s;transform:'+(isLast?"rotate(180deg)":"rotate(0)")+'"';
    return'<div style="border:1.5px solid '+hBorder+';border-radius:12px;overflow:hidden;margin-bottom:8px;opacity:'+(isCurrent?"1":"0.78")+'">'+
      '<div onclick="toggleRound('+round.round+')" style="display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:'+hbg+';user-select:none">'+
      '<span style="width:22px;height:22px;border-radius:50%;background:'+hc+';color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+round.round+'</span>'+
      '<span style="font-size:11px;font-weight:700;color:'+hc+'">Round '+round.round+'</span>'+
      (round.focus?'<span style="font-size:9px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:100px;background:'+(round.focus.mode==="amplify"?"#F0ECFF":"#EEEEFF")+';color:'+(round.focus.mode==="amplify"?"#7B5CF0":"#3A3AF5")+';white-space:nowrap;flex-shrink:0">'+(round.focus.mode==="amplify"?"↑ ":"⇡ ")+round.focus.focusItem+'</span>':"")+
      '<span style="font-size:11px;color:#8AA0B0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+fb+'</span>'+
      '<span style="font-size:10px;color:'+hc+';font-weight:600">'+(allDone?"完了":"進行中")+'</span>'+
      '<svg id="round-chevron-'+round.round+'" '+chev+' width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>'+
      '</div>'+
      '<div id="round-body-'+round.round+'" style="display:'+(isLast?"block":"none")+';padding:12px;background:#fff;border-top:1px solid #E4EAF0">'+cards+'</div>'+
    '</div>';
  }).join("");
  return'<div style="margin-top:16px;border-top:1px solid #E4EAF0;padding-top:16px">'+rounds+'</div>';
}

function renderFlowDiagram(diagram){
  if(!diagram||!diagram.nodes||!diagram.nodes.length)return"";
  const bc={source:"var(--accent)",hub:"#0F1128",action:"var(--bg2)",result:"var(--purple)"};
  const tc={source:"#fff",hub:"#fff",action:"var(--text)",result:"#fff"};
  const bd={source:"none",hub:"none",action:"1.5px solid var(--border)",result:"none"};
  const nodes=diagram.nodes.slice(0,7);
  const html=nodes.map((n,i)=>{
    const arrow=i<nodes.length-1?`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" style="flex-shrink:0"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`:"";
    return`<div style="display:flex;align-items:center;gap:6px"><div class="flow-node ${n.type||''}" style="background:${bc[n.type]||bc.action};color:${tc[n.type]||tc.action};border:${bd[n.type]||bd.action}">${n.label}</div>${arrow}</div>`;
  }).join("");
  return`<div class="rpt-section">
    <div class="rpt-label">${diagram.headline||"Strategy Flow"}</div>
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;overflow-x:auto;padding-bottom:2px">${html}</div>
  </div>`;
}
function renderSummary(){
  // summary未生成（生成中・離脱からの再開含む）→ 進捗表示
  if(!st.summary){
    return`<div class="fade" style="padding:48px 24px;text-align:center">
      <div class="spinner" style="margin-bottom:14px">${st.busy?(st.statusMsg||"最終レポートを生成中..."):"レポート生成が中断されています"}</div>
      ${!st.busy?`<button class="btn btn-accent" style="margin-top:14px" onclick="resumeFromSave()">レポート生成を再開する</button>`:""}
      <button class="btn btn-ghost" style="margin-top:8px" onclick="goProjects()">← プロジェクト一覧へ</button>
    </div>`;
  }
  const s=st.summary||{};
  const m=st.bestMgrState||st.mgrState;
  const total=Object.values(m?.scores||{}).reduce((a,b)=>a+b,0);
  // ブルー基調 + 必要時のみパープル。黄色は使用禁止（差し色＝ラベル下線のみ）
  const phaseAccentColors=["var(--accent)","#5B8DEF","var(--purple)","var(--blue3)"];
  // Phase Roadmap
  const phasesHtml=(s.phases||[]).map((p,i)=>{
    const col=phaseAccentColors[i]||"var(--accent)";
    const acts=(p.actions||[]).map(a=>`<div style="font-size:11px;color:var(--text2);padding:4px 0;border-bottom:1px solid var(--border);line-height:1.5;display:flex;gap:5px"><span style="color:${col};flex-shrink:0">•</span>${a}</div>`).join("");
    return`<div class="rpt-phase" style="border-top-color:${col}">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <div class="rpt-phase-num" style="background:${col}">${p.phase||i+1}</div>
        <div><div style="font-size:11px;font-weight:800;color:var(--text)">${p.name||""}</div><div style="font-size:9px;color:var(--text3)">${p.period||""}</div></div>
      </div>
      <div style="font-size:11px;font-weight:600;color:${col};margin-bottom:8px;line-height:1.4">${p.goal||""}</div>
      ${acts}
    </div>`;
  }).join(`<div style="display:flex;align-items:center;color:var(--accent);font-size:18px;flex-shrink:0;align-self:center;padding:0 2px">→</div>`);
  // KPIs
  const kpisHtml=(s.kpi||[]).map((k,i)=>`<div style="background:var(--bg3);border-radius:10px;padding:11px 14px;border-left:3px solid ${phaseAccentColors[i]||"var(--accent)"}"><div style="font-size:12px;font-weight:600;color:var(--text);line-height:1.5">${k}</div></div>`).join("");
  // Monthly Plan — 月次の具体TODOとマイルストーン（モチベ重視の未来像）
  const monthColors=["var(--accent)","#4A5EE8","#5B8DEF","var(--blue3)","#9B7CF5","var(--purple)"];
  const monthlyHtml=(s.monthlyPlan||[]).map((mo,i)=>{
    const col=monthColors[i%monthColors.length];
    const todos=(mo.todos||[]).map(t=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:12px;color:var(--text2);line-height:1.6"><span style="color:${col};font-weight:800;flex-shrink:0;margin-top:1px">▸</span><span>${t}</span></div>`).join("");
    return`<div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:18px 18px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)">
      <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${col}"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-left:6px">
        <div style="width:36px;height:36px;border-radius:10px;background:${col};color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1;flex-shrink:0;box-shadow:0 2px 8px ${col}55"><div style="font-size:8px;letter-spacing:.05em;opacity:.85">MONTH</div><div style="font-size:14px;margin-top:1px">${mo.month||i+1}</div></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:9px;color:var(--text3);letter-spacing:.12em;font-weight:700;text-transform:uppercase;margin-bottom:2px">THEME</div>
          <div style="font-size:14px;font-weight:700;color:var(--text);line-height:1.3">${mo.theme||""}</div>
        </div>
      </div>
      ${todos?`<div style="padding-left:6px;margin-bottom:12px;border-top:1px dashed var(--border);padding-top:10px">${todos}</div>`:""}
      ${mo.milestone?`<div style="margin-left:6px;background:${col}14;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg><div><div style="font-size:9px;color:${col};letter-spacing:.1em;font-weight:800;text-transform:uppercase;margin-bottom:2px">${mo.month||i+1}ヶ月後の到達状態</div><div style="font-size:12px;font-weight:600;color:var(--text);line-height:1.55">${mo.milestone}</div></div></div>`:""}
      ${mo.motivation?`<div style="margin:8px 0 0 6px;font-size:11px;color:var(--text3);font-style:italic;line-height:1.55;display:flex;gap:6px"><span style="color:${col};flex-shrink:0">✦</span><span>${mo.motivation}</span></div>`:""}
    </div>`;
  }).join(`<div style="display:flex;justify-content:center;padding:6px 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C8CEEA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div>`);

  // ── 解像度向上ステップから派生する詳細セクション ──
  const cs=st.concreteSteps||{};

  // Week1-4 詳細タスク表
  const weeksHtml=(cs.week1to4||[]).map((w,i)=>{
    const col=["#3A3AF5","#4A5EE8","#5B8DEF","#7B5CF0"][i%4];
    const tasks=(w.tasks||[]).map(t=>`<div style="display:flex;gap:8px;padding:6px 0;font-size:12px;color:var(--text2);line-height:1.55"><span style="color:${col};font-weight:800;flex-shrink:0">●</span><span>${t}</span></div>`).join("");
    return`<div style="background:var(--bg2);border:1.5px solid var(--border);border-left:4px solid ${col};border-radius:var(--r-md);padding:14px 16px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <div style="background:${col};color:#fff;font-size:10px;font-weight:800;padding:3px 10px;border-radius:100px;letter-spacing:.06em">WEEK ${w.week||i+1}</div>
        <div style="font-size:13px;font-weight:700;color:var(--text)">${w.focus||""}</div>
      </div>
      <div style="border-top:1px dashed var(--border);padding-top:8px;margin-bottom:8px">${tasks}</div>
      ${w.deliverable?`<div style="background:${col}14;border-radius:8px;padding:8px 12px;display:flex;gap:8px;align-items:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg><div style="font-size:11px;color:var(--text);line-height:1.5"><span style="color:${col};font-weight:800;font-size:9px;letter-spacing:.1em;margin-right:6px">DELIVERABLE</span>${w.deliverable}</div></div>`:""}
    </div>`;
  }).join("");

  // KPI Playbook（現状→ギャップ→ドライバー）+ SVGバー
  const kpiPlaybookHtml=(cs.kpiPlaybook||[]).map((k,i)=>{
    const col=["#3A3AF5","#5B8DEF","#7B5CF0","var(--blue3)"][i%4];
    // 数値抽出（パーセンテージ計算は雑だが、視覚的進捗バーとして使う）
    const curNum=parseFloat((k.current||"0").replace(/[^0-9.]/g,""))||0;
    const tgtNum=parseFloat((k.target||"0").replace(/[^0-9.]/g,""))||1;
    const pct=Math.min(100,Math.max(0,tgtNum>0?(curNum/tgtNum)*100:0));
    return`<div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:16px 18px;margin-bottom:10px;box-shadow:var(--shadow-sm)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px;flex-wrap:wrap">
        <div style="font-size:14px;font-weight:800;color:var(--text)">${k.kpi||""}</div>
        <div style="font-size:11px;color:var(--text3);font-weight:600">${k.current||"-"} <span style="color:${col};margin:0 5px">→</span> <span style="color:${col};font-weight:800">${k.target||"-"}</span></div>
      </div>

    const H=kpis.length*(BARH+GAP)+20;
    const bars=kpis.map((kStr,i)=>{
      // パース：「指標:現状→目標・期限」形式から数値2つ抽出
      const nums=(kStr.match(/[\d,]+(?:\.\d+)?/g)||[]).map(n=>parseFloat(n.replace(/,/g,"")));
      const cur=nums[0]||0;
      const tgt=nums[1]||(cur*2)||1;
      const pct=Math.min(100,Math.max(5,tgt>0?(cur/tgt)*100:0));
      const col=["#3A3AF5","#5B8DEF","#7B5CF0","#8BA8F0"][i%4];
      const label=kStr.split(":")[0]||"KPI";
      const y=15+i*(BARH+GAP);
      return`<g><text x="0" y="${y+BARH/2+4}" font-size="11" fill="#4A5280" font-weight="600">${label.slice(0,16)}</text>
        <rect x="${LEFT}" y="${y}" width="${W-LEFT-RIGHT}" height="${BARH}" fill="#F0F2FF" rx="4"/>
        <rect x="${LEFT}" y="${y}" width="${(W-LEFT-RIGHT)*pct/100}" height="${BARH}" fill="${col}" rx="4"/>
        <text x="${W-RIGHT-6}" y="${y+BARH/2+4}" font-size="10" fill="#fff" font-weight="700" text-anchor="end">${cur.toLocaleString()}→${tgt.toLocaleString()}</text></g>`;
    }).join("");

  function buildMilestoneChart(){

    const maxV=Math.max(...values,1);
    const stepX=(W-PAD*2)/(values.length-1);
    const points=values.map((v,i)=>{const x=PAD+i*stepX;const y=H-PAD-((v/maxV)*(H-PAD*2));return{x,y,v};});
    const path=points.map((p,i)=>(i===0?"M":"L")+p.x+","+p.y).join(" ");

  st.busy=false;
  st.error="";

function goEdit(){
  // 進行中の内容を保持したままinput画面へ
  cancelled=true;
  try{saveCurrent();}catch(e){console.warn("goEdit save failed:",e.message);}
  setTimeout(()=>{
    cancelled=false;
    // stepだけinputに戻す（project/facts/filesは保持）
    st.step="input";
    st.busy=false;
    st.loading=null;
    st.error="";
    render();
  },150);
}

function goProjects(){
  cancelled=true;
  try{saveCurrent();}catch(e){console.warn("goProjects save failed:",e.message);}
  cancelled=false;
  S({step:"projects"});
}

function buildReport(){
  const s=st.summary||{};const m=st.mgrState;
  const total=Object.values(m?.scores||{}).reduce((a,b)=>a+b,0);
  let t=`STRATEGY COUNCIL — Final Report\n${"═".repeat(50)}\n\n`;
  t+=`Project: ${st.project}\nGenerated: ${new Date().toLocaleString("ja-JP")}\n\n`;
  t+=`${"─".repeat(40)}\nMEETING LOG\n\n`;
  st.history.forEach((r,i)=>{t+=`■ Phase ${i+1}: ${PHASE_JA[i]}\n`;Object.entries(r.answers).forEach(([id,a])=>{t+=`\n[${AGENTS[id].name}]\n${a}\n`;});t+="\n";});
  t+=`${"─".repeat(40)}\nマネージャー審査\n`;
  t+=`Space: ${m?.env||"—"}\nScore: ${total}/100\n`;
  if(m?.scores)Object.entries(m.scores).forEach(([k,v])=>{t+=`  ${k}: ${v}/20\n`;});
  t+=`\n${"─".repeat(40)}\nFINAL STRATEGY\n\n`;
  t+=`Title: ${s.title||""}\n\nKey Insight:\n${s.keyInsight||""}\n\nStrategy:\n${s.strategy||""}\n\nアクションプラン:\n${(s.actions||[]).map((a,i)=>`${i+1}. ${a}`).join("\n")}\n\nKPI:\n${(s.kpi||[]).map(k=>`◆ ${k}`).join("\n")}\n\nNext Action:\n${s.nextStep||""}\n`;
  return t;
}

// アプリ側の renderSummary() の HTML をそのまま使用し、ページCSSと一緒に印刷ウィンドウへ
function exportPDF(){
  if(!st.summary){alert("最終レポートが生成されていません");return;}
  // 1. アプリの<style>タグを全て収集（renderSummaryと完全一致のCSS）
  const styleEls=document.querySelectorAll("style");
  const inlineCss=Array.from(styleEls).map(s=>s.textContent).join("\n");
  // 2. summary画面のHTMLを取得（renderSummaryを直接呼び出して常に最新を取得）
  // → アプリ上の表示と完全一致
  const summaryHtml=renderSummary();
  // 3. 印刷用追加スタイル：A4印刷時の調整
  const printCss=`
    @media print{
      @page{margin:14mm;size:A4}
      body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .rpt-section,.mgr-panel{break-inside:avoid;page-break-inside:avoid}
      button,.hbtn,.btn-export,.btn-ghost,.btn-accent{display:none!important}
    }
    body{background:#F8FAFB;padding:24px 16px;max-width:820px;margin:0 auto}
    /* 不要なボタン群を非表示 */
    button{display:none!important}
    /* リンクのアンダーラインを目立たせる */
    a[href]{text-decoration:underline}
  `;
  // 4. 印刷ウィンドウへ書き出し
  const pdfHTML=`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>${(st.summary.title||"Strategy Report").replace(/[<>"]/g,"")}</title>
    <style>${inlineCss}\n${printCss}</style>
    </head><body>${summaryHtml}
    <script>window.onload=function(){setTimeout(function(){window.print();},800);}<\/script>
    </body></html>`;
  const w=window.open("","_blank");
  if(w){w.document.write(pdfHTML);w.document.close();}
  closeExport();
}

// ── Markdown Export：レポート全項目を構造化マークダウンへ ──
function exportMD(){
  const s=st.summary||{};
  const m=st.bestMgrState||st.mgrState;
  const cs=st.concreteSteps||{};
  const total=Object.values(m?.scores||{}).reduce((a,b)=>a+b,0);
  const date=new Date().toLocaleString("ja-JP");
  let md=`# ${s.title||"Strategy Report"}\n\n`;
  if(s.tagline)md+=`> ${s.tagline}\n\n`;
  md+=`**Project:** ${st.project||""}  \n**Generated:** ${date}  \n**Score:** ✓ ${total}/100\n\n`;
  if(s.positioning)md+=`**Positioning:** ${s.positioning}\n\n`;
  md+=`---\n\n`;
  // Why This Proposal
  if(s.whyThisStrategy){
    md+=`## 💡 Why This Proposal? — なぜこの提案か\n\n${s.whyThisStrategy}\n\n`;
    if(s.background){
      if(s.background.situation)md+=`- **SITUATION（現状）:** ${s.background.situation}\n`;
      if(s.background.problem)md+=`- **PROBLEM（課題）:** ${s.background.problem}\n`;
      if(s.background.opportunity)md+=`- **OPPORTUNITY（機会）:** ${s.background.opportunity}\n`;
      md+=`\n`;
    }
  }
  // Analysis Journey
  if(s.analysisJourney&&s.analysisJourney.length){
    md+=`## 🧭 Analysis Journey — 分析の軌跡\n\n`;
    s.analysisJourney.forEach((j,i)=>{md+=`### Phase ${j.phase||i+1}: ${j.name||""}\n\n${j.finding||""}\n\n`;});
  }
  // Key Insight
  md+=`## 🎯 Key Insight\n\n**${s.keyInsight||""}**\n\n`;
  if(s.challenge)md+=`> **CHALLENGE:** ${s.challenge}\n\n`;
  // Persona
  if(s.persona)md+=`## 👤 Target Persona\n\n${s.persona}\n\n`;
  // Integrated Strategy
  md+=`## 📋 Integrated Strategy\n\n${s.strategy||""}\n\n`;
  // Current Gap
  if(cs.currentGap||cs.unlockHypothesis){
    md+=`## 🔍 Current Gap — 現状とゴールの差分\n\n`;
    if(cs.currentGap)md+=`${cs.currentGap}\n\n`;
    if(cs.unlockHypothesis)md+=`> **UNLOCK HYPOTHESIS:** ${cs.unlockHypothesis}\n\n`;
  }
  // First 4 Weeks
  if(cs.week1to4&&cs.week1to4.length){
    md+=`## 🗓 First 4 Weeks — 立ち上げ4週\n\n`;
    cs.week1to4.forEach((w,i)=>{
      md+=`### Week ${w.week||i+1} — ${w.focus||""}\n\n`;
      (w.tasks||[]).forEach(t=>{md+=`- [ ] ${t}\n`;});
      if(w.deliverable)md+=`\n**Deliverable:** ${w.deliverable}\n\n`;
      else md+=`\n`;
    });
  }
  // Strategy Roadmap
  if(s.phases&&s.phases.length){
    md+=`## 🛤 Strategy Roadmap\n\n`;
    s.phases.forEach((p,i)=>{
      md+=`### Phase ${p.phase||i+1}: ${p.name||""} (${p.period||""})\n\n**Goal:** ${p.goal||""}\n\n`;
      (p.actions||[]).forEach(a=>{md+=`- ${a}\n`;});
      md+=`\n`;
    });
  }
  // Monthly Plan
  if(s.monthlyPlan&&s.monthlyPlan.length){
    md+=`## 📆 6-Month Action Plan — 月次ロードマップ\n\n`;
    s.monthlyPlan.forEach((mo,i)=>{
      md+=`### Month ${mo.month||i+1} — ${mo.theme||""}\n\n`;
      (mo.todos||[]).forEach(t=>{md+=`- [ ] ${t}\n`;});
      if(mo.milestone)md+=`\n**${mo.month||i+1}ヶ月後の到達状態:** ${mo.milestone}\n`;
      if(mo.motivation)md+=`\n_${mo.motivation}_\n`;
      md+=`\n`;
    });
  }
  // Process Flow
  if(cs.processFlow&&cs.processFlow.length){
    md+=`## ⚙️ Process Flow — 実行プロセス\n\n| Step | Name | Input | Action | Output | Owner |\n|---|---|---|---|---|---|\n`;
    cs.processFlow.forEach((p,i)=>{md+=`| ${p.step||i+1} | ${p.name||""} | ${p.input||""} | ${p.action||""} | ${p.output||""} | ${p.owner||""} |\n`;});
    md+=`\n`;
  }
  // KPI Playbook
  if(cs.kpiPlaybook&&cs.kpiPlaybook.length){
    md+=`## 📊 KPI Playbook\n\n`;
    cs.kpiPlaybook.forEach(k=>{
      md+=`### ${k.kpi||""}\n\n- **現状:** ${k.current||""}\n- **目標:** ${k.target||""}\n- **ギャップ:** ${k.gap||""}\n- **週次ドライバー:** ${k.weeklyDriver||""}\n- **測定方法:** ${k.measureMethod||""}\n\n`;
    });
  }
  // Decision Gates
  if(cs.decisionPoints&&cs.decisionPoints.length){
    md+=`## 🚦 Decision Gates — 判断ゲート\n\n`;
    cs.decisionPoints.forEach(d=>{md+=`### Month ${d.month||"?"} Gate\n\n**Checkpoint:** ${d.checkpoint||""}\n\n- ✅ **IF PASS:** ${d.ifPass||""}\n- ❌ **IF FAIL（ピボット）:** ${d.ifFail||""}\n\n`;});
  }
  // Resources
  if(s.resources){
    md+=`## 💼 Required Resources\n\n- **Budget:** ${s.resources.budget||"-"}\n- **Team:** ${s.resources.team||"-"}\n- **Tools:** ${(s.resources.tools||[]).join(", ")||"-"}\n\n`;
  }
  // Competitive Analysis
  if(s.competitors&&s.competitors.length){
    md+=`## 🏁 Competitive Analysis\n\n| 競合 | 競合の強み | 我々の優位性 |\n|---|---|---|\n`;
    s.competitors.forEach(c=>{const name=c.url?`[${c.name||""}](${c.url})`:(c.name||"");md+=`| ${name} | ${c.strength||""} | ${c.gap||""} |\n`;});
    md+=`\n`;
  }
  // KPI Targets
  if(s.kpi&&s.kpi.length){
    md+=`## 🎯 KPI Targets\n\n`;
    s.kpi.forEach(k=>{md+=`- ${k}\n`;});
    md+=`\n`;
  }
  // Risks
  if(s.risks&&s.risks.length){
    md+=`## ⚠️ Risks & Mitigation\n\n`;
    s.risks.forEach(r=>{md+=`- **▲ ${r.risk||""}**  \n  → ${r.mitigation||""}\n`;});
    md+=`\n`;
  }
  // Manager Evaluation
  if(m){
    md+=`## 📝 Manager Evaluation\n\n**Total Score:** ${total}/100\n\n| 評価項目 | スコア |\n|---|---|\n`;
    SCORE_ITEMS.forEach(k=>{md+=`| ${k} | ${m.scores?.[k]||0}/20 |\n`;});
    md+=`\n`;
    if(m.verdict)md+=`> ${m.verdict}\n\n`;
  }
  // Next Step
  if(s.nextStep)md+=`## 🚀 Next Action\n\n${s.nextStep}\n\n`;
  // Meeting Log
  if(st.history&&st.history.length){
    md+=`---\n\n## 📜 Meeting Log\n\n`;
    st.history.forEach((r,i)=>{
      md+=`### Phase ${i+1}: ${PHASE_JA[i]||""}\n\n`;
      Object.entries(r.answers||{}).forEach(([id,a])=>{md+=`**${AGENTS[id]?.name||id}:**\n\n${a}\n\n`;});
    });
  }
  md+=`\n---\n\n_Generated by Strategy Council · ${date}_\n`;
  const filename=(s.title||"strategy-report").replace(/[\\/:*?"<>|]/g,"_").slice(0,60)+".md";
  dl(new Blob([md],{type:"text/markdown;charset=utf-8"}),filename);
  closeExport();
}

  }catch(e){

// ── FILES ──
async function addFiles(raw){const p=(await Promise.all(raw.map(pf))).filter(Boolean);st.files=[...st.files,...p];render();}
async function pf(f){
  const ext=f.name.split(".").pop().toLowerCase();
  if(f.type==="application/pdf"||ext==="pdf"){
    // PDFはページ内テキストを抽出してtext型として保存
    try{
      const arrayBuf=await f.arrayBuffer();
      const txt=await extractPdfText(arrayBuf);
      return{type:"text",name:f.name,data:txt.slice(0,3000)};
    }catch(e){
      // 抽出失敗時はファイル名のみ記録
      return{type:"text",name:f.name,data:`[${f.name}のテキスト抽出に失敗しました]`};
    }
  }else if(f.type.startsWith("image/")){
    alert("画像ファイルはトークン消費が大きいため対応していません。テキストエリアに内容を貼り付けてください。");
    return null;
  }else{
    const d=await toTxt(f);
    return{type:"text",name:f.name,data:d.slice(0,3000)};
  }
}

async function extractPdfText(arrayBuf){
  // ブラウザでPDFテキスト抽出（pdfjs-distを使用）
  const pdfjsLib=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.mjs");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.mjs";
  const pdf=await pdfjsLib.getDocument({data:arrayBuf}).promise;
  let text="";
  for(let i=1;i<=Math.min(pdf.numPages,10);i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    pages.push(content.items.map(function(item){return item.str;}).join(" "));

  }
  return text||"[テキストを抽出できませんでした]";
}
function b64(f){return new Promise((r,j)=>{const rd=new FileReader();rd.onload=()=>r(rd.result.split(",")[1]);rd.onerror=j;rd.readAsDataURL(f);});}
function toTxt(f){return new Promise((r,j)=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.onerror=j;rd.readAsText(f);});}
function removeFile(i){st.files=st.files.filter((_,idx)=>idx!==i);render();}

async function api(system,msg,retryCount=0,maxTokens=1000){
  const content=[];
  const validFiles=(st.files||[]).filter(f=>f.data&&f.data!=="[binary]");
  // ── 添付資料を「一次情報」として強くアンカリング ──
  // 単なる背景情報ではなく、現状把握の起点として参照を強制
  if(validFiles.length>0){
    content.push({type:"text",text:
      "━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"+
      "【一次情報源 — 添付資料】（最重要：本案件の現状を示す唯一の事実データ）\n"+
      "★以下の資料は本プロジェクトの『確定した現状データ』である。推測値ではなく実数値として扱え。\n"+
      "★競合視点での推定や一般論で上書き／変更せず、必ずこの数値・固有名詞・記述を引用して分析せよ。\n"+
      "★資料に書かれていない情報は『未測定』または『追加調査要』として中立に扱い、勝手に補完するな。\n"+
      "★分析の結論は必ず資料中の具体記述／数値に紐づけて根拠を明示すること。\n"+
      "━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"+
      "添付ファイル数: "+validFiles.length+" 件"
    });
    for(const f of validFiles){
      content.push({type:"text",text:"\n━━ 資料: "+f.name+" ━━\n"+f.data.slice(0,6000)});
    }
    content.push({type:"text",text:"\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n以上が【一次情報源】の終わり。以下は分析タスクのプロンプト。\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━"});
  }
  // 現状把握データ（ブランド検索結果）があれば次に追加
  if(st.brandResearch&&st.brandResearch.trim()){
    content.push({type:"text",text:
      "\n【現状把握データ — ブランド名/屋号検索結果】（添付資料を補完するWeb一次情報）\n"+
      "★以下はSNS・Google評価・Web検索から取得した本案件の実在データ。架空数値で上書きするな。\n"+
      st.brandResearch.slice(0,3000)
    });
  }
  content.push({type:"text",text:msg});
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,system,messages:[{role:"user",content}]})});
  const data=await res.json();
  if(data.error){
    if(res.status===429||data.error.message?.includes("rate limit")||data.error.message?.includes("token")){
      if(retryCount>=3)throw new Error("レート制限：3回リトライしましたが解消されません。数分待ってからリトライしてください。");
      for(let i=120;i>0;i--){
        if(cancelled)throw new Error("__CANCELLED__");
        // statusMsgのみ部分更新（DOM全体を再描画しない）
        st.statusMsg=`レート制限中 — ${i}秒後に自動リトライ (${retryCount+1}/3回目)`;
        const el=document.getElementById("statusMsg");
        if(el)el.textContent=st.statusMsg;
        await new Promise(r=>setTimeout(r,1000));
        if(cancelled)throw new Error("__CANCELLED__");
      }
      return api(system,msg,retryCount+1);
    }
    throw new Error(data.error.message);
  }
  if(!res.ok&&res.status===0)throw new Error("ネットワークエラー：Vercelから開いてください。");
  return data.content[0].text;
}

async function geminiResearch(query){
  if(!geminiKey)return"";
  try{
    const res=await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+geminiKey,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({
         contents:[{role:"user",parts:[{text:query}]}],
         tools:[{google_search:{}}]
       })}
    );
    const data=await res.json();
    if(data.error){console.warn("Gemini Research error:",data.error.message);return"";}
    const text=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
    return text.slice(0,800);
  }catch(e){console.warn("Gemini Research failed:",e.message);return"";}
}

function cleanText(t){
  if(!t)return"";
  // ```json...```ブロックを除去
  t=t.replace(/```json[\s\S]*?```/g,"").replace(/```/g,"").trim();
  // JSONオブジェクトが混入している場合、その手前で切る
  const ji=t.search(/\{"(title|keyInsight|strategy|actions|kpi)"/);
  if(ji>5)return t.slice(0,ji).trim();
  if(ji===0||ji<0&&t.startsWith("{"))return"";
  return t;
}

function pj(t){
  if(!t)return null;
  // まずそのままパース
  try{return JSON.parse(t);}catch(e0){}
  // マークダウン除去
  try{return JSON.parse(t.replace(/```json\n?|```/g,"").trim());}catch(e1){}
  // {から}を抽出
  try{const s=t.indexOf("{");const e=t.lastIndexOf("}");if(s>=0&&e>s)return JSON.parse(t.slice(s,e+1));}catch(e2){}
  return null;
}

async function brandSearchAuto(project,facts){
  if(!geminiKey)return"";
  // プロジェクト名・facts からブランド名・屋号らしき固有名詞を抽出（Claudeで軽量抽出）
  let brandName="";
  try{
    const extractRaw=await api(
      "ユーザーの企画情報から、Web検索すべき固有名詞（屋号・社名・店舗名・ブランド名・サービス名）を最大3つ抽出してください。地名を含む店舗名（『○○ 渋谷店』『美容室○○』等）を優先。固有名詞が見当たらない場合は空配列。JSONのみ：{\"brands\":[\"名称1\",\"名称2\",\"名称3\"],\"businessType\":\"飲食店/サロン/EC/SaaS/その他\",\"hasLocalRelevance\":true/false}",
      "企画：\n"+project.slice(0,500)+"\n\n確定事実：\n"+(facts||"").slice(0,500),
      0,400
    );
    let ex=null;
    try{ex=JSON.parse(extractRaw);}catch(e){}
    if(!ex){try{ex=JSON.parse(extractRaw.replace(/```json\n?|```/g,"").trim());}catch(e){}}
    if(!ex){const si=extractRaw.indexOf("{"),ei=extractRaw.lastIndexOf("}");if(si>=0&&ei>si)try{ex=JSON.parse(extractRaw.slice(si,ei+1));}catch(e){}}
    if(!ex||!ex.brands||ex.brands.length===0)return"";
    brandName=ex.brands.filter(b=>b&&b.length>=2).slice(0,3).join(" / ");
    if(!brandName)return"";
    // ローカル事業ヒントを保存（地域差別化を重視させる）
    if(ex.hasLocalRelevance||["飲食店","サロン","美容室","小売","クリニック"].some(t=>(ex.businessType||"").includes(t))){
      S({isLocalBusiness:true,businessType:ex.businessType||""});
    }
  }catch(e){console.warn("brand extraction failed:",e.message);return"";}

  // Gemini Web検索：4軸で並列に
  const queries=[
    brandName+" 公式サイト 評判 口コミ Google評価",
    brandName+" Instagram フォロワー Twitter SNS",
    brandName+" 食べログ ホットペッパー 競合 価格帯",
    brandName+" 営業時間 アクセス 地域 商圏"
  ];
  const results=[];
  for(const q of queries){
    try{
      const r=await geminiResearch(q+" "+(new Date().getFullYear()));
      if(r&&r.trim())results.push("◆"+q+"\n"+r.slice(0,500));
    }catch(e){console.warn("brand search query failed:",e.message);}
  }
  if(results.length===0)return"";
  return"検索対象ブランド: "+brandName+"\n\n"+results.join("\n\n");
}

議論:${histText}
フェーズ${phaseIdx+1}(${PHASE_JA[phaseIdx]})`;
