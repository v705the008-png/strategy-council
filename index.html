<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy Council</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090C;--bg2:#0E1017;--bg3:#151820;--bg4:#1C2030;
  --border:#1E2438;--border2:#2A3050;
  --text:#E8ECF5;--text2:#7B8BB2;--text3:#3D4A6A;
  --accent:#5B7FFF;--accent2:#3D5FE0;
  --amber:#F0A429;--purple:#9B7FFF;--teal:#2DD4B0;
  --blue:#5BA4FF;--green:#34D48A;--red:#FF5B6B;
  --card-hover:#131620;
}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans JP',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
textarea::-webkit-scrollbar{width:4px}
textarea::-webkit-scrollbar-track{background:var(--bg3)}
textarea::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* HEADER */
header{border-bottom:1px solid var(--border);padding:0 28px;height:52px;display:flex;align-items:center;gap:12px;background:var(--bg2);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#5B7FFF,#9B7FFF);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.htitle{font-size:13px;font-weight:700;letter-spacing:.02em}
.hsub{font-size:10px;color:var(--text3);letter-spacing:.12em;font-family:'Inter',sans-serif}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{background:none;border:1px solid var(--border2);color:var(--text2);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s}
.hbtn:hover{border-color:var(--text2);color:var(--text)}
.hbtn.icon-btn{padding:5px 9px;display:flex;align-items:center;justify-content:center}
.hbtn.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.danger:hover{border-color:var(--red);color:var(--red)}

main{max-width:760px;margin:0 auto;padding:28px 18px}

/* BUTTONS */
.btn{width:100%;padding:12px 16px;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:7px}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-accent:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{background:var(--bg3);border:1px solid var(--border);color:var(--text2);margin-top:8px}
.btn-ghost:hover{border-color:var(--border2);color:var(--text)}
.btn-export{background:var(--bg3);border:1px solid var(--teal);color:var(--teal);margin-top:6px}
.btn-export:hover{background:#0A1F1A}

/* INPUTS */
textarea,input[type=text],input[type=password]{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 13px;font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
textarea{resize:vertical}
textarea:focus,input:focus{border-color:var(--accent)}
textarea::placeholder,input::placeholder{color:var(--text3)}
.lbl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.08em;display:block;margin-bottom:6px;text-transform:uppercase}
.input-wrap{position:relative}
.input-wrap input{padding-right:40px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px}

/* DROP */
.drop{border:1.5px dashed var(--border2);border-radius:9px;padding:16px;text-align:center;cursor:pointer;margin:10px 0;transition:all .2s}
.drop:hover,.drop.drag{border-color:var(--accent);background:#0A0E1A}
.fi-item{display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--border);border-radius:8px;margin-bottom:5px;background:var(--bg3)}
.fi-name{font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi-badge{font-size:9px;padding:2px 7px;border-radius:100px;background:var(--bg4);color:var(--text3);font-weight:600;letter-spacing:.06em}
.fi-rm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0 3px}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;transition:all .2s}

/* PROJECT LIST */
.proj-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.proj-header h2{font-size:18px;font-weight:700}
.proj-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:15px 18px;margin-bottom:8px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:14px}
.proj-card:hover{border-color:var(--border2);background:var(--card-hover);transform:translateX(2px)}
.proj-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.proj-info{flex:1;min-width:0}
.proj-name{font-size:13px;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-meta{font-size:11px;color:var(--text3)}
.proj-status{font-size:10px;padding:3px 9px;border-radius:100px;font-weight:600;letter-spacing:.06em;flex-shrink:0}
.status-running{background:#0A1225;color:var(--accent);border:1px solid #1A2A50}
.status-done{background:#071A0F;color:var(--green);border:1px solid #0F3020}
.proj-actions{display:flex;gap:6px;flex-shrink:0}
.proj-btn{padding:5px 11px;border-radius:6px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid var(--border2);background:none;color:var(--text2);transition:all .15s}
.proj-btn:hover{color:var(--text);border-color:var(--text2)}
.proj-btn.del:hover{color:var(--red);border-color:var(--red)}
.new-proj-btn{width:100%;padding:13px;border:1.5px dashed var(--border2);border-radius:12px;background:none;color:var(--text3);font-size:13px;font-family:inherit;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.new-proj-btn:hover{border-color:var(--accent);color:var(--accent);background:#0A0E1A}

/* AGENT BADGES */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.abadge{font-size:11px;padding:4px 11px;border-radius:100px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-weight:500}

/* PROGRESS */
.prog-wrap{margin-bottom:20px}
.prog-stages{display:flex;align-items:flex-start;gap:0}
.prog-stage{flex:1;text-align:center;position:relative}
.prog-stage:not(:last-child)::after{content:'';position:absolute;top:9px;left:60%;width:80%;height:1.5px;background:var(--border);z-index:0}
.prog-stage.done:not(:last-child)::after{background:var(--accent)}
.prog-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);background:var(--bg);margin:0 auto 5px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;transition:all .3s;color:var(--text3)}
.prog-stage.done .prog-dot{background:var(--accent);border-color:var(--accent);color:#fff}
.prog-stage.active .prog-dot{border-color:var(--accent);color:var(--accent);animation:glow 1.5s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #5B7FFF40}50%{box-shadow:0 0 0 5px #5B7FFF00}}
.prog-name{font-size:9px;color:var(--text3);letter-spacing:.04em;line-height:1.3}
.prog-stage.done .prog-name,.prog-stage.active .prog-name{color:var(--accent)}

/* STATUS */
.status-bar{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;font-size:12px;color:var(--text2)}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sdot.running{background:var(--accent);animation:glow 1.2s infinite}
.sdot.ok{background:var(--green)}
.sdot.err{background:var(--red)}

/* AGENT CARDS */
.agent-card{border:1px solid var(--border);border-radius:11px;padding:13px 15px;margin-bottom:9px;background:var(--bg2);transition:border-color .3s}
.agent-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.agent-name{font-size:11px;font-weight:700;letter-spacing:.04em}
.agent-q{font-size:11px;color:var(--text3);background:var(--bg);padding:5px 10px;border-radius:6px;margin-bottom:8px;line-height:1.6}
.agent-ans{font-size:13px;color:var(--text2);line-height:1.85}
.dots{display:flex;gap:4px;padding:5px 0}
.dot{width:4px;height:4px;border-radius:50%}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
.b1{animation:blink 1.1s infinite}
.b2{animation:blink 1.1s infinite .2s}
.b3{animation:blink 1.1s infinite .4s}

/* HISTORY */
.hist-block{opacity:.28;margin-bottom:20px}
.hist-div{font-size:10px;color:var(--text3);letter-spacing:.14em;margin-bottom:8px;font-weight:600}

/* PHASE */
.phase-lbl{font-size:10px;color:var(--accent);letter-spacing:.15em;font-weight:700;margin-bottom:2px}
.phase-ttl{font-size:15px;font-weight:700;margin-bottom:10px}
.ctx-box{font-size:12px;color:var(--text3);padding:7px 12px 7px 14px;border-left:2px solid var(--accent);border-radius:0 6px 6px 0;margin-bottom:14px;background:var(--bg3)}

/* MANAGER */
.mgr-panel{border:1px solid var(--border);border-radius:13px;overflow:hidden;margin-top:14px}
.mgr-hdr{display:flex;align-items:center;gap:8px;padding:11px 16px;background:var(--bg3);border-bottom:1px solid var(--border)}
.mgr-body{padding:16px}
.env-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:100px;background:#0A1525;color:var(--blue);border:1px solid #1A3050;margin-bottom:13px;font-weight:500}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}
.score-item{background:var(--bg);border-radius:8px;padding:9px 12px;border:1px solid var(--border)}
.score-name{font-size:10px;color:var(--text3);margin-bottom:5px;font-weight:600;letter-spacing:.04em}
.sbar-wrap{height:3px;background:var(--border);border-radius:2px;margin-bottom:5px;overflow:hidden}
.sbar{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.sval{font-size:13px;font-weight:700}
.total-box{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:9px;margin-bottom:12px;border:1px solid var(--border)}
.total-num{font-size:26px;font-weight:800;letter-spacing:-.02em}
.mgr-verdict{font-size:13px;color:var(--text2);line-height:1.85;margin-bottom:10px}
.mgr-feedback{font-size:12px;color:var(--text3);background:var(--bg);padding:8px 12px;border-radius:7px;line-height:1.7;border-left:2px solid var(--amber)}
.loop-badge{margin-left:auto;font-size:10px;padding:2px 9px;border-radius:100px;background:#121000;color:var(--amber);border:1px solid #2A2500;font-weight:600}

/* SUMMARY */
.insight-box{background:linear-gradient(135deg,#100D00,#0A0D1A);border:1px solid #2A2000;border-radius:11px;padding:14px 16px;margin-bottom:12px}
.strat-box{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-bottom:12px}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
.kv-card{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:13px}
.kv-title{font-size:9px;letter-spacing:.14em;margin-bottom:8px;font-weight:700;text-transform:uppercase}
.kv-item{font-size:12px;color:var(--text2);padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:7px;line-height:1.5}
.next-box{background:#080D1A;border:1px solid #1A2545;border-radius:11px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.approved-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:3px 9px;border-radius:100px;background:#071A0F;color:var(--green);border:1px solid #0F3020;font-weight:700}

/* MISC */
.spinner{text-align:center;padding:44px 0;font-size:12px;color:var(--text3);animation:blink 1.5s infinite}
.err{font-size:12px;color:var(--red);background:#120508;border-radius:8px;padding:9px 13px;margin-top:10px;border:1px solid #2A0A10}
.retry-btn{margin-top:8px;padding:5px 13px;border-radius:6px;border:1px solid var(--red);background:none;color:var(--red);font-size:11px;font-family:inherit;cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .3s ease}

/* RESUME BANNER */
.resume-banner{background:#070D07;border:1px solid #0F2A0F;border-radius:10px;padding:12px 15px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.rbtn{padding:5px 12px;border-radius:6px;border:1px solid var(--border2);background:none;font-size:11px;font-family:inherit;cursor:pointer;font-weight:600}
.rbtn-yes{border-color:var(--green);color:var(--green)}
.rbtn-no{color:var(--text3)}

/* EXPORT MODAL */
.modal-overlay{position:fixed;inset:0;background:#00000090;z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:22px;max-width:400px;width:90%}
.modal h3{font-size:14px;font-weight:700;margin-bottom:14px}
.mbtn{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:13px;font-family:inherit;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:all .15s;margin-bottom:7px}
.mbtn:hover{border-color:var(--accent);color:var(--text)}
.modal-close{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--text3);font-size:12px;font-family:inherit;cursor:pointer;margin-top:4px}

/* API KEY SCREEN */
.api-screen{max-width:420px;margin:64px auto;text-align:center}
.api-screen h2{font-size:20px;font-weight:700;margin-bottom:8px}
.api-screen p{font-size:13px;color:var(--text2);line-height:1.75;margin-bottom:22px}
.saved-key-box{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--text3);display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.forget-btn{background:none;border:none;color:var(--red);font-size:11px;cursor:pointer;font-family:inherit;font-weight:600}
.api-note{font-size:11px;color:var(--text3);margin-bottom:18px}
.api-note a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
  <div>
    <div class="htitle">Strategy Council</div>
    <div class="hsub">AIマルチエージェント</div>
  </div>
  <div class="hright" id="hright" style="display:none">
    <button class="hbtn icon-btn" onclick="goProjects()" title="ホームへ戻る">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>
    <button class="hbtn" onclick="goEdit()" title="企画概要を編集">編集</button>
    <button class="hbtn" onclick="showExportModal()">エクスポート</button>
    <button class="hbtn danger" onclick="confirmReset()">リセット</button>
  </div>
</header>

<div id="localWarning" style="display:none;background:#1A0A00;border-bottom:1px solid #3A2000;padding:10px 20px;font-size:12px;color:#F0A429;text-align:center">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ローカルファイルから開いています。APIが動作しません。<strong>Vercel（<a href="https://strategy-council.vercel.app" target="_blank" style="color:#5B7FFF">strategy-council.vercel.app</a>）</strong>からアクセスしてください。
</div>
<main id="app"></main>

<input type="file" id="fileInput" multiple accept=".pdf,.txt,.md,.csv,.json" style="display:none">
<div id="exportModal" style="display:none"></div>

<script>
// ─── CONFIG ───
const AGENTS={
  marketer:{name:"MARKETER",icon:"marketer",color:"#5B7FFF"},
  designer:{name:"DESIGNER",icon:"designer",color:"#5B7FFF"},
  consultant:{name:"CONSULTANT",icon:"consultant",color:"#5B7FFF"},
  researcher:{name:"RESEARCHER",icon:"researcher",color:"#5B7FFF"},
};
const ICONS={
  marketer:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  designer:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
  consultant: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>',
  researcher: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  manager:    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  running:    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/><polyline points="1 20 1 14 7 14"/></svg>',
  done:       '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  logo:       '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
  globe:      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
};
const ROLES={
  marketer:`あなたはシニアマーケターです。与えられた論点に対して、あなたの専門知識から【分析・見解・具体的な提言】を述べてください。
ルール：
・質問は一切しない。情報が不足していても、与えられた情報から最善の分析と提言を行う
・確定数値がある場合は必ずそれを使い、ない場合は「不明」と明記した上で分析する
・「〜ではないでしょうか」「〜を確認してください」などの曖昧表現は使わない
・200字以内で断言口調で具体的に述べる`,

ルール：

  researcher:`あなたはUXリサーチャーです。与えられた論点に対して、あなたの専門知識から【分析・見解・具体的な提言】を述べてください。

・200字以内で断言口調で具体的に述べる`,
};
const PHASES=["課題定義","市場分析","戦略立案","実行計画"];
const PHASE_JA=["課題・ゴール定義","市場・ユーザー分析","戦略立案","実行計画・KPI"];
const SCORE_ITEMS=["市場性","実現性","独自性","戦略整合性","ユーザー共感度"];
const PROJ_KEY="sc_projects";
const APIKEY_KEY="sc_apikey";

// ─── STATE ───
let apiKey="";
let cancelled=false;
let currentProjId=null;
function checkCancelled(){ if(cancelled) throw new Error("__CANCELLED__"); }
let st={
  step:"projects",project:"",files:[],
  phaseIdx:0,questions:null,ctx:"",answers:{},loading:null,
  history:[],mgrState:null,loopCount:0,
  summary:null,error:"",busy:false,statusMsg:"",
};

// ─── PROJECT STORAGE ───
function getProjects(){try{return JSON.parse(localStorage.getItem(PROJ_KEY)||"[]");}catch{return[];}}
function saveProject(proj){
  const projs=getProjects();
  const idx=projs.findIndex(p=>p.id===proj.id);
  if(idx>=0)projs[idx]=proj; else projs.unshift(proj);
  localStorage.setItem(PROJ_KEY,JSON.stringify(projs));
}
function deleteProject(id){
  const projs=getProjects().filter(p=>p.id!==id);
  localStorage.setItem(PROJ_KEY,JSON.stringify(projs));
}
function saveCurrent(){
  if(!currentProjId)return;
  const projs=getProjects();
  const proj=projs.find(p=>p.id===currentProjId)||{id:currentProjId};
  proj.state={...st,files:st.files.map(f=>f.type==="text"?f:{...f,data:"[binary]"})};
  proj.name=st.project?.slice(0,40)||"無題";
  proj.updatedAt=new Date().toISOString();
  proj.status=st.step==="summary"?"done":"running";
  proj.score=st.mgrState?Object.values(st.mgrState.scores||{}).reduce((a,b)=>a+b,0):null;
  saveProject(proj);
}

// ─── RENDER ───
function S(u){
  Object.assign(st,u);
  if(!Array.isArray(st.brushupLog))st.brushupLog=[];
  if(!Array.isArray(st.files))st.files=[];
  if(!Array.isArray(st.history))st.history=[];
  if(st.step!=="projects"&&st.step!=="apikey"&&st.step!=="input")saveCurrent();
  // statusMsgだけの更新なら部分更新（フラッシュ防止）
  if(Object.keys(u).length===1&&u.statusMsg!==undefined){
    const el=document.getElementById("statusMsg");
    if(el){el.textContent=u.statusMsg;return;}
  }
  render();
}

function render(){
  const hr=document.getElementById("hright");
  hr.style.display=(st.step==="meeting"||st.step==="manager"||st.step==="summary"||st.step==="input")?"flex":"none";
  const app=document.getElementById("app");
  // スクロール位置を保持
  const scrollY=window.scrollY;
  if(st.step==="apikey")app.innerHTML=renderApiKey();
  else if(st.step==="projects")app.innerHTML=renderProjects();
  else if(st.step==="input")app.innerHTML=renderInput();
  else if(st.step==="meeting")app.innerHTML=renderMeeting();
  else if(st.step==="manager")app.innerHTML=renderManager();
  else app.innerHTML=renderSummary();
  bindEvents();
  // スクロール位置を復元（カウントダウン中の跳ね防止）
  if(st.busy&&st.statusMsg)window.scrollTo(0,scrollY);
}

// ── API KEY ──
function renderApiKey(){
  const saved=localStorage.getItem(APIKEY_KEY)||"";
  return`<div class="api-screen fade">
    <div style="font-size:32px;margin-bottom:14px">⚡</div>
    <h2>APIキー設定</h2>
    <p>Anthropic APIキーを入力してください。<br>キーはこのブラウザ内にのみ保存されます。</p>
    ${saved?`<div class="saved-key-box"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg> ${saved.slice(0,20)}••••</span><button class="forget-btn" onclick="forgetKey()">削除</button></div>`:""}
    <div class="input-wrap" style="margin-bottom:10px">
      <input type="password" id="apiKeyInput" placeholder="${saved?"変更する場合のみ入力":"sk-ant-api03-..."}"/>
      <button class="eye" onclick="toggleEye()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <p class="api-note">取得先: <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a></p>
    <button class="btn btn-accent" onclick="submitApiKey()">開始する →</button>
  </div>`;
}
function toggleEye(){const i=document.getElementById("apiKeyInput");if(i)i.type=i.type==="password"?"text":"password";}
function forgetKey(){if(confirm("APIキーを削除しますか？")){localStorage.removeItem(APIKEY_KEY);apiKey="";render();}}
function submitApiKey(){
  const v=document.getElementById("apiKeyInput")?.value?.trim();
  const saved=localStorage.getItem(APIKEY_KEY)||"";
  const key=v||saved;
  if(!key||!key.startsWith("sk-"))return alert("正しいAPIキーを入力してください");
  if(v)localStorage.setItem(APIKEY_KEY,v);
  apiKey=key;
  S({step:"projects"});
}

// ── PROJECTS ──
function renderProjects(){
  const projs=getProjects();
  const list=projs.length===0
    ?`<div style="text-align:center;padding:40px 0;color:var(--text3);font-size:13px">プロジェクトがありません<br><span style="font-size:11px">下のボタンから新規作成してください</span></div>`
    :projs.map(p=>{
      const d=new Date(p.updatedAt);
      const dateStr=`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
      const statusEl=p.status==="done"
        ?`<span class="proj-status status-done">✓ DONE${p.score?` · ${p.score}pt`:""}</span>`
        :`<span class="proj-status status-running">● 進行中</span>`;
      const icon=p.status==="done"?ICONS.done:ICONS.running;
      return`<div class="proj-card" onclick="openProject('${p.id}')">
        <div class="proj-icon" style="background:${p.status==="done"?"#071A0F":"#0A0E1A"}">${icon}</div>
        <div class="proj-info">
          <div class="proj-name">${p.name||"無題"}</div>
          <div class="proj-meta">更新: ${dateStr}</div>
        </div>
        ${statusEl}
        <div class="proj-actions" onclick="event.stopPropagation()">
          ${p.status!=="done"?`<button class="proj-btn" onclick="event.stopPropagation();openProject('${p.id}')">再開</button>`:""}
          <button class="proj-btn del" onclick="event.stopPropagation();removeProject('${p.id}')">削除</button>
        </div>
      </div>`;
    }).join("");
  return`<div class="fade">
    <div class="proj-header">
      <div>
        <div style="font-size:11px;color:var(--text3);letter-spacing:.1em;margin-bottom:3px">PROJECTS</div>
        <h2>マイプロジェクト</h2>
      </div>
      <button class="hbtn" onclick="S({step:'apikey'})">APIキー設定</button>
    </div>
    ${list}
    <button class="new-proj-btn" onclick="newProject()">＋ 新規プロジェクト</button>
  </div>`;
}
function openProject(id){
  const projs=getProjects();
  const proj=projs.find(p=>p.id===id);
  if(!proj){alert("プロジェクトが見つかりません");return;}
  currentProjId=id;
  if(proj.state&&proj.state.step){
    // stateが存在して有効なstepがある場合のみ復元
    Object.assign(st,proj.state);
    st.busy=false;st.loading=null;st.error="";
    if(!Array.isArray(st.brushupLog))st.brushupLog=[];
    if(!Array.isArray(st.files))st.files=[];
    if(!Array.isArray(st.history))st.history=[];
    if(!st.step||st.step==="projects")st.step="input";
  } else {
    // stateがない場合はinput画面で開く
    st.step="input";
    st.project=proj.name||"";
    st.files=[];
    st.history=[];
    st.brushupLog=[];
  }
  render();
}

async function resumeFromSave(){
  cancelled=false;
  if(!apiKey||!apiKey.startsWith("sk-")){
    S({error:"APIキーが見つかりません。ページを再読み込みしてください。"});
    return;
  }
  // バイナリファイルが[binary]になっている場合は除去
  const binaryFiles=st.files.filter(f=>f.data==="[binary]");
  if(binaryFiles.length>0){
    st.files=st.files.filter(f=>f.data!=="[binary]");
    S({needsReattach:binaryFiles.map(f=>f.name)});
  }
  const h=st.history||[];
  const phasesDone=h.length;
  if(st.step==="manager"){
    S({busy:true,statusMsg:"マネージャー審査を再開中...",error:""});
    const histText=buildHistText(h);
    const loopCount=st.loopCount||0;
    await runManagerAuto(histText,"",loopCount,h);
  } else if(phasesDone<PHASE_JA.length){
    const nextPhase=phasesDone;
    S({busy:true,statusMsg:`Phase ${nextPhase+1}から再開中...`,answers:{},questions:null,error:""});
    await runPhase(nextPhase,h);
  } else {
    S({error:"再開できる状態ではありません。新規プロジェクトを作成してください。"});
  }
}
function newProject(){
  currentProjId="proj_"+Date.now();
  st={step:"input",project:"",files:[],facts:"",phaseIdx:0,questions:null,ctx:"",answers:{},loading:null,history:[],mgrState:null,loopCount:0,summary:null,error:"",busy:false,statusMsg:""};
  render();
}
function removeProject(id){
  cancelled=true;
  setTimeout(()=>{
    cancelled=false;
    deleteProject(id);
    if(currentProjId===id){currentProjId=null;st={...st,step:"projects"};}
    render();
  },100);
}

// ── INPUT ──
function renderInput(){
  const flist=st.files&&st.files.length>0?st.files.map((f,i)=>`<div class="fi-item"><span style="font-size:11px;color:var(--text3);font-weight:600">${f.type==="pdf"?"PDF":"TXT"}</span><span class="fi-name">${f.name}</span><button class="fi-rm" onclick="removeFile(${i})">×</button></div>`).join(""):"";
  return`<div class="fade">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px">
      <button onclick="S({step:'projects'})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1">‹</button>
      <div style="font-size:13px;font-weight:600;color:var(--text2)">新規プロジェクト</div>
    </div>
    <div class="badges">
      ${Object.values(AGENTS).map(a=>`<span class="abadge" style="display:inline-flex;align-items:center;gap:5px"><span style="color:var(--text3)">${ICONS[a.icon]}</span>${a.name}</span>`).join("")}
      <span class="abadge" style="border-color:var(--border2);color:var(--text2);display:inline-flex;align-items:center;gap:5px">${ICONS.manager} MANAGER</span>
    </div>
    <label class="lbl">企画の概要</label>
    <textarea id="ptxt" rows="5" placeholder="例：30代向けオーガニックスキンケアブランドをD2Cで展開したい。競合は資生堂ナチュラルライン。初年度予算3000万円。">${st.project}</textarea>
    <label class="lbl" style="margin-top:12px">確定している事実・数値（任意）</label>
    <textarea id="factstxt" rows="4" placeholder="例：&#10;・月間問い合わせ数：約30件&#10;・成約率：10%&#10;・客単価：15万円&#10;・主な流入：紹介80%、SNS20%&#10;※エージェントはここに書いた数値を推論せず事実として使います">${st.facts||""}</textarea>
    <label class="lbl" style="margin-top:12px">参考資料（任意）</label>
    <div class="drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div style="margin-bottom:5px;color:var(--text3)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></div>
      <div style="font-size:12px;color:var(--text2)">PDF・テキストをドロップ（画像不可）</div>
      <div style="font-size:10px;color:var(--text3);margin-top:2px">テキストに変換して送信されます</div>
    </div>
    ${flist}
    <label class="lbl" style="margin-top:8px">または直接テキストで入力</label>
    <textarea id="materialtxt" rows="3" placeholder="資料の内容や補足情報をここに直接入力することもできます">${st.materials||""}</textarea>
    ${st.error?`<div class="err">${st.error}</div>`:""}
    <button class="btn btn-accent" id="startBtn" onclick="startMeeting()" ${st.project.trim()?"":"disabled"}>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Start MTG
    </button>
    ${st.history&&st.history.length>0?`<button class="btn btn-ghost" style="margin-top:6px" onclick="backToMeeting()">← 会議画面に戻る</button>`:""}
    <button class="btn btn-ghost" onclick="S({step:'projects'})">← 戻る</button>
  </div>`;
}

// ── MEETING ──
function renderMeeting(){
  const progDots=["課題定義","市場分析","戦略立案","実行計画","Manager審査"].map((name,i)=>{
    const cls=i<st.phaseIdx?"done":i===st.phaseIdx?"active":"";
    return`<div class="prog-stage ${cls}"><div class="prog-dot">${i<st.phaseIdx?"✓":i+1}</div><div class="prog-name">${name}</div></div>`;
  }).join("");
  const sdot=st.error?`<div class="sdot err"></div>`:`<div class="sdot ${st.busy?"running":"ok"}"></div>`;
  const statusBox=`<div class="status-bar">${sdot}<span id="statusMsg" style="font-size:12px">${st.error||st.statusMsg||"自動実行中..."}</span></div>`;
  const reattachBanner="";
  const hist=st.history.map((r,ri)=>`<div class="hist-block"><div class="hist-div">── ${PHASES[ri]} · ${PHASE_JA[ri]} ──</div>${Object.entries(r.answers).map(([id,a])=>`<div class="agent-card" style="border-color:var(--border2)"><div class="agent-head"><span style="color:var(--text3);display:flex">${ICONS[AGENTS[id].icon]}</span><span class="agent-name" style="color:var(--accent)">${AGENTS[id].name}</span></div><div class="agent-ans">${a}</div></div>`).join("")}</div>`).join("");
  let cur="";
  if(!st.questions&&!st.busy){
    // 止まっている状態 - 再開ボタンを表示
    cur=`<div style="text-align:center;padding:32px 0">
      <div style="font-size:13px;color:var(--text2);margin-bottom:16px">会議が一時停止しています</div>
      <button class="btn btn-accent" style="max-width:240px" onclick="retryFromError()">▶ 続きから再開する</button>
    </div>`;
  } else if(!st.questions&&st.busy){cur=`<div class="spinner">質問を生成中...</div>`;}
  else if(st.questions){
    const cards=Object.keys(AGENTS).map(id=>{
      const a=st.answers[id],isL=st.loading===id,q=st.questions[id]||"";
      return`<div class="agent-card" style="border-color:${a?AGENTS[id].color+"30":"var(--border)"}">
        <div class="agent-head"><span style="color:var(--text3);display:flex;align-items:center">${ICONS[AGENTS[id].icon]||""}</span><span class="agent-name" style="color:var(--accent)">${AGENTS[id].name}</span>
        <span style="margin-left:auto;font-size:10px;color:${a?"var(--green)":isL?"var(--accent)":"var(--text3)"}">${a?"✓ 完了":isL?"考え中...":"待機中..."}</span>
        </div>${q?`<div class="agent-q">${q}</div>`:""}
        ${a?`<div class="agent-ans">${a}</div>`:isL?`<div class="dots"><div class="dot b1" style="background:${AGENTS[id].color}"></div><div class="dot b2" style="background:${AGENTS[id].color}"></div><div class="dot b3" style="background:${AGENTS[id].color}"></div></div>`:""}
      </div>`;
    }).join("");
    cur=`<div class="fade"><div class="phase-lbl">${PHASES[st.phaseIdx]}</div><div class="phase-ttl">${PHASE_JA[st.phaseIdx]}</div>${st.ctx?`<div class="ctx-box">${st.ctx}</div>`:""}${cards}</div>`;
  }
  return`<div><div class="prog-wrap"><div class="prog-stages">${progDots}</div></div>${statusBox}${reattachBanner}${hist}${cur}${st.error?`<div class="err">${st.error}<br><button class="retry-btn" onclick="retryFromError()">リトライ</button></div>`:""}</div>`;
}

// ── MANAGER ──
function renderManager(){
  // First time (no mgrState yet): show spinner
  if(!st.mgrState&&!st.busy)return`<div style="text-align:center;padding:32px 0">
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">マネージャー審査が一時停止しています</div>
    <button class="btn btn-accent" style="max-width:240px" onclick="retryFromError()">▶ 続きから再開する</button>
  </div>`;
  if(!st.mgrState)return`<div class="spinner">マネージャーが仮想空間でシミュレーション中...<br><span style="font-size:11px;display:block;margin-top:6px">ループ ${st.loopCount}/30</span></div>`;
  const m=st.mgrState;if(!m)return`<div class="spinner">読み込み中...</div>`;
  const total=Object.values(m.scores||{}).reduce((a,b)=>a+b,0);
  const approved=total>=95;
  const sc=approved?"var(--green)":total>=70?"var(--amber)":"var(--red)";
  const sbg=approved?"#071A0F":total>=70?"#1A1300":"#1A0508";
  const scoreCards=SCORE_ITEMS.map(k=>{
    const v=m.scores?.[k]||0;const c=v>=19?"var(--green)":v>=15?"var(--amber)":"var(--red)";
    return`<div class="score-item"><div class="score-name">${k}</div><div class="sbar-wrap"><div class="sbar" style="width:${v*5}%;background:${c}"></div></div><div class="sval" style="color:${c}">${v}<span style="font-size:10px;color:var(--text3)">/20</span></div></div>`;
  }).join("");
  const statusMsg=approved?`<div style="font-size:12px;color:var(--green);padding:6px 0;animation:blink 1.5s infinite">✓ Approved — 最終レポートを生成中...</div>`
    :st.loopCount>=30?`<div class="err">最大回数（30回）に到達。最高スコア案で提出します。</div>`
    :`<div style="font-size:12px;color:var(--text3);padding:6px 0;animation:blink 1.5s infinite">ブラッシュアップ中... (${st.loopCount}/30)</div>`;
  return`<div class="fade">
    <div class="mgr-panel">
      <div class="mgr-hdr">
        ${ICONS.manager}
        <span style="font-size:12px;font-weight:700;letter-spacing:.04em">マネージャー審査</span>
        <span class="loop-badge">ループ ${st.loopCount}/30</span>
        ${approved?`<span style="margin-left:8px;font-size:10px;font-weight:700;color:var(--green)">✓ 承認済み</span>`:""}
      </div>
      <div class="mgr-body">
        ${m.env?`<div class="env-badge" style="display:inline-flex;align-items:center;gap:5px">${ICONS.globe} ${m.env}</div>`:""}
        <div class="score-grid">${scoreCards}</div>
        <div class="total-box" style="background:${sbg}">
          <div><div style="font-size:10px;color:var(--text3);margin-bottom:2px;letter-spacing:.08em">TOTAL SCORE</div>
          <div class="total-num" style="color:${sc}">${total}<span style="font-size:13px;font-weight:400">/100</span></div></div>
          <div style="font-size:11px;font-weight:700;color:${sc}">${approved?"✓ 95点以上 承認":total>=70?"△ ブラッシュアップ中":"✗ 再検討中"}</div>
        </div>
        ${m.verdict?`<div class="mgr-verdict">${m.verdict}</div>`:""}
        ${m.feedback&&!approved?`<div class="mgr-feedback">${m.feedback}</div>`:""}
        ${st.busy && !st.brushupProgress?.active ? `<div style="font-size:12px;color:var(--text3);padding:6px 0;animation:blink 1.5s infinite">${st.statusMsg||"マネージャーが審査中..."}</div>` : statusMsg}
        ${(()=>{return (st.brushupLog&&Array.isArray(st.brushupLog)&&st.brushupLog.length>0)?renderBrushupProgress():"";})()}
      </div>
    </div>
    ${st.error?`<div class="err">${st.error}<br><button class="retry-btn" onclick="retryBrushup()">リトライ</button></div>`:""}
  </div>`;
}

function renderBrushupProgress(){
  if(!st.brushupLog||!Array.isArray(st.brushupLog)||st.brushupLog.length===0)return"";
  const rounds=st.brushupLog.map(round=>{
    const cards=Object.keys(AGENTS).map(id=>{
      const entry=round.agents[id];
      if(!entry)return"";
      const isDone=entry.status==="done";
      const isThinking=entry.status==="thinking";
      return`<div style="border:1px solid ${isDone?AGENTS[id].color+"50":isThinking?AGENTS[id].color+"80":"var(--border)"};border-radius:8px;padding:9px 12px;margin-bottom:6px;background:var(--bg);transition:all .3s">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:${isDone?"5px":"0"}">
          <span style="color:var(--text3);display:flex">${ICONS[AGENTS[id].icon]}</span>
          <span style="font-size:11px;font-weight:700;color:var(--accent)">${AGENTS[id].name}</span>
          <span style="margin-left:auto;font-size:10px;color:${isDone?"var(--green)":isThinking?"var(--accent)":"var(--text3)"};font-weight:600">${isDone?"✓ 完了":isThinking?"改善中...":"待機"}</span>
        </div>
        ${isThinking?`<div style="display:flex;gap:4px;padding:3px 0"><div class="dot b1" style="background:var(--accent)"></div><div class="dot b2" style="background:var(--accent)"></div><div class="dot b3" style="background:var(--accent)"></div></div>`:""}
        ${isDone&&entry.ans?`<div style="font-size:12px;color:var(--text2);line-height:1.75;margin-top:2px">${entry.ans}</div>`:""}
      </div>`;
    }).join("");
    return`<div style="margin-bottom:16px">
      <div style="font-size:10px;color:var(--amber);letter-spacing:.1em;font-weight:700;margin-bottom:8px">ROUND ${round.round} — ${round.feedback||"品質改善中"}</div>
      ${cards}
    </div>`;
  }).join("");
  return`<div style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px">${rounds}</div>`;
}

  st.busy=false;
  st.error="";

}

function goEdit(){
  // 進行中の内容を保持したままinput画面へ
  cancelled=true;
  saveCurrent();
  setTimeout(()=>{
    cancelled=false;
    // stepだけinputに戻す（project/facts/filesは保持）
    st.step="input";
    st.busy=false;
    st.loading=null;
    st.error="";
    render();
  },150);
}

}

function buildReport(){
  const s=st.summary||{};const m=st.mgrState;
  const total=Object.values(m?.scores||{}).reduce((a,b)=>a+b,0);
  let t=`STRATEGY COUNCIL — Final Report\n${"═".repeat(50)}\n\n`;
  t+=`Project: ${st.project}\nGenerated: ${new Date().toLocaleString("ja-JP")}\n\n`;
  t+=`${"─".repeat(40)}\nMEETING LOG\n\n`;
  st.history.forEach((r,i)=>{t+=`■ Phase ${i+1}: ${PHASE_JA[i]}\n`;Object.entries(r.answers).forEach(([id,a])=>{t+=`\n[${AGENTS[id].name}]\n${a}\n`;});t+="\n";});

function bindEvents(){

async function addFiles(raw){const p=(await Promise.all(raw.map(pf))).filter(Boolean);st.files=[...st.files,...p];render();}
async function pf(f){
  const ext=f.name.split(".").pop().toLowerCase();
  if(f.type==="application/pdf"||ext==="pdf"){
    // PDFはページ内テキストを抽出してtext型として保存
    try{
      const arrayBuf=await f.arrayBuffer();
      const txt=await extractPdfText(arrayBuf);
      return{type:"text",name:f.name,data:txt.slice(0,3000)};
    }catch(e){
      // 抽出失敗時はファイル名のみ記録
      return{type:"text",name:f.name,data:`[${f.name}のテキスト抽出に失敗しました]`};
    }
  }else if(f.type.startsWith("image/")){
    alert("画像ファイルはトークン消費が大きいため対応していません。テキストエリアに内容を貼り付けてください。");
    return null;
  }else{
    const d=await toTxt(f);
    return{type:"text",name:f.name,data:d.slice(0,3000)};
  }
}

async function extractPdfText(arrayBuf){
  // ブラウザでPDFテキスト抽出（pdfjs-distを使用）
  const pdfjsLib=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.mjs");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.mjs";
  const pdf=await pdfjsLib.getDocument({data:arrayBuf}).promise;
  let text="";
  for(let i=1;i<=Math.min(pdf.numPages,10);i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    pages.push(content.items.map(function(item){return item.str;}).join(" "));

  }
  return text||"[テキストを抽出できませんでした]";
}
function b64(f){return new Promise((r,j)=>{const rd=new FileReader();rd.onload=()=>r(rd.result.split(",")[1]);rd.onerror=j;rd.readAsDataURL(f);});}
function toTxt(f){return new Promise((r,j)=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.onerror=j;rd.readAsText(f);});}
function removeFile(i){st.files=st.files.filter((_,idx)=>idx!==i);render();}

// ── API ──
async function api(system,msg,retryCount=0){
  const content=[];
  for(const f of (st.files||[])){
    if(f.data&&f.data!=="[binary]"){
      content.push({type:"text",text:"[資料: "+f.name+"]\n"+f.data.slice(0,2000)});
    }
  }
  content.push({type:"text",text:msg});
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,system,messages:[{role:"user",content}]})});
  const data=await res.json();
  if(data.error){
    if(res.status===429||data.error.message?.includes("rate limit")||data.error.message?.includes("token")){
      if(retryCount>=3)throw new Error("レート制限：3回リトライしましたが解消されません。数分待ってからリトライしてください。");
      for(let i=120;i>0;i--){
        if(cancelled)throw new Error("__CANCELLED__");
        // statusMsgのみ部分更新（DOM全体を再描画しない）
        st.statusMsg=`レート制限中 — ${i}秒後に自動リトライ (${retryCount+1}/3回目)`;
        const el=document.getElementById("statusMsg");
        if(el)el.textContent=st.statusMsg;
        await new Promise(r=>setTimeout(r,1000));
        if(cancelled)throw new Error("__CANCELLED__");
      }
      return api(system,msg,retryCount+1);
    }
    throw new Error(data.error.message);
  }
  if(!res.ok&&res.status===0)throw new Error("ネットワークエラー：Vercelから開いてください。");
  return data.content[0].text;
}
function pj(t){try{return JSON.parse(t.replace(/```json\n?|```/g,"").trim());}catch{return null;}}

// ── PROMPTS ──
const FAC=`あなたはマーケティング戦略会議の司会AIです。各エージェントに「論点・分析テーマ」を与えてください。
重要：questionsフィールドは「質問文」ではなく「このフェーズでそのエージェントが分析・提言すべき論点」を書いてください。
例：「この企画のターゲット層に対する最適な獲得チャネルを分析し、優先順位をつけて提言せよ」
JSONのみ出力（他テキスト不要）：{"phase":"フェーズ名","questions":{"marketer":"論点","designer":"論点","consultant":"論点","researcher":"論点"},"context":"このフェーズの目的40字以内"}`;
const MGR=`あなたはシニアマーケティングマネージャーです。エージェントチームが議論・提言した戦略を総合的に評価し、企画内容に最適な仮想空間（Instagram、Web、店舗等）でシミュレーションしてください。採点基準（各20点）：市場性・実現性・独自性・戦略整合性・ユーザー共感度。不足情報は推測で補い、必ず採点と提言を行ってください。質問はしないこと。JSONのみ出力：{"env":"仮想空間名","scores":{"市場性":数値,"実現性":数値,"独自性":数値,"戦略整合性":数値,"ユーザー共感度":数値},"verdict":"総評100字","feedback":"95点未満の具体的改善指示100字（95点以上は空文字）","revisedStrategy":"改善戦略150字（95点未満のみ）"}`;
const SUM=`マーケティング戦略会議の統括AIとして、マネージャーに承認された最終戦略をまとめてください。JSONのみ出力：{"title":"戦略タイトル","keyInsight":"最重要インサイト50字","strategy":"統合戦略200字","actions":["アクション1","アクション2","アクション3"],"kpi":["KPI1","KPI2","KPI3"],"nextStep":"今すぐやること50字"}`;

// ── FULL AUTO FLOW ──
async function startMeeting(){
  if(!st.project.trim())return;
  cancelled=false;
  S({step:"meeting",brushupProgress:null,brushupLog:[],busy:true,error:"",statusMsg:"会議を開始します...",phaseIdx:0,history:[],answers:{},questions:null,ctx:""});
  await runPhase(0,[]);
}
async function runPhase(phaseIdx,history){
  S({phaseIdx,answers:{},questions:null,ctx:"",statusMsg:`Phase ${phaseIdx+1}「${PHASE_JA[phaseIdx]}」 質問を生成中...`});
  const histText=buildHistText(history);
  try{
    checkCancelled();
    const factsSection=st.facts?.trim()?`
【確定数値（推論禁止）】${st.facts.slice(0,200)}`:"";
    const matsSection=st.materials?.trim()?`
【参考資料】${st.materials.slice(0,300)}`:"";
    const msg=history.length===0
      ?`企画:${st.project.slice(0,200)}${factsSection}${matsSection}
フェーズ1(${PHASE_JA[0]})`
      :`企画:${st.project.slice(0,200)}${factsSection}
議論:${histText}
フェーズ${phaseIdx+1}(${PHASE_JA[phaseIdx]})`;
    const raw=await api(FAC,msg);const p=pj(raw)||{};
    S({questions:p.questions||{},ctx:p.context||"",busy:false,statusMsg:`Phase ${phaseIdx+1}「${PHASE_JA[phaseIdx]}」 エージェントが回答中...`});
    const answers=await runAgentsAuto(p.questions||{},phaseIdx);
    const newHistory=[...history,{phase:PHASE_JA[phaseIdx],questions:p.questions||{},answers}];
    S({history:newHistory,answers:{}});
    if(phaseIdx+1<PHASE_JA.length){
      // フェーズ間30秒待機
      for(let w=30;w>0;w--){
        if(cancelled)throw new Error("__CANCELLED__");
        st.statusMsg=`次のフェーズまで ${w}秒待機中...`;
        const el=document.getElementById("statusMsg");
        if(el)el.textContent=st.statusMsg;
        await new Promise(r=>setTimeout(r,1000));
      }
      await runPhase(phaseIdx+1,newHistory);
    } else{
      // マネージャーへの提出前に45秒待機
      for(let w=45;w>0;w--){
        if(cancelled)throw new Error("__CANCELLED__");
        st.statusMsg=`マネージャーへ提出まで ${w}秒待機中...`;
        const el=document.getElementById("statusMsg");
        if(el)el.textContent=st.statusMsg;
        await new Promise(r=>setTimeout(r,1000));
      }
      S({step:"manager",loopCount:0,mgrState:null,busy:true,statusMsg:"マネージャーへ提出中..."});
      await runManagerAuto(buildHistText(newHistory),"",0,newHistory);
    }
  }catch(e){if(e.message==="__CANCELLED__")return;S({error:e.message,busy:false,statusMsg:""});}
}
async function runAgentsAuto(qs,phaseIdx){
  const answers={};
  const agentKeys=Object.keys(AGENTS);
  for(let i=0;i<agentKeys.length;i++){
    const id=agentKeys[i];
    S({loading:id,statusMsg:`${PHASES[phaseIdx]} — ${AGENTS[id].name} が回答中... (${i+1}/${agentKeys.length})`});
    try{
      checkCancelled();
      const factsNote=st.facts?.trim()?`
【必須前提・確定数値（推論で変えるな）】${st.facts.slice(0,200)}`:"";
      const ans=await api(ROLES[id],`企画：${st.project}${factsNote}
質問：${qs[id]||"このフェーズについて専門的見解を述べてください。"}`);
      answers[id]=ans;
      st.answers={...st.answers,[id]:ans};
      S({loading:id});
      // 次のエージェントまで20秒待機（レート制限対策）
      if(i<agentKeys.length-1){
        for(let w=20;w>0;w--){
          if(cancelled)throw new Error("__CANCELLED__");
          st.statusMsg=`次のエージェントまで ${w}秒待機中...`;
          const el=document.getElementById("statusMsg");
          if(el)el.textContent=st.statusMsg;
          await new Promise(r=>setTimeout(r,1000));
        }
      }
    }
    catch(e){if(e.message==="__CANCELLED__")throw e;S({error:e.message,loading:null});throw e;}
  }
  S({loading:null});return answers;
}
async function runManagerAuto(histText,prevRevised,loopCount,history){
  // Keep previous mgrState so the score panel stays visible during loading
  S({loopCount,busy:true,statusMsg:`マネージャーがシミュレーション中... (第${loopCount+1}回目)`});
  const combined=prevRevised?`${histText}\n\n[Revised]\n${prevRevised}`:histText;
  try{
    checkCancelled();
    const factsForMgr=st.facts?.trim()?`\n【確定事実】${st.facts.slice(0,150)}`:"";    const raw=await api(MGR,`企画：${st.project}${factsForMgr}\n\n戦略案：\n${combined}\nブラッシュアップ回数：${loopCount}`);
    const m=pj(raw)||{};const total=Object.values(m.scores||{}).reduce((a,b)=>a+b,0);
    S({mgrState:m,loopCount,busy:false});saveCurrent();
    if(total>=95||loopCount>=30)setTimeout(()=>generateFinalAuto(history,m),600);
    else await brushupAuto(histText,m,loopCount+1,history);
  }catch(e){
    if(e.message==="__CANCELLED__")return;
    S({error:e.message,busy:false,statusMsg:""});
  }
}
async function brushupAuto(histText,prevMgr,newCount,history){
  const feedback=prevMgr?.feedback||"";
  const revised={};
  const fbShort=feedback.slice(0,80);

  // Helper: build completely new log array (never mutate in place)
  function updateLog(agentId, agentData){
    const prev=st.brushupLog;
    const lastIdx=prev.length-1;
    const newAgents={...prev[lastIdx].agents,[agentId]:agentData};
    const newLast={...prev[lastIdx],agents:newAgents};
    const newLog=[...prev.slice(0,lastIdx),newLast];
    return newLog;
  }

  // Add new round with empty agents
  const newLog=[...st.brushupLog,{round:newCount,feedback:fbShort,agents:{}}];
  S({busy:true, brushupLog:newLog, statusMsg:`ブラッシュアップ ${newCount}/30回 — 改善開始...`});

  for(const id of Object.keys(AGENTS)){
    // thinking state - fully immutable update
    S({brushupLog:updateLog(id,{status:"thinking",ans:""}),
       statusMsg:`ブラッシュアップ ${newCount}/30回 — ${AGENTS[id].name} が改善中...`});
    try{
      checkCancelled();
      const ans=await api(
        ROLES[id],
        `改善指示：${feedback}\n企画：${st.project.slice(0,100)}\n結論のみ50字で`
      );
      revised[id]=ans;
      // done state - fully immutable update
      S({brushupLog:updateLog(id,{status:"done",ans}),
         statusMsg:`ブラッシュアップ ${newCount}/30回 — ${AGENTS[id].name} 完了`});
    }
    catch(e){if(e.message==="__CANCELLED__")throw e;S({error:e.message,busy:false});throw e;}
  }

  const revisedText=Object.entries(revised).map(([id,a])=>`${AGENTS[id].name}(revised): ${a}`).join("\n");
  await runManagerAuto(histText,(prevMgr?.revisedStrategy||"")+"\n"+revisedText,newCount,history);
}
async function generateFinalAuto(history,mgrResult){
  S({busy:true,statusMsg:"最終レポートを生成中..."});
  const total=Object.values(mgrResult?.scores||{}).reduce((a,b)=>a+b,0);
  try{
    const raw=await api(SUM,`企画：${st.project}\n\n会議ログ：\n${buildHistText(history)}\nManagerスコア：${total}点\n総評：${mgrResult?.verdict||""}`);
    S({summary:pj(raw)||{title:"Strategy Report",strategy:raw},step:"summary",busy:false,statusMsg:""});
    saveCurrent();
  }catch(e){if(e.message==="__CANCELLED__")return;S({error:e.message,busy:false,statusMsg:""});}
}

async function reattachFiles(input){
  const raw=Array.from(input.files);
  const processed=await Promise.all(raw.map(pf));
  // 既存ファイルと重複しないよう追加
  const existing=st.files.map(f=>f.name);
  const newFiles=processed.filter(f=>!existing.includes(f.name));
  st.files=[...st.files,...newFiles];
  // 再添付リストから削除
  const reattached=processed.map(f=>f.name);
  const remaining=(st.needsReattach||[]).filter(n=>!reattached.includes(n));
  S({needsReattach:remaining.length>0?remaining:null});
  input.value="";
  // 全て再添付完了したら自動再開
  if(remaining.length===0){
    setTimeout(()=>resumeFromSave(),500);
  }
}
async function retryFromError(){
  S({error:""});
  try{
    await resumeFromSave();
  }catch(e){
    if(e.message!=="__CANCELLED__"){
      S({error:e.message,busy:false});
    }
  }
}
async function retryBrushup(){if(!st.mgrState)return;S({error:""});await brushupAuto(buildHistText(st.history),st.mgrState,st.loopCount+1,st.history);}
function buildHistText(hist){
  return hist.map((r,i)=>`[Phase${i+1}:${PHASE_JA[i]}]`+Object.entries(r.answers).map(([id,a])=>`${AGENTS[id].name}:${a.slice(0,150)}`).join("|")).join("\n");
}

function confirmReset(){
  cancelled=true;
  setTimeout(()=>{
    cancelled=false;
    if(st.step==="summary"){
      // サマリー画面ならプロジェクト一覧へ
      S({step:"projects"});
    } else {
      resetCurrent();
    }
  },150);
}
function resetCurrent(){st={...st,step:"input",phaseIdx:0,questions:null,ctx:"",answers:{},loading:null,history:[],mgrState:null,loopCount:0,summary:null,error:"",busy:false,statusMsg:"",brushupProgress:null,brushupLog:[],needsReattach:null};render();}
